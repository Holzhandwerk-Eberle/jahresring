<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jahresring</title>
<link rel="icon" href="jahresring.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b3530">
<style>
:root{
  --bg:#e7e3dc; --karte:#fff; --text:#2a2622; --leise:#7a7168; --linie:#ddd6cc;
  --dunkel:#3b3530; --akzent:#9a6a3a; --akzent2:#b8834f; --hell:#f4efe8; --label:#efe6da;
  --zeile:#f7f4ef; --zeile2:#efeae2; --rot:#b04236; --gruen:#4d7a45;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:var(--dunkel)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
#leiste{position:sticky;top:0;z-index:15;background:var(--dunkel);color:#efe8de;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb-marke{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:0 0 auto}
.lb-mono{width:32px;height:32px;border-radius:7px;background:var(--akzent2);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.lb-name{display:flex;flex-direction:column;line-height:1.1;font-weight:600;font-size:14px;letter-spacing:.2px}
.lb-ring{width:30px;height:30px;display:block;opacity:.95}
/* Jahresring als stilles Wasserzeichen im Hintergrund (nur Bildschirm) */
body:not(.anmelde-body)::after{content:"";position:fixed;right:-140px;bottom:-160px;width:620px;height:620px;background:url(jahresring.svg) center/contain no-repeat;opacity:.07;pointer-events:none;z-index:0}
#kopf,#inhalt,#seite,.wrap{position:relative;z-index:1}
body.anmelde-body::before{content:"";position:fixed;left:50%;top:50%;width:min(900px,140vw);height:min(900px,140vw);transform:translate(-50%,-50%);background:url(jahresring.svg) center/contain no-repeat;opacity:.08;pointer-events:none}
.anm-box{position:relative;z-index:1}
.anm-marke img{width:40px;height:40px}
@media print{body::after,body::before{display:none!important}}
.lb-name small{font-weight:400;color:#bfb3a5;font-size:11.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-name small:empty{display:none}
.lb-nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
.lb-nav a{color:#d9cfc2;text-decoration:none;padding:0 11px;display:flex;align-items:center;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent;font-size:14px}
.lb-nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.lb-nav a.aktiv{color:#fff;border-bottom-color:var(--akzent2);font-weight:600}
.lb-suche{position:relative;flex:0 1 240px}
#leiste .lb-suche input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;padding:6px 10px}
#leiste .lb-suche input::placeholder{color:#b9ada0}
#leiste .lb-suche input:focus{background:#fff;color:var(--text);outline:none}
.lb-erg{display:none;position:absolute;right:0;top:40px;width:380px;max-height:70vh;overflow:auto;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px}
.lb-erg a{display:grid;grid-template-columns:78px 1fr;gap:0 8px;padding:7px 9px;border-radius:5px;text-decoration:none;color:var(--text)}
.lb-erg a:hover,.lb-erg a.aktiv{background:var(--hell)}
.lb-erg small{grid-column:2;color:var(--leise)}
.xv-d{margin-left:0}.xv-k{margin-left:18px;border-left:1px dotted var(--linie);padding-left:6px}.xv-d>summary{cursor:pointer;list-style:none}
.xv-d>summary::before{content:"▸ ";color:var(--leise)}.xv-d[open]>summary::before{content:"▾ "}.xv-z{padding-left:12px}
.xv-t{color:#7b3f9e}.xv-p{color:#999}.xv-a{color:#a0522d}.xv-v{color:#2e6b30}.xv-x{color:#111;font-weight:600;margin-left:4px}
.xv-bt{font:11px system-ui,sans-serif;background:var(--label);color:var(--dunkel);border-radius:4px;padding:0 5px;margin-left:4px}
.xv-n{font:11px system-ui,sans-serif;color:var(--leise)}.xv-treffer{background:#fff3b0}
.lb-art{grid-row:span 2;font-size:11px;color:var(--leise);padding-top:2px}
.lb-zeit{color:#bfb3a5;font-size:13px;white-space:nowrap}
.lb-ic{background:none;border:0;cursor:pointer;flex:0 0 auto;color:#d9cfc2;display:grid;place-items:center;width:34px;height:34px;border-radius:6px}
.lb-ic:hover{background:rgba(255,255,255,.1);color:#fff}
.lb-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.lb-nav{flex:1 1 auto;min-width:0}.lb-suche{min-width:110px}
@media (max-width:1560px){.lb-nav a{padding:0 7px}#leiste{gap:12px}}
/* PC: Bildlaufleiste im Hauptmenü, wenn nicht alle Einträge Platz haben (Tablet: wischen) */
@media (pointer:fine){.lb-nav{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent}}
.lb-nav.voll::after,.lb-nav.voll::before{content:none}
.lb-pfeil{display:none;flex:0 0 auto;align-self:center;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:4px;width:22px;height:28px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.lb-pfeil:hover{background:rgba(255,255,255,.22)}
@media (pointer:fine){#leiste.nav-voll .lb-pfeil{display:block}}
/* breite Tabellen: zusätzliche Bildlaufleiste über der Tabelle (PC) */
.tab-oben{overflow-x:auto;overflow-y:hidden;display:none;scrollbar-width:auto;margin-bottom:2px}
.tab-oben>div{height:1px}
@media (pointer:fine){.tab-oben.an{display:block}}
@media (max-width:1480px){.lb-zeit{display:none}}
@media (max-width:1100px){.lb-zeit,.lb-name{display:none}.lb-nav{flex:1 1 auto}}
@media (max-width:760px){.lb-suche{display:none}#leiste{gap:8px;padding:0 10px}}
.karte{background:var(--karte);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:16px}
#kopf{padding:10px 18px 12px}
.kopfzeile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.krumen{display:flex;gap:10px;font-weight:600;font-size:13px;margin-bottom:6px}
.krumen a{text-decoration:none;color:var(--akzent)}
.krumen a:before{content:"▸ ";color:var(--leise)}
.firma,.uhr{color:var(--leise)}
.icons{display:flex;gap:6px}
.ib{background:var(--dunkel);color:#fff;border:0;border-radius:6px;width:34px;height:32px;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.ib:hover{background:var(--akzent)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.kontext{background:var(--hell);border-radius:6px;padding:8px 12px;margin:0;color:var(--leise);min-height:20px}
.kontext b{color:var(--text)}
/* Reiter wie Ordnerreiter: sitzen auf einer Linie, der aktive ist hervorgehoben und etwas höher */
.reiter{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px;align-items:flex-end;border-bottom:3px solid var(--akzent);padding:0 2px}
.reiter a,.reiter span{padding:6px 13px 5px;font-size:13.5px;border-radius:8px 8px 0 0;text-decoration:none;background:#ebe5db;color:var(--text);
  border:1px solid #d7cdbf;border-bottom:none;line-height:1.3;transition:background .12s}
.reiter a:hover{background:#ddd3c5}
.reiter a.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff;font-weight:600;padding-top:9px;padding-bottom:6px;box-shadow:0 -2px 4px rgba(0,0,0,.08)}
.reiter span.aus{background:#f3efe9;color:#b8aea2;cursor:not-allowed}
.reiter a.grau{font-size:12.5px;background:#f4f0ea;color:var(--leise)}.reiter a.grau:hover{background:#e9e2d7;color:var(--text)}
.reiter a.grau.aktiv{background:var(--akzent2);border-color:var(--akzent2);color:#fff}
.reiter .zurueck{border-radius:6px;border:1px solid #d7cdbf;background:#fff;color:var(--leise);margin:0 12px 4px 0;align-self:center;padding:4px 10px}
.reiter .zurueck:hover{background:#f1ece4;color:var(--text)}
.sich-liste>div{padding:6px 0;border-bottom:1px solid var(--linie)}.sich-z{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reiter div.r2{display:flex;gap:3px;align-items:flex-end;margin-left:auto;padding-left:18px}
#inhalt{padding:16px 18px 20px}
.titel{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.titel h2{margin:0;font-size:19px;min-width:150px}
.titel .rechts{margin-left:auto;display:flex;gap:6px}
.such{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],input:not([type]),select,textarea{
  border:1px solid #cfc6ba;border-radius:4px;padding:4px 7px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--akzent2);outline-offset:-1px;border-color:var(--akzent2)}
textarea{resize:vertical;width:100%}
.btn{border:1px solid #cfc6ba;background:#f3efe9;border-radius:4px;padding:4px 12px;cursor:pointer}
.btn:hover{background:#e8e1d7}
.btn.prim{background:var(--akzent);border-color:var(--akzent);color:#fff}
.btn.prim:hover{background:var(--akzent2)}
.btn.rot{color:var(--rot)}
.btn.pk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
table.liste{width:100%;border-collapse:separate;border-spacing:0 3px}
table.liste th{background:var(--dunkel);color:#fff;text-align:left;font-weight:600;padding:7px 10px;cursor:pointer;user-select:none;white-space:nowrap}
table.liste th.r,table.liste td.r{text-align:right}
table.liste th .pf{font-size:10px;margin-left:3px}
table.liste td{background:var(--zeile);padding:7px 10px}
table.liste tr.klick:hover td{background:var(--zeile2);cursor:pointer}
table.liste td a{color:var(--dunkel)}
.filter td{background:transparent!important;padding:2px 10px!important}
.filter select{font-size:13px;padding:2px 4px}
.leer{padding:22px;text-align:center;color:var(--leise);background:var(--zeile);border-radius:6px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
.zeile{display:grid;grid-template-columns:150px 1fr;background:var(--zeile);min-height:36px}
.zeile.voll{grid-column:1/-1}
.zeile>label{background:var(--label);padding:8px 10px;font-weight:500}
.zeile>div{padding:5px 8px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.zeile>div>input,.zeile>div>select{flex:1;min-width:0}
.zeile>div>textarea{flex:1}
.zeile .klein{flex:0 0 90px}
.sektion{grid-column:1/-1;font-weight:700;margin:12px 0 3px}
.aktion{background:var(--dunkel);color:#fff;border:0;border-radius:5px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;text-decoration:none;flex:0 0 auto}
.aktion:hover{background:var(--akzent)}
.aktion svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.spalte{display:flex;flex-direction:column;gap:4px;flex:1}
.spalte input{width:100%}
.spalte>label{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.spalte input[type=checkbox],.spalte input[type=radio]{width:auto;flex:0 0 auto;margin-top:3px}
.radio{display:flex;gap:14px;align-items:center;padding-top:3px}
.hinweis{color:var(--leise);font-size:13px}
.speicher{font-size:12px;color:var(--leise);min-width:90px;text-align:right}
.speicher.ok{color:var(--gruen)}
.speicher.fehler{color:var(--rot)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dunkel);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
#toast.zeigen{opacity:1}
#toast.fehler{background:var(--rot)}
.bk-zweck{max-width:520px;overflow-wrap:anywhere;font-size:12px}.bk-vs .tag{font-weight:600}.bk-vs.sicher .tag{background:#d6ecd2;color:#245b1d}.bk-vs.pruefen .tag{background:#f6e3c2;color:#7a4b00}
.bk-kn{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.bk-liste td{vertical-align:top}
.lq-kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.lq-zahl{font-size:22px;font-weight:600;margin-top:2px}
.lq-svg{width:100%;min-width:560px;height:auto;display:block}.lq-r{stroke:var(--linie,#ddd6cc);stroke-width:1}.lq-r.null{stroke:#8a8178;stroke-width:1.2}
.lq-t{font-size:11px;fill:#7c746b}.lq-ein{fill:#7fb27a}.lq-aus{fill:#d98a7e}.lq-l{fill:none;stroke:#3d342b;stroke-width:2.2}.lq-p{fill:#3d342b}.lq-p.neg{fill:var(--rot,#b3261e)}
.lq-leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}.lq-sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-left:8px}.lq-sw.ein{background:#7fb27a}.lq-sw.aus{background:#d98a7e}.lq-sw.l{background:#3d342b;height:3px}
.lq-pt{width:100%}.lq-pt td{padding:3px 8px;border:0}
.modal-hg.as-tafel-hg{z-index:60}.modal.as-tafel{width:min(980px,96vw);max-height:92vh;display:flex;flex-direction:column}.as-tafel-kopf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.as-tafel-kopf h3{flex:1 1 200px;margin:0}.as-tafel-inhalt{overflow:auto;min-height:200px;background:#e8e4dc;padding:4px;border-radius:6px}
.modal-hg{position:fixed;inset:0;background:rgba(40,30,20,.35);display:grid;place-items:center;z-index:16}
.modal{background:#fff;border-radius:8px;padding:18px;width:min(520px,94vw);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal h3{margin:0 0 12px}
.modal .zeile{grid-template-columns:110px 1fr}
.modal .knoepfe{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kachel{background:var(--zeile);border-radius:6px;padding:12px}
.kachel h4{margin:0 0 8px}
.kachel .gross{font-size:26px;font-weight:700}
.balken{display:grid;grid-template-columns:120px 1fr minmax(34px,auto);gap:8px;align-items:center;margin:4px 0}
.balken i{display:block;height:10px;background:var(--akzent2);border-radius:3px}
.notiz{background:var(--zeile);padding:8px 10px;border-radius:5px;margin-bottom:5px;display:flex;gap:10px}
.notiz div{flex:1;white-space:pre-wrap}
.ablage{border:2px dashed #cfc6ba;border-radius:6px;padding:18px;text-align:center;color:var(--leise);margin-bottom:12px}
.ablage.drueber{border-color:var(--akzent);background:var(--hell)}
@media (max-width:820px){.form{grid-template-columns:1fr}.zeile{grid-template-columns:110px 1fr}}
button:disabled{opacity:.45;cursor:default}

/* Text-Editor */
.tl-rahmen{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.tl-listen{display:flex;flex-direction:column;gap:3px;background:var(--zeile);padding:8px;border-radius:6px}
.tl-eintrag{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:none;padding:7px 9px;border-radius:4px;cursor:pointer;font:inherit;color:inherit}
.tl-eintrag:hover{background:#ece4d8}
.tl-eintrag.aktiv{background:var(--akzent);color:#fff}
.tl-eintrag small{opacity:.7}
.tl-inhalt{min-width:0;overflow-x:auto}
.tl-wahl{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.tl-wahl label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--linie);border-radius:5px;cursor:pointer}
.tl-wahl label:has(input:checked){border-color:var(--akzent);background:#fbf6ef}
.tl-wahl span{display:flex;flex-direction:column;gap:2px}
.tl-wahl small{color:var(--grau,#777)}
@media (max-width:900px){.tl-rahmen{grid-template-columns:1fr}}
.pb-liste{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.pb-karte{width:220px;border:1px solid var(--linie);border-radius:6px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:5px}
.pb-karte.aus img{opacity:.35}
.pb-karte img{width:100%;height:140px;object-fit:contain;background:#f3efe9;border-radius:4px}
.pb-feld{display:flex;gap:5px;align-items:center}
.pb-feld input:not([type]),.pb-feld select{flex:1;min-width:0}
.pb-feld label{display:flex;gap:4px;align-items:center;font-size:13px;white-space:nowrap}
.pb-drop{border:2px dashed #cfc6ba;border-radius:6px;padding:12px;text-align:center;color:#777;font-size:13.5px}
.pb-drop.ueber{border-color:var(--akzent);background:#fbf6ef}
.pb-proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:60vh;overflow:auto}
.pb-proj button{border:2px solid transparent;background:#f6f2ec;border-radius:6px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;font-size:11.5px;text-align:left;color:inherit}
.pb-proj button img{width:100%;height:100px;object-fit:contain;background:#fff}
.pb-proj button span{word-break:break-all}
.pb-proj button.gewaehlt{border-color:var(--akzent);background:#fbf6ef}
td.rot,b.rot,span.rot{color:var(--rot)}
tr.gewaehlt td{background:#fbf6ef}
.frage-hg{z-index:30}
.frage{max-width:460px}
.frage-kopf{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.frage-kopf h3{margin:3px 0 0;font-size:16px;line-height:1.35;font-weight:600}
.frage-ic{flex:0 0 30px;height:30px;border-radius:50%;background:var(--akzent);color:#fff;display:grid;place-items:center;font-weight:700}
.frage-ic.gefahr{background:var(--rot)}
.frage p{margin:6px 0 0 42px;color:#555;line-height:1.45;font-size:14px}
.frage .knoepfe{margin-top:18px}
.btn.gefahr{background:var(--rot);color:#fff;border-color:var(--rot)}
.btn.gefahr:hover{filter:brightness(1.08)}
.briefanschrift{flex:1;white-space:pre-line;background:#fff;border:1px dashed #cfc6ba;border-radius:4px;padding:6px 9px;min-height:60px;color:#333;line-height:1.4}
.blaettern{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}
.blaettern .btn{min-width:34px;padding:4px 9px}
.blaettern .btn.aktiv{background:var(--akzent);color:#fff;border-color:var(--akzent)}
.blaettern .btn:disabled{opacity:.4;cursor:default}
.blaettern .hinweis{margin-left:8px}
.bl-luecke{padding:0 4px;color:#999}
.ws-karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ws-karte{border:1px solid var(--linie);background:#fff;border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.ws-karte span{font-size:12.5px;color:#777;line-height:1.35}
.ws-karte:hover{border-color:var(--akzent2)}
.ws-karte.aktiv{border-color:var(--akzent);background:#fbf6ef;box-shadow:inset 0 0 0 1px var(--akzent)}
.rt{flex:1 1 320px;border:1px solid #cfc6ba;border-radius:4px;background:#fff;min-width:0;display:flex;flex-direction:column}
.rt:focus-within{outline:2px solid var(--akzent2);outline-offset:-1px}
.rt-leiste{display:flex;gap:2px;padding:3px;border-bottom:1px solid var(--linie);background:#faf7f2;flex-wrap:wrap;border-radius:4px 4px 0 0}
.rt-leiste button{border:1px solid transparent;background:none;border-radius:3px;padding:1px 7px;cursor:pointer;font-size:13px;min-width:26px}
.rt-leiste button:hover{background:#ece4d8;border-color:#ddd2c3}
.rt-trenn{width:1px;background:var(--linie);margin:2px 3px}
.rt-feld{padding:6px 8px;min-height:90px;outline:none;line-height:1.45;overflow:auto;max-height:420px}
.rt.rt-klein .rt-feld{min-height:44px}
.rt.rt-gross .rt-feld{min-height:260px}
.rt-feld ul,.rt-feld ol{margin:2px 0 2px 4px;padding-left:20px}
.rt-feld p{margin:0 0 4px}
.rt-feld[contenteditable="false"]{background:#f5f2ee;color:var(--leise)}
.rt-feld:empty:before{content:attr(data-ph);color:#aaa}
.pl-text ul,.pl-text ol{margin:2px 0;padding-left:20px}
/* Startseite */
.sk-raster{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sk{background:var(--zeile);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--text);display:block;position:relative;border:1px solid transparent}
.sk-zweig{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-start}
.sk-links{flex:1 1 120px;min-width:0}
.sk-links .sk-w{white-space:nowrap}
.sk-r{flex:0 0 auto;margin-left:auto;display:grid;grid-template-columns:auto auto;gap:3px 6px;font-size:12px;color:var(--leise);padding-top:18px;align-items:baseline}
.sk-zweig .sk-r:only-child{padding-top:0}
.sk-r div{display:contents}
.sk-r b{color:var(--text);font-weight:600;font-size:13px;text-align:right;white-space:nowrap}
a.sk:hover{border-color:var(--akzent2)}
.sk-t{font-size:12.5px;color:var(--leise)}
.sk-hilfe{cursor:help;opacity:.7;padding:0 3px;border-radius:50%}
.sk-hilfe:hover,.sk-hilfe:focus{opacity:1;color:var(--akzent);outline:none}
#hilfeBlase{position:fixed;z-index:2000;max-width:300px;background:var(--dunkel);color:#fff;font-size:13px;line-height:1.45;padding:9px 12px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .12s}
#hilfeBlase.an{opacity:1}
.sk-w{font-size:23px;font-weight:700;margin:3px 0 2px;letter-spacing:-.3px}
.sk-u{font-size:12.5px;color:var(--leise)}
.sk-u.gut{color:var(--gruen)}.sk-u.schlecht{color:var(--rot)}.sk-u.achtung{color:#a8701c}
.st-raster{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st-box{background:#fff;border:1px solid var(--linie);border-radius:8px;padding:12px 14px;min-width:0}
.st-box.st-breit{grid-column:1/-1}
.st-box h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.st-box h4{margin:6px 0;font-size:13px;color:var(--leise)}
.st-anz{background:var(--label);border-radius:10px;padding:0 8px;font-size:12px;font-weight:600}
.st-liste{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.st-z{padding:7px 9px;border-radius:6px;background:var(--zeile)}
.st-z.faellig{background:#fbefe3;border-left:3px solid var(--akzent2)}
.st-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.st-h a{text-decoration:none;color:var(--text)}
.st-betrag{font-weight:600;white-space:nowrap}
.st-u{font-size:12.5px;color:var(--leise);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.st-u a{color:var(--leise)}
.st-akt{margin-left:auto;display:flex;gap:4px}
.st-akt .btn{padding:1px 8px;font-size:12px}
.dg-box{position:relative}
.dg{width:100%;height:auto;display:block}
.dg-grid{stroke:#ece6dd;stroke-width:1}.dg-null{stroke:#b9ae9f;stroke-width:1}
.dg-ax{font-size:11px;fill:#8a8077}
.dg path:hover{opacity:.85}
.dg-legende{display:flex;gap:16px;font-size:12.5px;color:var(--leise);margin:-4px 0 6px}
.dg-legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dg-tip{display:none;position:absolute;background:var(--dunkel);color:#fff;font-size:12px;padding:5px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;z-index:2}
.dg-tabelle summary{cursor:pointer;color:var(--leise);font-size:12.5px;margin-top:4px}
@media (max-width:1000px){.sk-raster{grid-template-columns:1fr 1fr}.st-raster{grid-template-columns:1fr}}
/* Kalender */
.kp{overflow-x:auto;border:1px solid var(--linie);border-radius:6px;user-select:none}
.kp-kopf,.kp-zeile{display:flex;min-width:max-content}
.kp-kopf{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--linie)}
.kp-label{flex:0 0 240px;padding:6px 10px;border-right:1px solid var(--linie);background:#fff;position:sticky;left:0;z-index:2;font-size:13px;line-height:1.3}
.kp-label a{text-decoration:none;color:var(--text)}
.kp-bez{color:var(--leise);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-std{font-size:11.5px;color:var(--leise)}
.kp-st{background:var(--label);border-radius:3px;padding:0 4px}
.kp-skala{position:relative;height:62px}
.kp-m{position:absolute;top:2px;font-size:12px;font-weight:600;padding-left:4px;white-space:nowrap}
.kp-k{position:absolute;top:20px;font-size:11px;color:var(--leise);padding-left:4px;border-left:1px solid var(--linie);white-space:nowrap;overflow:hidden}
.kp-t{position:absolute;top:34px;font-size:10.5px;text-align:center;color:var(--leise);line-height:1.15}
.kp-t.we{color:#b9ad9f}.kp-t.heute{color:#fff;background:var(--akzent);border-radius:3px}
.kp-zeile{border-bottom:1px solid var(--linie)}
.kp-zeile:hover .kp-label{background:var(--zeile)}
.kp-flaeche{position:relative;cursor:crosshair}
.kp-we{position:absolute;top:0;bottom:0;background:#f4f0ea}
.kp-wl{position:absolute;top:0;bottom:0;border-left:1px solid #e6dfd5}
.kp-heute{position:absolute;top:0;bottom:0;border-left:2px solid var(--akzent);opacity:.6}
.kp-gruppe{background:var(--label);font-weight:600;padding:5px 10px;font-size:13px;position:sticky;left:0}
.kp-b{position:absolute;height:22px;border-radius:4px;background:var(--f,#b8834f);color:#fff;font-size:11.5px;line-height:22px;cursor:grab;overflow:hidden;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:1}
.kp-b span{padding:0 7px;pointer-events:none}
.kp-b.plan{background:repeating-linear-gradient(135deg,#efe6da 0 6px,#e4d6c3 6px 12px);color:var(--text);border:1.5px dashed var(--akzent2)}
.kp-b.plan.fest{background:#d9c4a6;border:1.5px solid var(--akzent2);color:var(--text);font-weight:600}
.kp-b.ext{background:var(--f);opacity:.85;cursor:default}
.kp-b.beantr,.km-e.beantr{background:repeating-linear-gradient(135deg,var(--f) 0 6px,#fff 6px 9px) !important;color:var(--text);opacity:.8}
.kp-b.ft,.km-e.ft{color:#fff;font-style:italic}.kp-abw .kp-b[data-abw]{cursor:pointer}
.kp-b.erl{opacity:.45}
.kp-b.zieht{opacity:.75;cursor:grabbing;z-index:5}
.kp-h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.kp-h.l{left:0}.kp-h.r{right:0}
.kp-b:hover .kp-h{background:rgba(0,0,0,.15)}
.kp-sel{position:absolute;top:3px;bottom:3px;background:rgba(184,131,79,.25);border:1.5px dashed var(--akzent);border-radius:4px;pointer-events:none}
.kp-ext .kp-flaeche{cursor:default}
.h-tag{font-weight:600;color:var(--leise);font-size:12.5px;margin:14px 0 4px;text-transform:none}
.h-e{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-left:3px solid var(--linie);background:#fff;margin:3px 0;border-radius:0 6px 6px 0}
.h-e .h-i{width:22px;text-align:center}.h-e .h-b{flex:1;min-width:0}.h-e .h-t{color:#444;margin-top:2px;white-space:normal;word-break:break-word}
.h-notiz{background:#fbf6e9;border-left-color:#c9a227}.h-beleg{border-left-color:#4d7a45}.h-korrespondenz{border-left-color:#6f9bcf}
.h-termin{border-left-color:#9a6a3a}.h-werkstatt{border-left-color:#a8a29a}.h-auftrag{border-left-color:#3b3530}
.kk-z{position:absolute;top:4px;height:22px;border:1px solid var(--linie);border-radius:4px;background:#fff;overflow:hidden;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.kk-z i{position:absolute;left:0;top:0;bottom:0;opacity:.28}.kk-z span{position:relative;white-space:nowrap}
.kk-kopf summary{cursor:pointer}
.kk-oz{border:1.5px dashed #c98a2a;background:#fdf5e6;color:#8a5a12}
.kk .kp-b{font-size:11px}.kk .kp-b b{font-weight:600}
.kp-auf{border:0;background:none;cursor:pointer;padding:0 4px 0 0;font-size:12px;color:var(--leise);width:16px}.kp-auf:hover{color:var(--text)}
.kp-b.sum{background:#a8a29a;cursor:pointer}
.kp-gruppe .btn.klein{margin-left:10px;padding:1px 8px;font-size:11.5px;font-weight:400;vertical-align:1px}.kk-kopf details[open]{font-weight:400}.kk-kopf details[open] summary{font-weight:600}
.km{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--linie);border-radius:6px;overflow:hidden}
.km-k{background:var(--dunkel);color:#fff;padding:5px 8px;font-weight:600;font-size:13px}
.km-tag{min-height:110px;border-right:1px solid var(--linie);border-bottom:1px solid var(--linie);padding:4px;background:#fff;overflow:hidden}
.km-tag.we{background:#faf7f2}.km-tag.fremd{background:#f3f0eb;color:var(--leise)}
.km-tag.heute .km-n{color:#fff;background:var(--akzent);border-radius:3px;display:inline-block;padding:0 5px}
.km-n{font-size:12px;font-weight:600;margin-bottom:3px}.km-n span{font-weight:400;color:var(--leise);margin-left:6px}
.km-e{font-size:11.5px;background:var(--f,#b8834f);color:#fff;border-radius:3px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.km-e.ext{opacity:.85;cursor:default}.km-e.erl{opacity:.45}
.km-e.plan{background:repeating-linear-gradient(135deg,#efe6da 0 6px,#e4d6c3 6px 12px);color:var(--text);border:1px dashed var(--akzent2)}
.km-e.plan.fest{background:#d9c4a6;border:1px solid var(--akzent2)}
.kw7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kw-tag{background:#fff;border:1px solid var(--linie);border-radius:6px;padding:6px;min-height:300px}
.kw-tag.we{background:#faf7f2}.kw-tag.heute{border-color:var(--akzent)}
.kw-tag .km-e{white-space:normal}
@media (max-width:820px){.kw7{grid-template-columns:1fr}.kw-tag{min-height:0}}
.kp-fs{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.85);pointer-events:none}
.kp-b small{opacity:.85}
.fs{display:inline-block;width:150px;height:8px;background:var(--label);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
.fs i{display:block;height:100%;background:var(--gruen)}
.rot-t{color:var(--rot);font-weight:600}
/* Positionen & Kalkulation */
input.zahl{text-align:right}
.zeile>div>input.zahl{flex:0 0 auto}
.reiter .luecke{flex:1}
table.pl td{vertical-align:top}
.pl-titel td{background:#e6ded2!important;padding:8px 10px!important}
.pl-pos td{background:var(--zeile)}
.unterliste td{vertical-align:top}.unterliste tr.zw td{vertical-align:middle}
.pl-pos:hover td{background:var(--zeile2);cursor:pointer}
.pl-pos.gesperrt td{opacity:.55}
.pl-nr a{font-weight:600}
.pl-nr{white-space:nowrap}
tr.zt-leer td{color:var(--leise)}
tr.zt-leer input,tr.zt-leer select{opacity:.75}
.up-haupt{display:grid;grid-template-columns:52px 40px 50px 1fr auto auto;gap:10px;align-items:baseline;background:#e6ded2;border-radius:6px;padding:8px 12px;margin:0 0 12px;color:var(--text);text-decoration:none;border-left:4px solid var(--akzent)}
.up-haupt:hover{background:#ddd3c4}
.up-haupt .up-nr{font-weight:600}
.up-haupt .up-text{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-sperre{border:none;background:none;padding:0 2px;font:inherit;font-weight:600;color:var(--dunkel);text-decoration:underline;cursor:pointer}
.pl-sperre:hover{color:var(--akzent)}
.pl-sperre small{font-size:10px;font-weight:600;margin-left:2px;text-decoration:none;display:inline-block;color:var(--rot)}
.pl-griff{color:#b9ae9f;cursor:grab;margin-right:4px;font-size:12px;letter-spacing:-2px;user-select:none}
.pl-pos:hover .pl-griff{color:var(--akzent)}
.pl-pos.zieht td,tr.klick.zieht td{opacity:.35}
tr.drop-vor td{box-shadow:inset 0 3px 0 var(--akzent)}
tr.drop-nach td{box-shadow:inset 0 -3px 0 var(--akzent)}
table.pl-zu td{font-size:13.5px}
table.pl-zu th{white-space:nowrap}
table.pl-zu td.pl-text{min-width:240px}
.pl-titel .btn{white-space:nowrap}
.pl-kurz{white-space:normal}
.pl-marke{display:inline-block;background:#d8d0c4;color:#fff;border-radius:3px;font-size:10px;line-height:14px;padding:0 4px;margin:2px 0 0 2px;font-weight:600}
.pl-text div{white-space:normal;line-height:1.45}
.pl-unter td{background:#f9f6f1!important;padding-top:2px!important;font-size:13px}
#sTab th{white-space:normal;vertical-align:bottom}#sTab td,#sTab th{padding-left:8px;padding-right:8px}
.pl-uz{color:var(--leise);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:600px}
.pl-akt{display:none;justify-content:flex-end;gap:2px;margin-top:6px}
.pl-pos:hover .pl-akt{display:flex}
.pl-akt button{border:1px solid #cfc6ba;background:#fff;border-radius:4px;width:26px;height:24px;cursor:pointer;font-size:11px}
.pl-akt button:hover{background:var(--hell)}
.pl-tsum td{background:transparent!important;color:var(--leise)}
.pl-summe td{background:var(--label)!important}
.pchk{display:flex;gap:4px;align-items:center}
.nw{white-space:nowrap}
.ein-drop{border:2px dashed transparent;border-radius:8px;padding:0;margin:-4px 0 8px;text-align:center;max-height:0;overflow:hidden;transition:all .15s}
.ein-drop.ueber{border-color:var(--akzent);background:#fbf4ea;padding:16px;max-height:80px}
.ein-tab{width:100%;border-collapse:collapse;font-size:13.5px}
.ein-tab th{background:var(--dunkel);color:#fff;text-align:left;padding:6px 8px;font-weight:500;position:sticky;top:0;z-index:1}
.ein-tab td{padding:6px 8px;vertical-align:top;border-bottom:1px solid var(--linie);background:#fff}
.ein-tab tr.e-kosten td{background:#faf8f5}
.ein-tab textarea{width:100%;min-width:200px;font:inherit;font-size:13px;resize:vertical}
.ein-tab input,.ein-tab select{font-size:13px}
.ein-ziel{display:flex;flex-direction:column;gap:4px;min-width:250px}
.ein-ziel .zl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ein-kopf{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-bottom:10px}
.ein-kopf .zeile{margin:0}
.ein-gelernt{font-size:11px;color:var(--gruen)}
@media (max-width:900px){.ein-kopf{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--label);border-radius:3px;padding:0 5px;margin:0 3px 0 0;font-size:12px}
table.st tr.zw td{background:var(--label)}
table.sl td{white-space:nowrap}
.sl-edit td{background:#fff!important;border:2px solid var(--label);padding:8px!important;white-space:normal!important}
.sl-edit .zeile{grid-template-columns:120px 1fr}
.sl-z.gew td{background:var(--label)}
#posWahl{flex:1;min-width:200px}
.titel .speicher{order:0}

/* Seitenleiste Projektordner */
#haupt{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
#seite{display:none}
.wrap.mit-seite,.wrap.breit{max-width:1680px}
.mit-seite #haupt{grid-template-columns:minmax(0,1fr) 400px}
.mit-seite #seite{display:flex;flex-direction:column;position:sticky;top:12px;max-height:calc(100vh - 24px);padding:14px 14px 10px;margin-bottom:16px}
.mit-seite #inhalt{margin-bottom:16px}
.pb-kopf{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pb-kopf h3{margin:0;flex:1;font-size:17px}
.pb-ib{border:1px solid #cfc6ba;background:#f3efe9;border-radius:5px;height:30px;min-width:32px;padding:0 7px;cursor:pointer}
.pb-ib:hover{background:#e8e1d7}
.pb-krume{background:var(--hell);border-radius:5px;padding:6px 8px;margin-bottom:6px;font-size:13px;word-break:break-word}
.pb-krume a{color:var(--akzent);font-weight:600;text-decoration:none;border-radius:3px;padding:1px 2px}
.pb-krume a:hover{text-decoration:underline}
.pb-liste{flex:1;overflow:auto;min-height:120px;border-radius:5px;padding:2px}
.pb-zeile{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;cursor:default;user-select:none}
.pb-zeile:hover{background:var(--zeile)}
.pb-zeile.gew{background:var(--label)}
.pb-zeile.zieht{opacity:.4}
.pb-zeile[data-drop]{cursor:pointer}
.pb-ic{font-size:18px;width:22px;text-align:center;flex:0 0 auto}
.pb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-name small{display:block;color:var(--leise);font-size:11.5px}
.pb-akt{display:none;gap:2px;flex:0 0 auto}
.pb-zeile:hover .pb-akt,.pb-zeile.gew .pb-akt{display:flex}
.pb-akt button{border:0;background:transparent;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:14px}
.pb-akt button:hover{background:#e3d8c9}
.pb-hoch{color:var(--leise)}
.drop-hier{outline:2px dashed var(--akzent);outline-offset:-2px;background:var(--hell)!important}
.pb-ablage{border:2px dashed #cfc6ba;border-radius:6px;padding:10px;text-align:center;color:var(--leise);font-size:12.5px;margin-top:8px}
.pb-ablage label{text-decoration:underline;cursor:pointer}
.pb-pfad{font-size:11px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-menue{position:fixed;z-index:30;background:#fff;border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:5px;min-width:200px;display:flex;flex-direction:column}
.pb-menue button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:4px;cursor:pointer}
.pb-menue button:hover{background:var(--hell)}
.pb-menue button.rot{color:var(--rot)}
.seite-unten #haupt{grid-template-columns:minmax(0,1fr)!important}.seite-unten #seite{position:static!important;max-height:none!important}
@media (max-width:900px){.mit-seite #haupt{grid-template-columns:minmax(0,1fr)}.mit-seite #seite{position:static;max-height:none}}
@media print{
  body{background:#fff}#leiste,#kopf,#seite,.nicht-drucken,.raster,.titel .rechts,#toast{display:none!important}
  .karte{box-shadow:none}.wrap{max-width:none;padding:0}
  table.liste th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---- Anmeldung, Benutzer, Personal ---- */
body.anmelde-body{display:grid;place-items:center;min-height:100vh;background:var(--bg);margin:0}
.anm-box{background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.12);padding:28px 30px;width:min(400px,92vw);font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--text)}
.anm-marke{display:flex;gap:10px;align-items:center;margin-bottom:14px}.anm-marke small{display:block;color:var(--leise)}
.anm-marke .lb-mono{background:var(--akzent);color:#fff;border-radius:8px;width:38px;height:38px;display:grid;place-items:center;font-weight:700}
.anm-box h2{margin:6px 0 10px;font-size:20px}.anm-box label{display:block;margin:10px 0;font-size:14px;color:var(--leise)}
.anm-box input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;font-size:16px;border:1px solid var(--linie);border-radius:6px}
.anm-box .btn{width:100%;padding:10px;font-size:16px;margin-top:8px}.anm-fehler{color:var(--rot);margin-top:10px;min-height:1.2em}
.lb-ich{position:relative;flex:0 0 auto}.lb-ichb{background:rgba(255,255,255,.08);border:0;color:#e9e1d6;border-radius:16px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.lb-ichb:hover{background:rgba(255,255,255,.16)}
.lb-ichm{display:none;position:absolute;right:0;top:38px;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.2);min-width:210px;z-index:60;padding:4px 0}
.lb-ichm.offen{display:block}.lb-ichm a{display:block;padding:8px 12px;color:var(--text);text-decoration:none}.lb-ichm a:hover{background:var(--hell)}
tr.inaktiv td{color:var(--leise)}
.ma-raster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
@media (max-width:1100px){.ma-raster{grid-template-columns:1fr}}
table.liste tr.markiert td{background:#fde9b8!important}

const RT_TAGS = /<(b|strong|i|em|u|br|p|div|ul|ol|li|span|font)\b[^>]*>|&(lt|gt|amp|nbsp|quot);/i;
const istHtml = t => !!t && RT_TAGS.test(t);
function textHtml(t) { return istHtml(t) ? t : esc(t || "").replace(/\n/g, "<br>"); }
function klartext(t) {
  if (!istHtml(t)) return t || "";
  const d = document.createElement("div");
  d.innerHTML = t.replace(/<br\s*\/?>/gi, "\n").replace(/<(div|p|li)\b[^>]*>/gi, "\n").replace(/<\/(div|p|li)>/gi, "\n");
  return d.textContent.replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
}

// „Formatierung entfernen“: Fett/Kursiv/Größe und auch Aufzählungen/Nummerierungen der markierten Zeilen
// (ohne Markierung: die Zeile mit dem Cursor). removeFormat allein lässt Listen stehen.
function rtFormatWeg(feld) {
  const sel = window.getSelection();
  if (!sel.rangeCount || !feld.contains(sel.anchorNode)) return;
  const r = sel.getRangeAt(0);
  if (!r.collapsed) {
    document.execCommand("removeFormat", false, null);
    feld.querySelectorAll("span[style]").forEach(sp => { if (r.intersectsNode(sp)) { sp.removeAttribute("style"); sp.replaceWith(...sp.childNodes); } });
  }
  const r2 = sel.rangeCount ? sel.getRangeAt(0) : r;
  const lis = [...feld.querySelectorAll("li")].filter(li => r2.collapsed ? li.contains(r2.startContainer) : r2.intersectsNode(li));
  // Listenpunkte in normale Zeilen umwandeln; die Liste wird dabei an dieser Stelle geteilt
  lis.forEach(li => {
    const liste = li.parentElement; if (!liste || !/^(UL|OL)$/.test(liste.tagName)) return;
    const danach = []; for (let n = li.nextSibling; n; n = n.nextSibling) danach.push(n);
    const zeile = document.createElement("div");
    zeile.append(...li.childNodes); if (!zeile.textContent.trim() && !zeile.querySelector("img")) zeile.innerHTML = "<br>";
    if (danach.length) { const rest = liste.cloneNode(false); rest.append(...danach); liste.after(rest); }
    liste.after(zeile); li.remove();
    if (!liste.querySelector("li")) liste.remove();
  });
}
function rtGroesse(feld, pt) {
  document.execCommand("styleWithCSS", false, false);
  document.execCommand("fontSize", false, "7");
  feld.querySelectorAll('font[size="7"]').forEach(f => {
    const sp = document.createElement("span");
    if (pt && pt !== "10") sp.style.fontSize = pt + "pt";
    sp.innerHTML = f.innerHTML;
    f.replaceWith(sp);
  });
  feld.querySelectorAll("span").forEach(sp => { if (!sp.getAttribute("style")) sp.replaceWith(...sp.childNodes); });
}
document.addEventListener("mousedown", e => {
  const b = e.target.closest(".rt-leiste button"); if (!b) return;
  e.preventDefault();
  const feld = b.closest(".rt").querySelector(".rt-feld");
  if (feld.getAttribute("contenteditable") !== "true") return;
  feld.focus();
  if (b.dataset.gr) rtGroesse(feld, b.dataset.gr);
  else if (b.dataset.rt === "removeFormat") rtFormatWeg(feld);
  else document.execCommand(b.dataset.rt, false, null);
  feld.dispatchEvent(new Event("input", {bubbles: true}));
});
document.addEventListener("paste", e => {
  const feld = e.target.closest && e.target.closest(".rt-feld"); if (!feld) return;

});

function sucheBinden() {
  const inp = $("#suche"), box = $("#sucheErg");
  let t, treffer = [], aktiv = -1;
  const zeigen = () => {
    box.innerHTML = treffer.length ? treffer.map((r, i) => `<a href="${r.link}" class="${i === aktiv ? "aktiv" : ""}"><span class="lb-art">${esc(r.art)}</span><b>${esc(r.titel)}</b><small>${esc(r.zusatz || "")}</small></a>`).join("")
      : inp.value.trim().length > 1 ? `<div class="hinweis" style="padding:10px">Nichts gefunden</div>` : "";
    box.style.display = inp.value.trim().length > 1 ? "block" : "none";
  };
  inp.oninput = () => { clearTimeout(t); t = setTimeout(async () => { treffer = await api("suche?q=" + encodeURIComponent(inp.value)); aktiv = -1; zeigen(); }, 180); };
  inp.onkeydown = e => {
    if (e.key === "ArrowDown") { aktiv = Math.min(treffer.length - 1, aktiv + 1); zeigen(); e.preventDefault(); }
    if (e.key === "ArrowUp") { aktiv = Math.max(0, aktiv - 1); zeigen(); e.preventDefault(); }
    if (e.key === "Enter" && treffer.length) { location.hash = treffer[Math.max(0, aktiv)].link; inp.value = ""; box.style.display = "none"; inp.blur(); }
    if (e.key === "Escape") { inp.value = ""; box.style.display = "none"; inp.blur(); }
  };
  inp.onblur = () => setTimeout(() => box.style.display = "none", 200);
  inp.onfocus = () => { if (inp.value.trim().length > 1) zeigen(); };
  box.onclick = () => { inp.value = ""; box.style.display = "none"; };
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); inp.focus(); inp.select(); } });
}

// ---------- Sortierbare Tabelle ----------
const blaettern = {};
function tabelle(id, spalten, zeilen, {klick, filterzeile = "", leer = "Keine Einträge vorhanden."} = {}) {
  const s = sortierung[id] || (sortierung[id] = {k: spalten[0].k, ab: false});
  const sortiert = [...zeilen].sort((a, b) => {
    let x = a[s.k] ?? "", y = b[s.k] ?? "";
    const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "de", {numeric: true});
    return s.ab ? -c : c;
  });
  // Blättern: höchstens ZEILEN_JE_SEITE Zeilen je Seite
  const je = +E.zeilen_je_seite || 30;
  const bl = blaettern[id] || (blaettern[id] = {seite: 0, n: -1});
  if (bl.n !== zeilen.length) { bl.seite = 0; bl.n = zeilen.length; }
  const seiten = Math.max(1, Math.ceil(sortiert.length / je));
  bl.seite = Math.min(bl.seite, seiten - 1);
  const ab = bl.seite * je, sichtbar = sortiert.slice(ab, ab + je);
  const kopfz = spalten.map(c => `<th data-k="${c.k}" class="${c.r ? "r" : ""}">${esc(c.t)}${s.k === c.k ? `<span class="pf">${s.ab ? "▲" : "▼"}</span>` : ""}</th>`).join("");
  const body = sichtbar.map((z, i) => `<tr class="${klick ? "klick" : ""}" data-i="${ab + i}">${spalten.map(c =>
    `<td class="${c.r ? "r" : ""}">${c.f ? c.f(z) : esc(z[c.k])}</td>`).join("")}</tr>`).join("");
  let pager = "";
  if (seiten > 1) {
    const nr = [];
    for (let i = 0; i < seiten; i++) if (i === 0 || i === seiten - 1 || Math.abs(i - bl.seite) <= 2) nr.push(i); else if (nr[nr.length - 1] !== "…") nr.push("…");
    pager = `<div class="blaettern" id="p-${id}">
      <button class="btn" data-s="0" ${bl.seite ? "" : "disabled"} title="Erste Seite">«</button>
      <button class="btn" data-s="${bl.seite - 1}" ${bl.seite ? "" : "disabled"} title="Vorige Seite">‹</button>
      ${nr.map(i => i === "…" ? `<span class="bl-luecke">…</span>` : `<button class="btn${i === bl.seite ? " aktiv" : ""}" data-s="${i}">${i + 1}</button>`).join("")}
      <button class="btn" data-s="${bl.seite + 1}" ${bl.seite < seiten - 1 ? "" : "disabled"} title="Nächste Seite">›</button>
      <button class="btn" data-s="${seiten - 1}" ${bl.seite < seiten - 1 ? "" : "disabled"} title="Letzte Seite">»</button>
      <span class="hinweis">${ab + 1}–${Math.min(ab + je, sortiert.length)} von ${sortiert.length}</span></div>`;
  }
  const html = `<table class="liste" id="t-${id}">${filterzeile ? `<tr class="filter">${filterzeile}</tr>` : ""}<tr>${kopfz}</tr>${body}</table>
    ${zeilen.length ? "" : `<div class="leer">${leer}</div>`}${pager}`;
  return {html, binden(neuZeichnen) {
    const t = $("#t-" + id); if (!t) return;
    $$("th", t).forEach(th => th.onclick = () => {
      if (s.k === th.dataset.k) s.ab = !s.ab; else { s.k = th.dataset.k; s.ab = false; }
      bl.seite = 0;
      neuZeichnen();
    });
    if (klick) $$("tr.klick", t).forEach(tr => tr.onclick = ev => { if (ev.target.closest("a,button,select,input")) return; klick(sortiert[+tr.dataset.i]); });
    $$(`#p-${id} [data-s]`).forEach(b => b.onclick = async () => {
      bl.seite = +b.dataset.s;
      await neuZeichnen();
      const t2 = $("#t-" + id); if (t2 && t2.getBoundingClientRect().top < 60) t2.scrollIntoView({block: "start", behavior: "smooth"});
    });
  }};
}

// ---------- Autospeichern für Formulare ----------
function autospeichern(container, pfad, nachher) {
  let timer, offen = {};
  const anzeige = $(".speicher", container.closest("#inhalt"));
  const status = (t, k = "") => { if (anzeige) { anzeige.textContent = t; anzeige.className = "speicher " + k; } };
  const senden = async () => {
    const daten = offen; offen = {};
    if (!Object.keys(daten).length) return;
    status("speichert …");
    try { const r = await api(pfad, {method: "PUT", body: daten}); status("gespeichert ✓", "ok"); nachher && nachher(r, daten); }
    catch (e) { status("Fehler", "fehler"); toast(e.message, true); }
  };
  const wert = el => el.isContentEditable ? el.innerHTML : el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value;
  $$("[data-f]", container).forEach(el => {
    const ev = (el.tagName === "SELECT" || el.type === "radio" || el.type === "checkbox" || el.type === "date") ? "change" : "input";
    el.addEventListener(ev, () => {
      if (el.type === "radio" && !el.checked) return;
      offen[el.dataset.f] = wert(el); status("…");
      clearTimeout(timer); timer = setTimeout(senden, ev === "change" ? 50 : 700);
    });
    el.addEventListener("blur", () => { clearTimeout(timer); senden(); });
  });
  window.onbeforeunload = () => { if (Object.keys(offen).length) { senden(); return "Ungespeicherte Änderungen"; } };
  return {setzen(f, v) { const el = $(`[data-f="${f}"]`, container); if (el) { el.value = v; el.dispatchEvent(new Event(el.tagName === "SELECT" ? "change" : "input")); } }};
}

// Eigenes Bestätigungsfenster statt des Browser-Dialogs (confirm)
function frage(text, {titel, ok, abbrechen = "Abbrechen"} = {}) {
  const t = String(text || "");
  const [kopf, ...rest] = t.split(/\n\s*\n/);
  const art = /festschreiben/i.test(kopf) ? ["Festschreiben", false] : /stornier/i.test(kopf) ? ["Stornieren", true] : /löschen|entfernen|Papierkorb/i.test(kopf) ? [/entfernen/i.test(kopf) ? "Entfernen" : /Papierkorb/i.test(kopf) ? "In den Papierkorb" : "Löschen", true]
    : /beenden/i.test(kopf) ? ["Beenden", false] : /abgesagt/i.test(kopf) ? ["Als abgesagt markieren", true] : ["OK", false];
  return new Promise(res => {
    const hg = document.createElement("div");
    hg.className = "modal-hg frage-hg";
    hg.innerHTML = `<div class="modal frage" role="alertdialog" aria-modal="true">
      <div class="frage-kopf"><span class="frage-ic${art[1] ? " gefahr" : ""}">${art[1] ? "!" : "?"}</span><h3>${esc(titel || kopf)}</h3></div>
      ${titel ? `<p>${esc(kopf).replace(/\n/g, "<br>")}</p>` : ""}${rest.map(x => `<p>${esc(x).replace(/\n/g, "<br>")}</p>`).join("")}
      <div class="knoepfe"><button class="btn" data-f="0">${esc(abbrechen)}</button><button class="btn ${art[1] ? "gefahr" : "prim"}" data-f="1">${esc(ok || art[0])}</button></div></div>`;
    document.body.appendChild(hg);
    const zu = ja => { hg.remove(); document.removeEventListener("keydown", taste, true); res(ja); };
    const taste = e => { if (e.key === "Escape") { e.preventDefault(); zu(false); } else if (e.key === "Enter") { e.preventDefault(); zu(true); } };
    document.addEventListener("keydown", taste, true);
    hg.onclick = e => { if (e.target === hg) zu(false); };
    $$("[data-f]", hg).forEach(b => b.onclick = () => zu(b.dataset.f === "1"));
    setTimeout(() => $("[data-f='1']", hg).focus(), 20);
  });
}
function modal(titel, inhalt, knoepfe, nachOeffnen) {
  return new Promise(res => {
    const hg = document.createElement("div");
    hg.className = "modal-hg";
    hg.innerHTML = `<div class="modal"><h3>${esc(titel)}</h3>${inhalt}<div class="knoepfe">
      <button class="btn" data-x="0">Abbrechen</button><button class="btn prim" data-x="1">${esc(knoepfe || "OK")}</button></div></div>`;
    document.body.appendChild(hg);
    const zu = ok => { const m = $(".modal", hg); const d = {}; $$("[name]", m).forEach(el => { if (el.type === "radio" && !el.checked) return; d[el.name] = el.value; }); hg.remove(); res(ok ? d : null); };
    hg.onclick = e => { if (e.target === hg) zu(false); };
    $$("[data-x]", hg).forEach(b => b.onclick = () => zu(b.dataset.x === "1"));
    hg.addEventListener("keydown", e => {
      if (e.key === "Escape") zu(false);
      if (e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
      const eigen = e.target.closest("[data-enter]");
      if (eigen) { e.preventDefault(); document.getElementById(eigen.dataset.enter)?.click(); return; }
      zu(true);
    });
    const f = $("input,select", hg); f && f.focus();
    nachOeffnen && nachOeffnen(hg);
  });
}

function briefanschriftVoll(k) {

function briefanredeAus(k) {
  const n = k.nachname || "", t = k.titel ? k.titel + " " : "";
  if (k.anredeform === "Herr" && n) return `Sehr geehrter Herr ${t}${n},`;
  if (k.anredeform === "Frau" && n) return `Sehr geehrte Frau ${t}${n},`;
  if (k.anredeform === "Familie" && n) return `Sehr geehrte Familie ${n},`;
  if (k.anredeform === "Eheleute" && n) return `Sehr geehrte Eheleute ${n},`;
  return "Sehr geehrte Damen und Herren,";
}
// Vorschläge für die Briefanrede; mit Variablen, damit sie bei geänderten Stammdaten stimmt
function anredeVorlagen(k) {
  const f = k.anredeform, t = k.titel ? "{titel} " : "", L = [];
  const er = f === "Herr" ? "r" : "";
  if ((f === "Herr" || f === "Frau")) {
    L.push(`Sehr geehrte${er} ${f} ${t}{nachname},`, `Guten Tag ${f} ${t}{nachname},`, `Liebe${er} ${f} ${t}{nachname},`, `Hallo ${f} {nachname},`);
    L.push(`Liebe${er} {vorname},`, `Hallo {vorname},`);
  } else if (f === "Familie" || f === "Eheleute") {
    L.push(`Sehr geehrte ${f} {nachname},`, `Liebe ${f} {nachname},`, `Hallo ${f} {nachname},`, `Guten Tag ${f} {nachname},`);
  } else L.push("Sehr geehrte Frau {nachname},", "Sehr geehrter Herr {nachname},");
  L.push("Sehr geehrte Damen und Herren,", "Guten Tag,", "Hallo zusammen,");
  return L;
}
function anredeEinsetzen(vorlage, k) {
  return String(vorlage || "").replace(/\{\s*(nachname|vorname|titel)\s*\}/gi, (m, f) => (k[f.toLowerCase()] || "").trim()).replace(/ {2,}/g, " ").replace(" ,", ",");
}
function anredeAuswahl(k, id) {
  return `<select id="${id}" class="anrede-wahl" title="Briefanrede wählen" style="flex:0 0 auto;max-width:44px"><option value="">▾</option>${anredeVorlagen(k).map(v => `<option value="${esc(v)}">${esc(anredeEinsetzen(v, k))}${/\{/.test(v) ? "  · " + esc(v) : ""}</option>`).join("")}</select>`;
}
function anredeAus(anschrift) {
  const z = (anschrift || "").split("\n").map(s => s.trim()).filter(Boolean);
  for (const l of z) {
    let m = l.match(/^(?:z\.\s*H\.?\s*)?(Herrn?|Frau)\s+(?:(Dr\.|Prof\.(?:\s*Dr\.)?)\s+)?(?:[\wäöüÄÖÜß.-]+\s+)*?([\wäöüÄÖÜß-]+)$/i);
    if (m) {
      const titel = m[2] ? m[2] + " " : "";
      return /^frau/i.test(m[1]) ? `Sehr geehrte Frau ${titel}${m[3]},` : `Sehr geehrter Herr ${titel}${m[3]},`;
    }
    m = l.match(/^(Familie|Fam\.)\s+(.+)$/i);
    if (m) return `Sehr geehrte Familie ${m[2]},`;
  }
  return "Sehr geehrte Damen und Herren,";
}

async function anhangBereich(ziel, {kunde_id, auftrag_id, lieferant_id}) {
  const q = lieferant_id ? "lieferant=" + lieferant_id : auftrag_id ? "auftrag=" + auftrag_id : "kunde=" + kunde_id;
  const zeichnen = async () => {
    const [anh, not] = await Promise.all([api("anhaenge?" + q), api("notizen?" + q)]);
    const t = tabelle("anh", [
      {k: "dateiname", t: "Datei", f: z => `<a href="/api/anhaenge/${z.id}/datei" target="_blank">${esc(z.dateiname)}</a>`},
      ...(auftrag_id || lieferant_id ? [] : [{k: "auftragsnr", t: "Auftrag"}]),
      {k: "groesse", t: "Größe", r: 1, f: z => groesse(z.groesse)},
      {k: "angelegt", t: "Datum", f: z => datum(z.angelegt)},
      {k: "id", t: "", f: z => `<button class="btn rot" data-del="${z.id}">Löschen</button>`},
    ], anh, {leer: "Noch keine Anhänge."});
    ziel.innerHTML = `
      <div class="ablage" id="ablage">Dateien hierher ziehen oder <label style="text-decoration:underline;cursor:pointer">auswählen<input type="file" id="datei" multiple hidden></label></div>
      ${t.html}
      <h3 style="margin:22px 0 8px">Notizen</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px"><textarea id="notiz" rows="2" placeholder="z. B. Telefonat: wünscht Eiche geölt statt lackiert"></textarea><button class="btn prim" id="notizNeu">Hinzufügen</button></div>
      ${not.map(n => `<div class="notiz"><div>${esc(n.text)}</div><span class="hinweis">${datum(n.angelegt)} ${n.angelegt.slice(11,16)}</span><button class="btn rot" data-ndel="${n.id}">×</button></div>`).join("") || `<div class="hinweis">Noch keine Notizen.</div>`}`;
    t.binden(zeichnen);
    const hoch = async files => {
      for (const f of files) {
        const b64 = await new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = err; r.readAsDataURL(f); });
        try { await api("anhaenge", {method: "POST", body: {kunde_id, auftrag_id, lieferant_id, dateiname: f.name, daten: b64}}); }
        catch (e) { toast(e.message, true); }
      }
      toast(files.length + " Datei(en) gespeichert"); zeichnen();
    };
    $("#datei").onchange = e => hoch([...e.target.files]);
    const ab = $("#ablage");
    ab.ondragover = e => { e.preventDefault(); ab.classList.add("drueber"); };
    ab.ondragleave = () => ab.classList.remove("drueber");
    ab.ondrop = e => { e.preventDefault(); ab.classList.remove("drueber"); hoch([...e.dataTransfer.files]); };
    $$("[data-del]").forEach(b => b.onclick = async () => { if (await frage("Anhang löschen?")) { await api("anhaenge/" + b.dataset.del, {method: "DELETE"}); zeichnen(); } });
    $$("[data-ndel]").forEach(b => b.onclick = async () => { if (await frage("Notiz löschen?")) { await api("notizen/" + b.dataset.ndel, {method: "DELETE"}); zeichnen(); } });
    $("#notizNeu").onclick = async () => {
      try { await api("notizen", {method: "POST", body: {kunde_id, auftrag_id, lieferant_id, text: $("#notiz").value}}); zeichnen(); }
      catch (e) { toast(e.message, true); }
    };
  };
  await zeichnen();
}

  };
  ziel.innerHTML = `<div class="titel"><h2>Aufträge</h2>

  let t; $("#aQ").oninput = e => { f.q = e.target.value; clearTimeout(t); t = setTimeout(zeichnen, 250); };

const DATEI_ICON = {pdf: "📕", jpg: "🖼️", jpeg: "🖼️", png: "🖼️", heic: "🖼️", gif: "🖼️", webp: "🖼️",
  doc: "📝", docx: "📝", odt: "📝", txt: "📝", xls: "📊", xlsx: "📊", csv: "📊", ods: "📊",
  dwg: "📐", dxf: "📐", pyo: "📐", pytha: "📐", skp: "📐", step: "📐", stp: "📐", zip: "🗜️", eml: "✉️", msg: "✉️"};
const VORSCHAU = /\.(pdf|jpe?g|png|gif|webp|svg|txt)$/i;
const INTERN = "application/x-jahresring-pfad";
let pbRel = {};   // zuletzt geöffneter Unterordner je Auftrag

function projektBrowser(ziel, a) {
  let rel = pbRel[a.id] || "";
  let eintraege = [], gewaehlt = null;
  const url = p => `auftraege/${a.id}/${p}`;
  const aktion = async (was, body, ok) => {
    try { const r = await api(url(was), {method: "POST", body}); if (ok) toast(typeof ok === "function" ? ok(r) : ok); await laden(); return r; }
    catch (e) { toast(e.message, true); }
  };
  const oeffne = async p => {   // am Büro-PC im zugehörigen Programm öffnen, auf anderen Geräten herunterladen bzw. anzeigen
    try { await api(url("oeffnen"), {method: "POST", body: {pfad: p}}); }
    catch (e) { if (/nur direkt am Büro-PC/.test(e.message)) window.open(`/api/${url("datei")}?pfad=${encodeURIComponent(p)}`, "_blank"); else toast(e.message, true); }
  };
  const elternVon = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";
  const icon = e => e.ordner ? "📁" : (DATEI_ICON[e.name.split(".").pop().toLowerCase()] || "📄");

  const umbenennen = async e => {
    const r = await modal("Umbenennen", `<div class="zeile"><label>Neuer Name</label><div><input name="neu" value="${esc(e.name)}"></div></div>`, "Umbenennen");
    if (r && r.neu.trim() && r.neu !== e.name) aktion("umbenennen", {pfad: e.pfad, neu: r.neu.trim()}, "Umbenannt");
  };
  const loeschen = async e => {
    if (!await frage(`„${e.name}“${e.ordner ? " mit allem Inhalt" : ""} in den Papierkorb verschieben?`)) return;
    aktion("loeschen", {pfad: e.pfad}, r => r.wohin === "Papierkorb" ? "In den Papierkorb verschoben" : "Gelöscht (liegt in daten\\papierkorb)");
  };
  const verschieben = (pfad, zielOrdner) => aktion("verschieben", {pfad, ziel: zielOrdner}, r => r.unveraendert ? "Liegt schon dort" : "Verschoben");
  const hochladen = async (files, zielOrdner) => {
    if (!files.length) return;
    for (const f of files) {
      if (!f.size && !f.type) { toast(`„${f.name}“ ist ein Ordner, bitte Dateien einzeln ziehen oder im Explorer kopieren.`, true); continue; }
      const b64 = await new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = err; r.readAsDataURL(f); });
      try { await api(url("hochladen"), {method: "POST", body: {pfad: zielOrdner, dateiname: f.name, daten: b64}}); }
      catch (e) { toast(e.message, true); }
    }
    toast(`${files.length} Datei(en) abgelegt${zielOrdner ? " in " + zielOrdner.split("/").pop() : ""}`); laden();
  };

  // Kontextmenü (Rechtsklick oder ⋯)
  const menue = (e, x, y) => {
    $$(".pb-menue").forEach(m => m.remove());
  $$(".modal-hg").forEach(m => m.remove());
    const m = document.createElement("div");
    m.className = "pb-menue";
    const punkte = [
      [e.ordner ? "Öffnen" : "Öffnen im Programm", () => e.ordner ? (rel = e.pfad, laden()) : oeffne(e.pfad)],
      ...(!e.ordner && /\.(xml|pdf)$/i.test(e.name) ? [["XML-Ansicht / E-Rechnung prüfen", () => xmlAnsicht(`xml/projekt/${a.id}?pfad=${encodeURIComponent(e.pfad)}`, e.name)]] : []),
      ...(!e.ordner && VORSCHAU.test(e.name) ? [["Vorschau im Browser", () => window.open(`/api/auftraege/${a.id}/datei?pfad=${encodeURIComponent(e.pfad)}`, "_blank")]] : []),
      ["Im Explorer zeigen", () => aktion("zeigen", {pfad: e.pfad})],
      ["Umbenennen …", () => umbenennen(e)],
      ...(rel ? [["Eine Ebene nach oben verschieben", () => verschieben(e.pfad, elternVon(rel))]] : []),
      ["In den Papierkorb", () => loeschen(e), "rot"],
    ];
    m.innerHTML = punkte.map(([t, , k], i) => `<button data-i="${i}" class="${k || ""}">${esc(t)}</button>`).join("");
    document.body.appendChild(m);
    const b = m.getBoundingClientRect();
    m.style.left = Math.min(x, innerWidth - b.width - 8) + "px";
    m.style.top = Math.min(y, innerHeight - b.height - 8) + "px";
    $$("button", m).forEach(btn => btn.onclick = () => { m.remove(); punkte[+btn.dataset.i][1](); });
    setTimeout(() => document.addEventListener("click", () => m.remove(), {once: true}), 0);
  };

  const zeichnen = d => {
    const teile = rel ? rel.split("/") : [];
    const wurzel = d.ordner.split(/[\\/]/).pop();
    const krume = [`<a href="#" data-rel="" data-drop="" title="${esc(wurzel)}">${esc(wurzel.length > 22 ? wurzel.slice(0, 20) + "…" : wurzel)}</a>`,
      ...teile.map((t, i) => `<a href="#" data-rel="${esc(teile.slice(0, i + 1).join("/"))}" data-drop="${esc(teile.slice(0, i + 1).join("/"))}">${esc(t)}</a>`)]
      .join(`<span class="hinweis"> › </span>`);
    ziel.innerHTML = `
      <div class="pb-kopf">
        <h3>Projektordner</h3>
        <button class="pb-ib" id="pbNeu" title="Neuer Unterordner">＋📁</button>
        <button class="pb-ib" id="pbAkt" title="Neu einlesen">↻</button>
        <button class="pb-ib" id="pbExp" title="Im Explorer öffnen">↗</button>
      </div>
      <div class="pb-krume">${krume}</div>
      <div class="pb-liste" id="pbListe">
        ${rel ? `<div class="pb-zeile pb-hoch" data-hoch="1" data-drop="${esc(elternVon(rel))}"><span class="pb-ic">↩</span><span class="pb-name">..</span></div>` : ""}
        ${eintraege.map((e, i) => `
          <div class="pb-zeile${gewaehlt === e.pfad ? " gew" : ""}" draggable="true" data-i="${i}" ${e.ordner ? `data-drop="${esc(e.pfad)}"` : ""} title="${esc(e.name)}">
            <span class="pb-ic">${icon(e)}</span>
            <span class="pb-name">${esc(e.name)}<small>${e.ordner ? `${e.anzahl} Element${e.anzahl === 1 ? "" : "e"}` : `${groesse(e.groesse)} · ${datum(e.geaendert)}`}</small></span>
            <span class="pb-akt">
              <button data-a="umb" title="Umbenennen">✎</button>
              <button data-a="del" title="In den Papierkorb">🗑</button>
              <button data-a="mehr" title="Weitere Aktionen">⋯</button>
            </span>
          </div>`).join("") || `<div class="hinweis" style="padding:14px 6px">${rel ? "Dieser Unterordner ist leer." : "Der Projektordner ist noch leer."}</div>`}
      </div>
      <div class="pb-ablage">Dateien aus dem Explorer oder Outlook hierher ziehen<br>oder <label>auswählen<input type="file" id="pbDatei" multiple hidden></label></div>
      <div class="hinweis pb-pfad" title="${esc(d.ordner)}">${esc(d.ordner)}</div>`;

    const liste = $("#pbListe", ziel);
    $$("[data-rel]", ziel).forEach(el => el.onclick = ev => { ev.preventDefault(); rel = el.dataset.rel; laden(); });
    $("[data-hoch]", ziel)?.addEventListener("click", () => { rel = elternVon(rel); laden(); });
    $$(".pb-zeile[data-i]", ziel).forEach(z => {
      const e = eintraege[+z.dataset.i];
      z.onclick = ev => {
        const b = ev.target.closest("button[data-a]");
        if (b) {
          ev.stopPropagation();
          if (b.dataset.a === "umb") return umbenennen(e);
          if (b.dataset.a === "del") return loeschen(e);
          const r = b.getBoundingClientRect(); return menue(e, r.left - 150, r.bottom + 4);
        }
        if (e.ordner) { rel = e.pfad; laden(); }
        else { gewaehlt = e.pfad; $$(".pb-zeile", ziel).forEach(x => x.classList.toggle("gew", x === z)); }
      };
      z.ondblclick = ev => { if (!e.ordner && !ev.target.closest("button")) oeffne(e.pfad); };
      z.oncontextmenu = ev => { ev.preventDefault(); gewaehlt = e.pfad; menue(e, ev.clientX, ev.clientY); };
      z.ondragstart = ev => { ev.dataTransfer.setData(INTERN, e.pfad); ev.dataTransfer.effectAllowed = "move"; z.classList.add("zieht"); };
      z.ondragend = () => z.classList.remove("zieht");
    });
    // Ablegen: auf Ordnerzeilen, „..“, Pfadleiste oder irgendwo in die Liste (= aktueller Ordner)
    const dropZiel = ev => ev.target.closest("[data-drop]");
    const markiere = el => { $$(".drop-hier", ziel).forEach(x => x.classList.remove("drop-hier")); el && el.classList.add("drop-hier"); };
    ziel.ondragover = ev => {
      ev.preventDefault();
      const t = dropZiel(ev);
      ev.dataTransfer.dropEffect = ev.dataTransfer.types.includes(INTERN) ? "move" : "copy";
      markiere(t || (ev.target.closest("#pbListe, .pb-ablage") ? liste : null));
    };
    ziel.ondragleave = ev => { if (!ziel.contains(ev.relatedTarget)) markiere(null); };
    ziel.ondrop = ev => {
      ev.preventDefault(); markiere(null);
      const t = dropZiel(ev);
      const zielOrdner = t ? t.dataset.drop : rel;
      const intern = ev.dataTransfer.getData(INTERN);
      if (intern) { if (intern !== zielOrdner) verschieben(intern, zielOrdner); return; }
      hochladen([...ev.dataTransfer.files], zielOrdner);
    };
    $("#pbDatei", ziel).onchange = ev => hochladen([...ev.target.files], rel);
    $("#pbAkt", ziel).onclick = laden;
    $("#pbExp", ziel).onclick = () => oeffne(rel);
    $("#pbNeu", ziel).onclick = async () => {
      const r = await modal("Neuer Unterordner", `<div class="zeile"><label>Name</label><div><input name="name" placeholder="z. B. Fotos Aufmaß"></div></div>`, "Anlegen");
      if (r) aktion("neuerordner", {pfad: rel, name: r.name}, "Ordner angelegt");
    };
  };

  async function laden() {
    let d;
    try { d = await api(url("dateien") + "?pfad=" + encodeURIComponent(rel)); }
    catch (e) {
      if (rel) { rel = ""; pbRel[a.id] = ""; return laden(); }
      ziel.innerHTML = `<div class="pb-kopf"><h3>Projektordner</h3></div><div class="leer">${esc(e.message)}</div>`; return;
    }
    if (!d.ordner) {
      ziel.innerHTML = `<div class="pb-kopf"><h3>Projektordner</h3></div><div class="leer">${esc(d.hinweis)}<br><br><a href="#/einstellungen">Zu den Einstellungen</a></div>`;
      return;
    }
    pbRel[a.id] = rel;
    eintraege = d.eintraege;
    zeichnen(d);
  }
  // Zurück aus Word, CAD & Co.: Liste neu einlesen
  window.onfocus = laden;
  laden();
}

function balken(titel, daten, schl) {
  const max = Math.max(1, ...daten.map(d => d.anzahl));
  return `<div class="kachel"><h4>${titel}</h4>${daten.length ? daten.map(d => `<div class="balken"><span>${esc(d[schl] || "ohne")}</span><i style="width:${d.anzahl / max * 100}%"></i><b>${d.anzahl}</b></div>`).join("") : `<span class="hinweis">noch keine Daten</span>`}</div>`;
}

async function neuerLieferant() {
  const d = await modal("Neuer Lieferant", `
    <div class="zeile"><label>Kurzname</label><div><input name="kurzname" placeholder="z. B. Häfele"></div></div>
    <div class="zeile"><label>Gruppe</label><div><select name="gruppe">${opts(E.lieferantengruppen, E.lieferantengruppen?.[0])}</select></div></div>`, "Anlegen");
  if (!d) return;
  if (!d.kurzname.trim()) return toast("Bitte einen Kurznamen eingeben.", true);
  try { const l = await api("lieferanten", {method: "POST", body: d}); location.hash = `#/lieferant/${l.id}`; }

}

const kontextLieferant = l => `Lieferant <b>${l.nummer}</b> · <b>${esc(l.kurzname)}</b> · ${esc([l.plz, l.ort].filter(Boolean).join(" "))}`
  + (l.offen_summe ? ` · offen <b>${zahlDE(l.offen_summe)} €</b>` : "") + (l.aktiv ? "" : " · <span style='color:var(--rot)'>inaktiv</span>");
function kopfLieferant(l, aktiv) {
  const r = [["Lieferant","stamm"],["Konditionen","konditionen"],[`Anhänge (${l.anz_anhaenge + l.anz_notizen})`,"anhaenge"],
    [`Zahlungsaufträge (${l.anz_zahlungen})`,"zahlungen"],["Korrespondenz","briefe"],["Statistik","statistik"]]
    .map(([t, s]) => [t, `#/lieferant/${l.id}/${s}`, s === aktiv]);
  kopf({krumen: [["Lieferanten","#/lieferanten"]], kontext: kontextLieferant(l), reiter: r, zurueck: "#/lieferanten"});
}

async function ansichtLieferant(id, reiter) {
  const l = await api("lieferanten/" + id);
  kopfLieferant(l, reiter);
  const fn = {stamm: lieferantStamm, konditionen: lieferantKonditionen,

}

      ${zeile("Briefanrede", ta(l, "anrede", 2) + anredeAuswahl(l, "anredeWahl") + `<button class="aktion" id="anrede" title="Briefanrede neu aus Anrede und Nachname bilden">${ic("anrede")}</button>`)}

    </div>`;

  const karte = () => { const a = `${$("[data-f=strasse]").value} ${$("[data-f=hausnr]").value}, ${$("[data-f=plz]").value} ${$("[data-f=ort]").value}`; $("#karte").href = "https://www.openstreetmap.org/search?query=" + encodeURIComponent(a); };

    catch (e) { toast(e.message, true); }
  };

// ---------- Zahlungsaufträge ----------
const skontoAktiv = z => z.skonto > 0 && z.skonto_bis && z.skonto_bis >= heute() && !z.bezahlt;
const skontoBetrag = z => Math.round(z.betrag * z.skonto) / 100;
async function zahlungsListe(ziel, lieferant) {
  const f = lieferant ? (filter["zl" + lieferant.id] ||= {q: "", status: "offen", bezahlung: ""}) : filter.zahlungen;
  const gewaehlt = new Set();
  let liste = [];
  const summe = () => {
    const sel = liste.filter(z => gewaehlt.has(z.id));
    const s = sel.reduce((a, z) => a + z.betrag - (skontoAktiv(z) ? skontoBetrag(z) : 0), 0);
    $("#auswahl").innerHTML = sel.length ? `${sel.length} ausgewählt · Zahlbetrag <b>${zahlDE(s)} €</b>` : "Für SEPA-Datei oder „bezahlt“ Zeilen anhaken";
    $("#sepa").disabled = $("#bez").disabled = !sel.length;
  };
  const zeichnen = async () => {
    liste = await api("zahlungen?" + new URLSearchParams({q: f.q, status: f.status, bezahlung: f.bezahlung, ...(lieferant ? {lieferant: lieferant.id} : {})}));
    [...gewaehlt].forEach(i => { if (!liste.some(z => z.id === i)) gewaehlt.delete(i); });
    sortierung.zahl ||= {k: "faellig", ab: false};
    const t = tabelle("zahl", [
      {k: "id", t: "", f: z => z.bezahlt ? "" : `<input type="checkbox" data-w="${z.id}" ${gewaehlt.has(z.id) ? "checked" : ""}>`},
      {k: "nummer", t: "Nummer", f: z => `<a href="#/zahlung/${z.id}">${esc(z.nummer)}</a>`},
      {k: "belegnr", t: "Bemerkung", f: z => esc([z.belegnr && "Rg. " + z.belegnr, z.bemerkung].filter(Boolean).join(" · "))},
      ...(lieferant ? [] : [{k: "lieferant", t: "Lieferant", f: z => `<a href="#/lieferant/${z.lieferant_id}">${esc(z.lieferant)}</a>`}]),
      {k: "betrag", t: "Betrag", r: 1, f: z => zahlDE(z.betrag) + " €"},
      {k: "skonto_bis", t: "Skonto", r: 1, f: z => skontoAktiv(z) ? `<span title="bis ${datum(z.skonto_bis)}" style="color:var(--gruen)">${zahlDE(skontoBetrag(z))} € bis ${datum(z.skonto_bis).slice(0, 6)}</span>` : (z.skonto > 0 && !z.bezahlt ? `<span class="hinweis">abgelaufen</span>` : "")},
      {k: "faellig", t: "Fällig", f: z => !z.bezahlt && z.faellig && z.faellig < heute() ? `<b style="color:var(--rot)">${datum(z.faellig)}</b>` : datum(z.faellig)},
      {k: "bezahlt", t: "Bezahlt", f: z => datum(z.bezahlt)},
      {k: "bezahlung", t: "Bezahlung"},
    ], liste, {klick: z => location.hash = `#/zahlung/${z.id}`, leer: "Keine Zahlungsaufträge in dieser Auswahl.",
      filterzeile: `<td colspan="${lieferant ? 5 : 6}"></td><td colspan="2"><select id="fSt">${[["offen","Offene"],["faellig","Fällige"],["skonto","Skonto möglich"],["bezahlt","Bezahlte"],["","Alle"]].map(([v, l]) => `<option value="${v}"${v === f.status ? " selected" : ""}>${l}</option>`).join("")}</select></td><td><select id="fBz">${opts(E.bezahlarten, f.bezahlung, "Alle")}</select></td>`});
    const offen = liste.filter(z => !z.bezahlt).reduce((a, z) => a + z.betrag, 0);
    $("#zl", ziel).innerHTML = t.html + (liste.length ? `<div class="hinweis" style="text-align:right;margin-top:6px">${liste.length} Posten${offen ? ` · davon offen ${zahlDE(offen)} €` : ""}</div>` : "");
    t.binden(zeichnen);
    $("#fSt").onchange = e => { f.status = e.target.value; zeichnen(); };
    $("#fBz").onchange = e => { f.bezahlung = e.target.value; zeichnen(); };
    $$("[data-w]").forEach(cb => cb.onchange = () => { cb.checked ? gewaehlt.add(+cb.dataset.w) : gewaehlt.delete(+cb.dataset.w); summe(); });
    summe();
  };
  ziel.innerHTML = `<div class="titel"><h2>Zahlungsaufträge</h2>
      <div class="such"><input id="zQ" placeholder="Nummer, Rechnung, Lieferant …" value="${esc(f.q)}" style="width:260px"></div>
      <div class="rechts"><label class="btn prim" title="ZUGFeRD-/XRechnung oder PDF-Rechnung einlesen – Zahlungsauftrag, Lager, Auftrag, Werkzeuge">📥 Rechnung einlesen<input type="file" id="eDatei" accept=".pdf,.xml,application/pdf,text/xml,application/xml" hidden></label>
        <button class="btn" id="zXmlPruef" title="XML-Datei oder ZUGFeRD-PDF anzeigen und prüfen, ohne sie zu buchen">🔍 XML prüfen</button>
        <button class="ib" id="neuZ" title="Neuer Zahlungsauftrag">${ic("neu")}</button></div></div>
    <div class="ein-drop hinweis" id="eDrop">E-Rechnung (PDF mit ZUGFeRD/Factur-X oder XRechnung-XML) hierher ziehen</div>
    ${lieferant ? "" : `<div id="rgPost"></div>`}
    <div id="zl"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px;background:var(--hell);border-radius:6px">
      <span id="auswahl" class="hinweis" style="flex:1"></span>
      <button class="btn prim" id="sepa">SEPA-Datei erstellen</button>
      <button class="btn" id="bez">Als bezahlt markieren</button>
    </div>`;
  let t; $("#zQ").oninput = e => { f.q = e.target.value; clearTimeout(t); t = setTimeout(zeichnen, 250); };
  $("#neuZ").onclick = () => neueZahlung(lieferant);
  $("#zXmlPruef").onclick = xmlDateiWaehlen;
  if (!lieferant) rechnungspostBox($("#rgPost"), () => zeichnen());
  $("#eDatei").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) eingangEinlesen(f, () => zeichnen()); };
  const dz = $("#eDrop");
  ziel.ondragover = e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); dz.classList.add("ueber"); } };
  ziel.ondragleave = e => { if (!ziel.contains(e.relatedTarget)) dz.classList.remove("ueber"); };
  ziel.ondrop = e => { e.preventDefault(); dz.classList.remove("ueber"); const f = e.dataTransfer.files[0]; if (f) eingangEinlesen(f, () => zeichnen()); };
  $("#bez").onclick = async () => {
    const d = await modal("Als bezahlt markieren", `<div class="zeile"><label>Bezahlt am</label><div><input type="date" name="datum" value="${heute()}"></div></div>`, "Markieren");
    if (!d) return;
    await api("zahlungen/bezahlt", {method: "POST", body: {ids: [...gewaehlt], datum: d.datum}});
    toast(`${gewaehlt.size} Zahlung(en) als bezahlt markiert`); gewaehlt.clear(); zeichnen();
  };
  $("#sepa").onclick = () => sepaErstellen([...gewaehlt], () => { gewaehlt.clear(); zeichnen(); });
  await zeichnen();
}

async function sepaErstellen(ids, danach) {
  if (!E.sepa_iban) return toast("Bitte zuerst in den Einstellungen die eigene Bankverbindung für SEPA eintragen.", true);
  const d = await modal("SEPA-Überweisungsdatei", `
    <div class="zeile"><label>Ausführung</label><div><input type="date" name="ausfuehrung" value="${heute()}"></div></div>
    <p class="hinweis">Skonto wird automatisch abgezogen, wenn die Frist am Ausführungstag noch läuft. Die Datei wird anschließend im Onlinebanking unter „SEPA-Datei hochladen“ bzw. „Sammelüberweisung importieren“ hochgeladen.</p>`, "Datei erstellen");
  if (!d) return;
  try {
    const r = await api("zahlungen/sepa", {method: "POST", body: {ids, ausfuehrung: d.ausfuehrung}});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([r.xml], {type: "application/xml"}));
    a.download = r.dateiname; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`${r.anzahl} Überweisung(en) über ${zahlDE(r.summe)} € gespeichert`);
    if (await frage(`SEPA-Datei „${r.dateiname}“ wurde heruntergeladen.\n\nDie ${r.anzahl} Zahlung(en) jetzt mit Datum ${datum(d.ausfuehrung)} als bezahlt markieren?\n(Erst bestätigen, wenn die Datei im Onlinebanking hochgeladen wird.)`)) {
      await api("zahlungen/bezahlt", {method: "POST", body: {ids, datum: d.ausfuehrung}});
    }
    danach && danach();
  } catch (e) { toast(e.message, true); }
}

async function neueZahlung(lieferant) {
  const [lieferanten, auftraege] = await Promise.all([lieferant ? [lieferant] : api("lieferanten"), api("auftraege?status=")]);
  if (!lieferanten.length) return toast("Bitte zuerst einen Lieferanten anlegen.", true);
  const d = await modal("Neuer Zahlungsauftrag", `
    <div class="zeile"><label>Lieferant</label><div><select name="lieferant_id">${lieferanten.map(l => `<option value="${l.id}">${l.nummer} · ${esc(l.kurzname)}</option>`).join("")}</select></div></div>
    <div class="zeile"><label>Rechnungsnr.</label><div><input name="belegnr"></div></div>
    <div class="zeile"><label>Rechnungsdatum</label><div><input type="date" name="belegdatum" value="${heute()}"></div></div>
    <div class="zeile"><label>Betrag brutto</label><div><input name="betrag" placeholder="0,00" style="text-align:right"> €</div></div>
    <div class="zeile"><label>Auftrag</label><div><select name="auftrag_id"><option value="">kein Auftrag</option>${auftraege.map(a => `<option value="${a.id}">${esc(a.nummer)} · ${esc(a.bezeichnung)}</option>`).join("")}</select></div></div>
    <div class="zeile"><label>Bemerkung</label><div><input name="bemerkung" placeholder="z. B. Egger Platten, Kanten"></div></div>
    <p class="hinweis">Fälligkeit, Skontofrist, Empfänger und IBAN werden aus den Konditionen des Lieferanten übernommen.</p>`, "Anlegen");
  if (!d) return;
  if (!zahlEin(d.betrag)) return toast("Bitte einen Betrag eingeben.", true);
  const anlegen = async trotzdem => {
    try {
      const z = await api("zahlungen", {method: "POST", body: {...d, lieferant_id: +d.lieferant_id, betrag: zahlEin(d.betrag), trotzdem}});
      toast(`Zahlungsauftrag ${z.nummer} angelegt`); location.hash = `#/zahlung/${z.id}`;
    } catch (e) {
      if (!trotzdem && /schon als Zahlungsauftrag/.test(e.message)) { if (await frage(e.message + "\n\nTrotzdem noch einmal anlegen?", {ok: "Trotzdem anlegen"})) anlegen(true); }
      else toast(e.message, true);
    }
  };
  anlegen(false);
}

async function ansichtZahlung(id) {
  const [z, auftraege] = await Promise.all([api("zahlungen/" + id), api("auftraege")]);
  const kontext = z => `Zahlungsauftrag <b>${esc(z.nummer)}</b> · <a href="#/lieferant/${z.lieferant_id}">${z.lieferantennr} ${esc(z.lieferant)}</a> · ${zahlDE(z.betrag)} € · ${z.bezahlt ? `<span style="color:var(--gruen)">bezahlt am ${datum(z.bezahlt)}</span>` : "offen"}`;
  kopf({krumen: [["Zahlungsaufträge", "#/zahlungen"]], zurueck: `#/lieferant/${z.lieferant_id}/zahlungen`, kontext: kontext(z),
    reiter: [["Zahlungsauftrag", `#/zahlung/${id}`, true], ["Lieferant", `#/lieferant/${z.lieferant_id}`, false], ["Alle Zahlungsaufträge", "#/zahlungen", false]]});

    const b = zahlEin($("[data-f=betrag]").value), v = +$("[data-f=vorsteuer]").value, s = zahlEin($("[data-f=skonto]").value);
    const netto = b / (1 + v / 100);
