    const iban = $("[data-f=iban]").value;
    $("#ibanOk").innerHTML = !iban ? "" : ibanOk(iban) ? `<span style="color:var(--gruen)">✓ gültig</span>` : `<span style="color:var(--rot)">Prüfziffer falsch</span>`;
  };
  $("#inhalt").innerHTML = `
    <div class="titel"><h2>Zahlungsauftrag ${esc(z.nummer)}</h2><span class="speicher"></span>
      <div class="rechts">${z.bezahlt ? `<span class="tag" title="Bezahlte Zahlungsaufträge sind gesperrt. Änderbar bleiben Bemerkung, Auftrag und Zahlart.">🔒 bezahlt – gesperrt</span>${ICH && ICH.rechte.inhaber ? `<button class="btn" id="zOeffnen">„Bezahlt“ zurücknehmen</button>` : ""}`
          : `<button class="btn prim" id="sepa1">SEPA-Datei</button><button class="btn" id="heute">Heute bezahlt</button>
        <button class="ib" id="loeschen" title="Zahlungsauftrag löschen">${ic("loeschen")}</button>`}</div></div>
    <div class="form" id="f">
      ${zeile("Rechnungsnr.", inp(z, "belegnr"))}
      ${zeile("Rechnungsdatum", `<input type="date" data-f="belegdatum" value="${esc(z.belegdatum)}">`)}
      ${zeile("Betrag brutto", `<input data-f="betrag" value="${zahlDE(z.betrag)}" style="text-align:right" class="klein"> €`)}
      ${zeile("Vorsteuer", `<select data-f="vorsteuer" class="klein">${[19,7,0].map(v => `<option value="${v}"${+z.vorsteuer === v ? " selected" : ""}>${zahlDE(v)}</option>`).join("")}</select> %`)}
      <div class="zeile voll"><label></label><div id="rech" class="hinweis" style="padding-top:8px"></div></div>
      ${zeile("Bemerkung", inp(z, "bemerkung"), true)}
      ${z.datei ? zeile("Rechnung", `<a class="btn" href="/api/zahlungen/${id}/datei" target="_blank">📄 Rechnung ansehen</a><button class="btn" type="button" id="zXml" style="flex:0 0 auto">🔍 XML</button><span class="hinweis" style="padding-top:6px">${esc(z.datei.split(/[\\/]/).pop())}</span>`, true) : ""}
      ${zeile("Auftrag", `<select data-f="auftrag_id"><option value="">kein Auftrag</option>${auftraege.map(a => `<option value="${a.id}"${a.id === z.auftrag_id ? " selected" : ""}>${esc(a.nummer)} · ${esc(a.bezeichnung)}</option>`).join("")}</select>`, true)}
      <div class="sektion">Zahlung</div>
      ${zeile("Fällig am", `<input type="date" data-f="faellig" value="${esc(z.faellig)}">`)}
      ${zeile("Bezahlung", sel(z, "bezahlung", E.bezahlarten))}
      ${zeile("Skonto", `<input data-f="skonto" value="${zahlDE(z.skonto)}" class="klein"> % bis <input type="date" data-f="skonto_bis" value="${esc(z.skonto_bis)}">`)}
      ${zeile("Bezahlt am", `<input type="date" data-f="bezahlt" value="${esc(z.bezahlt)}">`)}
      ${zeile("Empfänger", inp(z, "empfaenger"), true)}

    </div>`;
  rechnung();
  if (z.bezahlt) $$("#f [data-f]").forEach(el => { if (!["bemerkung", "auftrag_id", "bezahlung"].includes(el.dataset.f)) el.disabled = true; });
  const zo = $("#zOeffnen"); if (zo) zo.onclick = async () => {
    if (!await frage(`„Bezahlt am ${datum(z.bezahlt)}“ für ${z.nummer} zurücknehmen?\n\nDer Zahlungsauftrag ist danach wieder offen und änderbar. Der Vorgang wird protokolliert.`, {ok: "Zurücknehmen"})) return;

  };

  const zx = $("#zXml"); if (zx) zx.onclick = () => xmlAnsicht(`xml/zahlung/${id}`, `Rechnung zu ${z.nummer}`);

  };
}

// ---------- Zahlungsstatistik ----------
async function zahlungsStatistik(ziel, lieferant) {
  const j = new Date().getFullYear(), jahre = Array.from({length: 8}, (_, i) => j - i);
  const jsel = (n, w) => `<select name="${n}">${jahre.map(y => `<option${y === w ? " selected" : ""}>${y}</option>`).join("")}</select>`;
  const vsel = (n, w) => `<select name="${n}">${[0, 7, 19].map(v => `<option value="${v}"${v === w ? " selected" : ""}>${zahlDE(v)}</option>`).join("")}</select>`;
  ziel.innerHTML = `
    <div class="titel"><h2>Zahlungsstatistik Lieferanten</h2></div>
    <div class="form nicht-drucken" id="sf">
      <div class="sektion">Auswahl</div>
      ${zeile("Lieferantennr.", `<input name="lieferant" value="${lieferant ? lieferant.nummer : ""}" class="klein" placeholder="alle">`)}
      ${zeile("Gruppe", `<select name="gruppe">${opts(E.lieferantengruppen, "", "Alle")}</select>`)}
      ${zeile("Zeitraum", jsel("von", j) + " bis " + jsel("bis", j))}
      ${zeile("Vorsteuer", vsel("vst_von", 0) + " bis " + vsel("vst_bis", 19) + " %")}
      ${zeile("Datum", `<div class="radio"><label><input type="radio" name="datum" value="beleg" checked> Rechnungsdatum</label><label><input type="radio" name="datum" value="zahlung"> Zahlungsdatum</label></div>`)}
      ${zeile("Statistik nach", `<select name="nach">${[["jahr","Jahr"],["quartal","Quartal"],["monat","Monat"],["lieferant","Lieferant"],["gruppe","Gruppe"],["vorsteuer","Vorsteuersatz"]].map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>`)}
      <div class="zeile voll"><label></label><div><button class="btn prim" id="los">Statistik erstellen</button><button class="btn" id="druck">Drucken</button></div></div>
    </div>
    <div id="erg" style="margin-top:16px"></div>`;
  const los = async () => {
    const p = {};
    $$("[name]", $("#sf")).forEach(el => { if (el.type !== "radio" || el.checked) p[el.name] = el.value; });
    const daten = await api("zahlungsstatistik?" + new URLSearchParams(p));
    const sum = k => daten.reduce((a, g) => a + g[k], 0);
    const titel = {jahr: "Jahr", quartal: "Quartal", monat: "Monat", lieferant: "Lieferant", gruppe: "Gruppe", vorsteuer: "Vorsteuer"}[p.nach];
    $("#erg").innerHTML = daten.length ? `
      <div class="hinweis" style="margin-bottom:6px">${p.lieferant ? "Lieferant " + esc(p.lieferant) + " · " : ""}${p.gruppe ? esc(p.gruppe) + " · " : ""}${p.von}–${p.bis} · nach ${p.datum === "zahlung" ? "Zahlungsdatum (nur bezahlte)" : "Rechnungsdatum"}</div>

      ${daten.map(g => `<tr><td>${esc(g.schluessel)}</td><td class="r">${g.anzahl}</td><td class="r">${zahlDE(g.netto)} €</td><td class="r">${zahlDE(g.vorsteuer)} €</td><td class="r">${zahlDE(g.brutto)} €</td></tr>`).join("")}
      <tr><td><b>Summe</b></td><td class="r"><b>${sum("anzahl")}</b></td><td class="r"><b>${zahlDE(sum("netto"))} €</b></td><td class="r"><b>${zahlDE(sum("vorsteuer"))} €</b></td><td class="r"><b>${zahlDE(sum("brutto"))} €</b></td></tr></table>`
      : `<div class="leer">Keine Zahlungsaufträge in dieser Auswahl.</div>`;
  };
  $("#los").onclick = () => los().catch(e => toast(e.message, true));
  $("#druck").onclick = async () => { await los(); window.print(); };
  await los();
}

// Eingescannte Unterschrift: Weiß durchsichtig machen (weiche Kanten), Farbe der Tinte erhalten, auf den Strich zuschneiden
function unterschriftAufbereiten(datei) {
  return new Promise((ok, fehler) => {
    const url = URL.createObjectURL(datei), img = new Image();
    img.onload = () => {
      const f = Math.min(1, 1600 / img.naturalWidth);
      const w = Math.round(img.naturalWidth * f), hh = Math.round(img.naturalHeight * f);
      const c = document.createElement("canvas"); c.width = w; c.height = hh;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, hh); g.drawImage(img, 0, 0, w, hh);
      const d = g.getImageData(0, 0, w, hh), p = d.data;
      let x0 = w, y0 = hh, x1 = 0, y1 = 0;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], gg = p[i + 1], b = p[i + 2];
        const hell = Math.max(r, gg, b);           // Papier ist in allen Kanälen hell, Tinte nicht
        let a = (235 - hell) / (235 - 150);        // ab ~235 durchsichtig, unter ~150 voll deckend
        a = Math.max(0, Math.min(1, a));
        if (a > 0) {
          // Farbe gegen den weißen Hintergrund zurückrechnen, damit keine hellen Säume bleiben
          for (let k = 0; k < 3; k++) p[i + k] = Math.max(0, Math.min(255, Math.round((p[i + k] - 255 * (1 - a)) / a)));
        }
        p[i + 3] = Math.round(a * 255);
        if (a > 0.08) { const px = (i / 4) % w, py = Math.floor(i / 4 / w); if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
      }
      URL.revokeObjectURL(url);
      if (x1 <= x0 || y1 <= y0) return fehler(new Error("Auf dem Bild ist keine Unterschrift zu erkennen."));
      g.putImageData(d, 0, 0);
      const rand = 6, cw = Math.min(w, x1 - x0 + 2 * rand), ch = Math.min(hh, y1 - y0 + 2 * rand);
      const z = document.createElement("canvas"); z.width = cw; z.height = ch;
      z.getContext("2d").drawImage(c, Math.max(0, x0 - rand), Math.max(0, y0 - rand), cw, ch, 0, 0, cw, ch);
      ok(z.toDataURL("image/png").split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error("Das Bild konnte nicht gelesen werden (JPG oder PNG).")); };
    img.src = url;
  });
}

// Hilfeblasen für ⓘ-Symbole (Hover, Fokus oder Antippen)
(() => {
  let blase, aktiv = null;
  const zeigen = el => {
    if (!blase) { blase = document.createElement("div"); blase.id = "hilfeBlase"; document.body.appendChild(blase); }
    if (!document.body.contains(blase)) document.body.appendChild(blase);
    aktiv = el; blase.textContent = el.dataset.hilfe; blase.classList.add("an");
    const r = el.getBoundingClientRect(), b = blase.getBoundingClientRect();
    let x = Math.min(Math.max(8, r.left + r.width / 2 - b.width / 2), innerWidth - b.width - 8);
    let y = r.bottom + 8; if (y + b.height > innerHeight - 8) y = r.top - b.height - 8;
    blase.style.left = x + "px"; blase.style.top = y + "px";
  };
  const weg = () => { aktiv = null; blase && blase.classList.remove("an"); };
  document.addEventListener("mouseover", e => { const el = e.target.closest && e.target.closest("[data-hilfe]"); if (el) zeigen(el); else if (aktiv) weg(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-hilfe]"); if (el) zeigen(el); });
  document.addEventListener("focusout", e => { if (e.target === aktiv) weg(); });
  document.addEventListener("click", e => { const el = e.target.closest && e.target.closest("[data-hilfe]"); if (el) { e.preventDefault(); e.stopPropagation(); aktiv === el && blase.classList.contains("an") ? weg() : zeigen(el); } }, true);
  addEventListener("scroll", weg, true); addEventListener("hashchange", weg);
})();
function skriptLaden(src) {
  return new Promise((ok, fehler) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fehler(new Error("pdf.js konnte nicht geladen werden (Internetverbindung?)")); document.head.appendChild(s); });
}
async function pdfAlsBilder(datei, dpi) {
  const basis = "/pdfjs/";
  await skriptLaden(basis + "pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = basis + "pdf.worker.min.js";
  const doc = await window.pdfjsLib.getDocument({data: new Uint8Array(await datei.arrayBuffer()), isEvalSupported: false}).promise;
  const seiten = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const seite = await doc.getPage(i);
    const vp = seite.getViewport({scale: dpi / 72});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await seite.render({canvasContext: ctx, viewport: vp}).promise;
    seiten.push(c.toDataURL("image/png").split(",")[1]);
  }
  return seiten;
}

// Breite Tabellen bekommen einen eigenen Scrollstreifen, statt aus der Box zu laufen
// Ist eine Tabelle breiter als der Platz, erscheint am PC zusätzlich oben eine Bildlaufleiste (die untere liegt bei langen Listen außer Sicht).
const TAB_BEOBACHTER = typeof ResizeObserver === "function" ? new ResizeObserver(eintraege => eintraege.forEach(e => tabObenPruefen(e.target.closest(".tab-scroll") || e.target))) : null;
function tabObenPruefen(w) {
  if (!w || !w.classList || !w.classList.contains("tab-scroll")) return;
  const o = w.previousElementSibling && w.previousElementSibling.classList.contains("tab-oben") ? w.previousElementSibling : null;
  if (!o) return;
  const zuBreit = w.scrollWidth > w.clientWidth + 2;
  o.classList.toggle("an", zuBreit);
  o.firstElementChild.style.width = w.scrollWidth + "px";
  if (zuBreit) o.scrollLeft = w.scrollLeft;
}
function tabellenEinpacken(wurzel) {
  (wurzel || document).querySelectorAll("table.liste").forEach(t => {
    const p = t.parentElement;
    if (!p || t.parentElement.closest("td") || t.closest(".kp,.tl-inhalt,.ls-brett")) return;
    let w = p;
    if (p.classList.contains("tab-scroll")) {
      if (p.dataset.oben) return;           // schon vorbereitet (oder eine von Hand eingepackte Tabelle)
    } else {
      w = document.createElement("div"); w.className = "tab-scroll";
      p.insertBefore(w, t); w.appendChild(t);
    }
    w.dataset.oben = "1";
    const o = document.createElement("div"); o.className = "tab-oben"; o.innerHTML = "<div></div>";
    w.parentElement.insertBefore(o, w);
    o.addEventListener("scroll", () => { if (Math.abs(w.scrollLeft - o.scrollLeft) > 1) w.scrollLeft = o.scrollLeft; });
    w.addEventListener("scroll", () => { if (Math.abs(o.scrollLeft - w.scrollLeft) > 1) o.scrollLeft = w.scrollLeft; });
    if (TAB_BEOBACHTER) { TAB_BEOBACHTER.observe(w); TAB_BEOBACHTER.observe(t); }
    requestAnimationFrame(() => tabObenPruefen(w));
  });
}
new MutationObserver(() => { const el = document.getElementById("inhalt"); if (el) tabellenEinpacken(el); document.querySelectorAll(".modal").forEach(m => tabellenEinpacken(m)); })
  .observe(document.documentElement, {childList: true, subtree: true});

// Ein Eintrag je besuchtem Objekt (Kunde, Auftrag, Position, Beleg, Liste …); Reiterwechsel im selben Objekt ersetzen nur den Eintrag.
const VERLAUF = (() => { try { return JSON.parse(sessionStorage.getItem("verlauf") || "[]"); } catch (e) { return []; } })();
let zurueckLaeuft = false;
function objektSchluessel(h) {
  const t = (h || "#/start").replace(/^#\/?/, "").split("/");
  if (["kunde", "auftrag", "position", "beleg", "lieferant", "zahlung"].includes(t[0]) && t[1]) return t[0] + "/" + t[1];
  return t[0] || "start";

function verlaufMerken() {
  const h = location.hash || "#/start", k = objektSchluessel(h);
  if (zurueckLaeuft) zurueckLaeuft = false;
  else if (VERLAUF.length > 1 && VERLAUF[VERLAUF.length - 2].k === k) VERLAUF.pop();   // Browser-Zurück
  else if (VERLAUF.length && VERLAUF[VERLAUF.length - 1].k === k) {}                   // Reiterwechsel
  else VERLAUF.push({k, h});
  VERLAUF[VERLAUF.length - 1].h = h;
  if (VERLAUF.length > 60) VERLAUF.splice(0, VERLAUF.length - 60);
  try { sessionStorage.setItem("verlauf", JSON.stringify(VERLAUF)); } catch (e) {}
}

    else if (a === "statistik") await ansichtStatistik();
    else if (a === "einstellungen") await ansichtEinstellungen(b || "firma", c, d);
    else if (a === "lieferanten") await ansichtLieferanten();
    else if (a === "material") await ansichtMaterial(b || "holzwerkstoffe", c);
    else if (a === "mat" && b) await ansichtMaterialDetail(+b, c || "stamm");
    else if (a === "lieferant" && b) await ansichtLieferant(+b, c || "stamm");
    else if (a === "zahlungen") { LIEF_REITER("z"); await zahlungsListe($("#inhalt"), null); }
    else if (a === "zahlung" && b) await ansichtZahlung(+b);
    else if (a === "kunden" && b === "import") await ansichtKundenImport();
    else if (a === "kunden") await ansichtKunden();
    else if (a === "arbeitsschutz") await ansichtArbeitsschutz(b || "uebersicht", c, d);
    else await ansichtStart(b);
  } catch (e) {
    // Nur wenn der Server gar nicht antwortet, liegt es am Programm im Hintergrund – sonst ist die Meldung selbst die Erklärung
    const netz = !e.status && /fetch|network|load failed/i.test(String(e.message));
    $("#inhalt").innerHTML = `<div class="leer">${e.status ? esc(e.message) : `Fehler: ${esc(e.message)}${netz ? "<br><br>Läuft das Programm noch? Ggf. start.bat neu starten." : ""}`}</div>`;
  }
}
window.addEventListener("hashchange", render);
const VERSION = "2026.11.01-139";
(async () => {
  try {
    const v = await api("version").catch(() => ({}));
    if (v.version !== VERSION) document.body.insertAdjacentHTML("afterbegin",
      `<div style="background:var(--rot);color:#fff;padding:10px 16px;text-align:center">Das Programm im Hintergrund ist noch die alte Version. Bitte das schwarze Fenster schließen und start.bat neu starten, dann diese Seite neu laden.</div>`);
  } catch (e) {}
  let st = null;
  try { st = await (await fetch("/api/anmeldung")).json(); } catch (e) { toast("Server nicht erreichbar", true); return; }
  if (!st.benutzer) return anmeldeSeite(st);
  ICH = st.benutzer;
  try { E = await api("einstellungen"); } catch (e) { toast("Server nicht erreichbar", true); }
  document.title = "Jahresring" + (E.firma ? " · " + E.firma : "");
  render();
  if (darf("auftraege", 2)) setTimeout(bildVariantenNachruesten, 4000);
})();
</script>
