<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3b3530"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}</style>
<title>Zuschnitt · Jahresring</title>
<style>
/* Layout: Werkbank-Bildschirm. Schmale Kopfleiste, Plattenreiter, großer Plattenplan, Teileliste rechts (Tablet quer) bzw. unten (Hochformat). */
:root {
  /* Farben wie Jahresring (Büroprogramm) */
  --bg: #ece8e1;
  --surface: #ffffff;
  --ink: #2a2622;
  --ink-deep: #1f1b18;
  --muted: #7a7168;
  --line: #ddd6cc;
  --offcut: #c9bfb2;
  --part: #f4ead9;
  --part-edge: #b8834f;
  --done: #ebe6de;
  --done-ink: #a39a90;
  --wood: #b8834f;
  --accent: #9a6a3a;
  --accent-ink: #ffffff;
  --ok: #4d7a45;
  --warn: #b04236;
  --track: #e4ddd2;
  --dunkel: #3b3530;
  --dunkel-ink: #efe8de;
  --label: #efe6da;
  /* Schrift wie in der Verschnittberechnung: Systemschrift (Android: Roboto, Windows: Segoe UI) */
  --font-display: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --r: 6px;
}
/* Immer helle Darstellung wie am PC, auch wenn das Tablet auf dunkel steht */
:root { color-scheme: light; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, select, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.bar {
  flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-block: 10px; border-bottom: 3px solid var(--accent);
  /* dunkle Leiste über die ganze Breite wie in Jahresring */
  background: var(--dunkel); color: var(--dunkel-ink);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
header.bar .logo { display: none; }   /* Firmenlogo bleibt für PDF und Etiketten im Dokument */
.marke { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.marke img { width: 38px; height: 38px; display: block; }
.marke b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .2px; color: #fff; line-height: 1.1; }
.marke small { display: block; font-size: 12px; color: #bfb3a5; }
header.bar .proj span { color: #bfb3a5; }
header.bar .proj b { color: #fff; }
header.bar .total { color: #fff; }
header.bar .total span { color: #bfb3a5; }
header.bar .btn:not(.primary):not(.stockbtn) { background: rgba(255,255,255,.08); color: var(--dunkel-ink); border-color: rgba(255,255,255,.22); }
header.bar .btn.primary { background: var(--wood); border-color: var(--wood); }
@media (max-width: 600px) { .marke small { display: none; } .marke img { width: 30px; height: 30px; } }
.logo { display: block; height: 52px; width: auto; flex: 0 0 auto; }
@media (max-width: 600px) { .logo { height: 34px; } }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; }
.brand small { font-weight: 500; color: var(--muted); letter-spacing: .08em; font-size: 13px; margin-left: 6px; }
.proj { flex: 1 1 260px; min-width: 0; display: grid; gap: 0; line-height: 1.15; }
.proj b { font-family: var(--font-display); font-size: 21px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job select {
  flex: 1; min-width: 0; height: 44px; padding: 0 10px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); font-weight: 600;
}
.btn {
  height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn, label.btn { cursor: pointer; }
.btn[disabled] { cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent); }
.total { font-family: var(--font-display); font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total span { color: var(--muted); font-size: 15px; }

.tabs { flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.tab {
  flex: 0 0 auto; min-height: 48px; padding: 6px 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); text-align: left; display: grid; gap: 1px;
}
.tab b { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.tab i.mat { font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab i { font-style: normal; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--wood); }
.tab.complete i { color: var(--ok); font-weight: 600; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-bottom: 12px; }
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.lblst.ok { color: var(--ok); border-color: var(--ok); }
.lblset { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.lblset select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); margin-left: 6px; }
#printArea { display: none; }
.startview { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px 0; }
.startbox { text-align: center; max-width: 440px; display: grid; gap: 10px; justify-items: center; }
.startbox h1 { margin: 0; font-family: var(--font-display); font-size: 26px; }
.startbox p { margin: 0; color: var(--muted); }
.startacts { display: flex; gap: 10px; margin-top: 8px; }
.stockview { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.foldbtn { border: 0; background: none; padding: 6px 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.foldbtn .chev { font-size: 14px; width: 14px; color: var(--accent); }
.foldbtn .cnt { text-transform: none; letter-spacing: 0; font-weight: 500; background: var(--part); color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: 13px; }
.secbody { display: grid; gap: 8px; }
.sug { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 14px; display: grid; gap: 8px; }
.sug.full { border-color: var(--ok); }
.sugh { font-size: 15px; } .okt { color: var(--ok); font-weight: 600; }
.sugr { display: grid; grid-template-columns: minmax(200px, auto) 1fr auto; gap: 4px 14px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 700px) { .sugr { grid-template-columns: 1fr auto; } .sugr .note { grid-column: 1 / -1; grid-row: 2; } }
.resvd { color: var(--accent); font-weight: 600; }
.btn.sm.xs { height: 28px; padding: 0 8px; font-size: 12px; margin-left: 4px; }
.jobline { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; }
.tbl td.jobs { min-width: 220px; max-width: 300px; white-space: normal; overflow-wrap: anywhere; }
.stockbtn { flex-direction: column; justify-content: center; line-height: 1.1; gap: 1px; background: var(--part); border-color: var(--wood); color: var(--ink); }
.stockbtn small { font-size: 11px; font-weight: 500; color: var(--accent); }
.stockbtn.dirtyb small { color: var(--warn); }
.stockbtn.active { box-shadow: inset 0 -4px 0 var(--wood); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; }
.tbl td.acts { white-space: nowrap; text-align: right; }
.tbl td.acts .btn + .btn { margin-left: 6px; }
.tbl td.warn, .dirty { color: var(--warn); font-weight: 600; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.addrow input:not([type=checkbox]), .search, .dlg input:not([type=checkbox]) { font: inherit; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; }
.addrow input[name=material] { width: 200px; } .addrow input[name=location] { width: 140px; }
.addrow input[type=number] { width: 96px; }
.search { width: min(420px, 100%); }
.cbx { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
.cbx input { width: 20px; height: 20px; accent-color: var(--accent); }
.log { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.dlg { border: 1px solid var(--line); border-radius: var(--r); padding: 20px; max-width: 460px; width: calc(100% - 32px); background: var(--surface); color: var(--ink); }
.dlg::backdrop { background: rgba(0,0,0,.35); }
.dlg h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; }
.dlg form { display: grid; gap: 12px; }
.dlg label { display: grid; gap: 4px; font-size: 14px; }
.dlg .cbx { display: inline-flex; }
.restlist { display: grid; gap: 8px; }
.restrow { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: end; }
.restrow .cbx { padding-bottom: 10px; }
.dlgrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlgbtns { display: flex; justify-content: flex-end; gap: 10px; }
@media print {
  @page { size: 70mm 74mm; margin: 0; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  #printArea .lblpage { width: 70mm; height: 74mm; overflow: hidden; break-after: page; page-break-after: always; }
  #printArea .lblpage:last-child { break-after: auto; page-break-after: auto; }
  #printArea svg { width: 70mm; height: 74mm; display: block; }
}
.allow { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); }
.allow input { width: 64px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); text-align: right; }
.platebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; }
.plateacts { display: flex; align-items: center; gap: 8px; }
.plateacts .openct { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.plateacts .btn { height: 40px; font-size: 14px; }
.plateinfo { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); }
.plateinfo strong { color: var(--ink); font-weight: 600; }
.canvas { flex: 1; min-height: 0; position: relative; }
svg.plan { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 2; }
.zoomctl button { min-width: 52px; height: 52px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-family: var(--font-display); font-size: 24px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.zoomctl button.fit { font-size: 16px; }
.plate-rect { fill: var(--offcut); }
.rest rect { fill: none; stroke: #8a7d6e; pointer-events: none; }
.rest text { fill: #5f554b; font-family: var(--font-display); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-variant-numeric: tabular-nums; }
.part rect, .part polygon { fill: var(--part); stroke: var(--part-edge); stroke-linejoin: round; }
.part rect.hit { fill: transparent; stroke: none; }
.part text { fill: var(--ink); font-family: var(--font-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.part .dim { font-variant-numeric: tabular-nums; font-weight: 600; }
.part .nm { font-weight: 600; }
.part .grp { font-weight: 500; fill: var(--muted); }
.part .posc { fill: var(--surface); stroke: var(--part-edge); pointer-events: none; }
.part .posn { fill: var(--ink); font-weight: 700; font-family: var(--font-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; font-variant-numeric: tabular-nums; }
.part.done .posc { stroke: var(--done-ink); }
.part.done .posn, .part.done .grp { fill: var(--done-ink); }
.part.approx rect, .part.approx polygon { stroke-dasharray: 12 8; stroke: var(--accent); }
.part.done rect:not(.hit), .part.done polygon { fill: var(--done); stroke: var(--done-ink); }
.part.done text { fill: var(--done-ink); }
.part .x { stroke: var(--ok); stroke-linecap: butt; pointer-events: none; }
.part { cursor: pointer; }
.part.flash rect { fill: var(--accent); }

aside.list { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
aside.list h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 12px 6px; display: flex; justify-content: space-between; }
aside.list ol { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; flex: 1; }
aside.list li button {
  width: 100%; min-height: 48px; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px;
  padding: 6px 8px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left;
}
.chk { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; }
.done .chk { background: var(--ok); border-color: var(--ok); }
.done .chk::after { content: ""; width: 6px; height: 12px; border: solid var(--surface); border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
li .nmw { min-width: 0; display: grid; }
li .grp { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .pos { font-style: normal; font-family: var(--font-display); font-weight: 700; color: var(--accent); }
li .nm2 { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .d2 { font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums; }
li.done .nm2, li.done .d2 { color: var(--done-ink); text-decoration: line-through; }
.listfoot { padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.listfoot .btn { height: 40px; font-size: 14px; flex: 1; justify-content: center; }

.note { font-size: 13px; color: var(--muted); }
.badge { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 12px; font-weight: 500; max-width: calc(100% - 32px); z-index: 20;
}
.toast button { height: 40px; border-radius: 4px; border: 0; padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- Übersicht ---------- */
.tab.ov { background: var(--part); color: var(--ink); border-color: var(--wood); }
.tab.ov i { color: var(--accent); }
.tab.ov[aria-selected="true"] { box-shadow: inset 0 -4px 0 var(--wood); }
#overview { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }
.ov-wrap { display: grid; gap: 22px; max-width: 1200px; }
.ov-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.ov-head h1 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.ov-head .meta { font-size: 14px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.kpi { padding: 12px 16px; border-right: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.kpi:last-child { border-right: 0; }
.kpi .t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi.key .v { color: var(--accent); }
.ov-sec { display: grid; gap: 8px; }
.ov-sec h2 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ov-sec .note { max-width: 72ch; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--ink); }
.tbl td.wrapc { white-space: normal; min-width: 140px; }
.tbl tr.link { cursor: pointer; }
.tbl tr.link:hover td { background: var(--bg); }
.tbl input.price { width: 96px; height: 38px; padding: 0 8px; text-align: right; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-variant-numeric: tabular-nums; }
.ubar { position: relative; width: 140px; height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ubar > span { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 99px; }
.ubar.low > span { background: #a89f94; }
.ubar.mid > span { background: #c9a227; }
.planlegende { flex: none; font-size: 12.5px; color: var(--muted); padding: 4px 2px 0; }
@media print { .planlegende { display: none; } }
.pct { display: inline-block; width: 52px; text-align: right; margin-left: 8px; }
.ov-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.confirm { flex-shrink: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

@media (max-width: 820px), (orientation: portrait) {
  main { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .part rect, .part polygon { transition: fill .15s; }
}
</style>
</head><body>


<header class="bar">
  <img class="logo" id="logo" alt="">
  <div class="marke"><img src="ring-hell.svg" alt=""><div><b>Zuschnitt</b><small>Jahresring</small></div></div>
  <div class="proj"><b id="projName"></b><span id="projMeta"></span></div>
  <div class="total" id="total" aria-live="polite"></div>
  <button class="btn stockbtn" id="stockBtn" type="button">Lager</button>
  <button class="btn" id="closeBtn" type="button" hidden>Projekt schließen</button>
  <label class="btn primary" for="fileIn">Projekt öffnen</label>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>
<div id="confirmRow" class="confirm" hidden></div>

<nav class="tabs" id="tabs" role="tablist" aria-label="Platten"></nav>

<main id="work">
  <section class="stage">
    <div class="platebar"><div class="plateinfo" id="plateInfo"></div>
      <div class="plateacts"><label class="allow">Zugabe <input id="allowIn" type="number" inputmode="numeric" min="0" max="200" step="1"> mm</label><button class="btn lblst" id="lblStatus" hidden></button><span class="openct" id="listCount"></span><button class="btn" id="backBtn" hidden>Zurück auf Platte</button><button class="btn" id="allBtn">Platte fertig</button><button class="btn" id="resetBtn">Zurücksetzen</button></div></div>
    <div class="canvas" id="canvas"><svg class="plan" id="plan" role="img" aria-label="Plattenplan"></svg>
      <div class="zoomctl"><button id="zoomOut" aria-label="Verkleinern">−</button><button id="zoomIn" aria-label="Vergrößern">+</button><button id="zoomFit" class="fit" hidden>Ganze Platte</button></div></div>

    const xs = o.map((q) => +q[0]), ys = o.map((q) => +q[1]);

    const rect = o.length === 4 && o.every((q) => (Math.abs(q[0] - x0) < 0.5 || Math.abs(q[0] - x1) < 0.5) && (Math.abs(q[1] - y0) < 0.5 || Math.abs(q[1] - y1) < 0.5));
    return rect ? null : o;
  }
  function areaOf(t) {
    if (realOutline(t)) return polyArea(t.outline);
    const sh = shapeOf(t); return sh ? sh.area : +t.l * +t.w;
  }
  // Angezeigt wird immer das Rechteck, das zuerst zugeschnitten wird; die Schräge als Zusatz
  function dimOf(t) { return `${fmt(t.l)} × ${fmt(t.w)}`; }
  function hintOf(t) { const sh = shapeOf(t); return sh ? sh.hint : ""; }

  // Ältere Exporte: schräge Teile, deren Rahmen über die Platte ragt, standen unter "skipped".
  // Mit Zuschnittmaß um die Mitte legen und in die Platte schieben (Lage geschätzt).
  function adoptSkipped(p) {
    if (!Array.isArray(p.skipped)) return;
    const L = +p.length, W = +p.width;
    p.skipped = p.skipped.filter((s) => {
      if (!/ragt/.test(s.reason || "")) return true;
      let l = +s.l, w = +s.w;
      const c1 = parseFloat(s.cut1), c2 = parseFloat(s.cut2);
      const cx = +s.x + l / 2, cy = +s.y + w / 2;
      if (c1 > 0 && c2 > 0) {
        if (Math.abs(c2 - l) + Math.abs(c1 - w) < Math.abs(c1 - l) + Math.abs(c2 - w)) { l = c2; w = c1; } else { l = c1; w = c2; }
      }
      l = Math.min(l, L); w = Math.min(w, W);
      const x = Math.max(0, Math.min(cx - l / 2, L - l)), y = Math.max(0, Math.min(cy - w / 2, W - w));
      p.parts.push({ name: s.name, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, l, w, approx: true,
        material: p.material, diag: { edges: s.edges, cut1: s.cut1, cut2: s.cut2 } });
      return false;
    });
  }

  // ---------- Laden / Speichern ----------
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function jobIdFor(plan, fileName) {
    const base = (plan.project || fileName || "Auftrag").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "auftrag";
    return base + "-" + hashStr(JSON.stringify(plan.plates));
  }
  function validPlan(o) {
    return o && Array.isArray(o.plates) && o.plates.every((p) => p && +p.length > 0 && +p.width > 0 && (Array.isArray(p.parts) || (p.parts && typeof p.parts === "object")));
  }
  // Platten nach Material ordnen (Materialien in der Reihenfolge ihres ersten Auftretens)
  function sortPlates(plan) {
    const order = [];
    plan.plates.forEach((p) => { const m = p.material || ""; if (!order.includes(m)) order.push(m); });
    plan.plates = plan.plates.map((p, i) => [p, i])
      .sort((a, b) => order.indexOf(a[0].material || "") - order.indexOf(b[0].material || "") ||
        ((a[0].order != null ? a[0].order : a[1]) - (b[0].order != null ? b[0].order : b[1])))
      .map((x) => x[0]);
  }
  function normalize(plan, fileName) {
    plan.plates.forEach((p, i) => {
      if (!Array.isArray(p.parts)) p.parts = [];
      p.id = p.id || "P" + (i + 1);
      adoptSkipped(p);
      p.parts.forEach(fixRotated);
      // Material der Platte: Hat im CAD die Rohplatte ein anderes Material als alle Teile darauf
      // (z.B. kopierte Platte), gilt das Material der Teile.
      const mats = {};
      p.parts.forEach((t) => { if (t.material) mats[t.material] = (mats[t.material] || 0) + 1; });
      const top = Object.keys(mats).sort((a, b) => mats[b] - mats[a])[0];
      if (top && !mats[p.material]) { p.plateMaterial = p.material; p.material = top; }
      p.parts.forEach((t, k) => { t.id = t.id || p.id + "-" + (k + 1); });
      p.parts = partsOf(p).map((t) => Object.assign({}, t));
    });
    plan.plates.forEach((p, i) => { if (p.order == null) p.order = i; });
    sortPlates(plan);
    // feste Plattennummer, bleibt auch, wenn Platten auf Reste verlegt werden
    plan.plates.forEach((p, i) => { if (p.no == null && !p.isRest) p.no = i + 1; });
    plan.project = plan.project || fileName.replace(/\.json$/i, "");
    plan.importedAt = new Date().toISOString();
    return plan;
  }

  function saveProgress() {
    if (isSample()) return;
    const ok = LS.set("zs.progress." + state.jobId, { done: state.done, updated: new Date().toISOString(), project: state.plan.project });
    if (!ok) toast("Speicher voll: Bearbeitungsstand konnte nicht gesichert werden.", false);
  }

  async function importFiles(files) {
    const f = files[0];
    let plan;
    try { plan = JSON.parse(await f.text()); } catch (e) { plan = null; }
    if (!validPlan(plan)) { toast(f.name + " ist kein Zuschnittplan. Bitte die JSON aus dem CAD-Plugin öffnen.", false); return; }
    normalize(plan, f.name);
    const id = jobIdFor(plan, f.name);
    const stored = LS.get("zs.progress." + id, null);
    state.plan = plan; state.jobId = id;
    state.done = stored && stored.done ? stored.done : {};
    state.plateIdx = -1; state.undo = null;
    LS.set("zs.current", { id, plan });
    persistSel();
    render();
    const n = Object.keys(state.done).length;
    toast(n ? `${plan.project}: ${n} erledigte Teile wiederhergestellt` : `Projekt geöffnet: ${plan.project}`, false);
  }

  function persistSel() { LS.set("zs.plate", state.plateIdx); }

  function loadLocal() {
    const cur = LS.get("zs.current", null);
    if (cur && validPlan(cur.plan)) {
      state.plan = cur.plan; state.jobId = cur.id; sortPlates(state.plan);
      state.plan.plates.forEach((p) => (p.parts || []).forEach(fixRotated));
      state.plan.plates.forEach((p, i) => { if (p.no == null && !p.isRest) p.no = i + 1; });
      const stored = LS.get("zs.progress." + cur.id, null);
      state.done = stored && stored.done ? stored.done : {};
    }
  }

  // ---------- Darstellung ----------
  function render() {
    const plan = currentPlan(), ps = plates();
    if (state.plateIdx >= ps.length || state.plateIdx < -2) state.plateIdx = -1;

    // Projektkopf
    $("projName").textContent = isSample() ? "Zuschnitt" : (plan.project || "Projekt");
    $("projMeta").textContent = isSample() ? "Kein Projekt geöffnet"
      : (plan.exported ? "Export aus dem CAD " + plan.exported : "Zuschnittplan");

    // Gesamtfortschritt
    const dm = doneMap();
    let all = 0, dn = 0;
    ps.forEach((p) => partsOf(p).forEach((t) => { all++; if (dm[t.id]) dn++; }));
    $("total").innerHTML = `${dn}<span> / ${all} Teile</span>`;

    // Reiter: zuerst die Übersicht, dann die Platten
    const st = computeStats();
    const multiMat = new Set(ps.map((p) => p.material || "")).size > 1;
    $("tabs").innerHTML = `<button class="tab ov" role="tab" aria-selected="${state.plateIdx === -1}" data-i="-1">
        <b>Projektübersicht</b><i>Ausbeute ${pct(st.total.yield)}</i></button>` + ps.map((p, i) => {
      const n = partsOf(p).length, d = partsOf(p).filter((t) => dm[t.id]).length;
      return `<button class="tab${n && d === n ? " complete" : ""}" role="tab" aria-selected="${i === state.plateIdx}" data-i="${i}">
        <b>${esc(plateTitle(p, i))}</b>${multiMat ? `<i class="mat">${esc(p.material || "ohne Material")}</i>` : ""}<i>${n && d === n ? "fertig" : d + " / " + n}</i></button>`;
    }).join("");

    const sv = state.plateIdx === -2, start = isSample() && !sv;
    const ov = state.plateIdx === -1 && !start;
    $("startView").hidden = !start;
    $("tabs").hidden = isSample();
    $("total").hidden = isSample();
    $("closeBtn").hidden = isSample();
    $("stockBtn").innerHTML = `Lager${stockLoaded ? ` <small>${restItems().length} Reste${stockDirty ? " · ungespeichert" : ""}</small>` : ""}`;
    $("stockBtn").classList.toggle("active", sv);
    $("stockBtn").classList.toggle("dirtyb", stockDirty);
    $("work").hidden = ov || sv || start;
    $("overview").hidden = !ov;
    $("stockView").hidden = !sv;
    if (start) return;
    if (ov) { renderOverview(st); return; }
    if (sv) { renderStock(); return; }

    const p = ps[state.plateIdx];
    if (!p) { $("plan").innerHTML = ""; $("plateInfo").textContent = "Der Plan enthält keine Platten."; return; }

    $("plateInfo").innerHTML =
      (isSample() ? '<span class="badge">Beispiel</span>' : "") +
      `<span><strong>${fmt(p.length)} × ${fmt(p.width)}</strong> mm${p.thickness ? " · " + fmt(p.thickness) + " mm" : ""}</span>` +
      (p.material ? `<span>${esc(p.material)}</span>` : "") +
      `<span>Antippen = erledigt, doppelt tippen = wieder offen</span>`;
    $("planLegend").innerHTML = (state.allow ? "<b>großes Maß</b> = Zuschnitt mit Zugabe · (Klammer) = Fertigmaß · " : "") + "gestrichelt = Reststück";

    drawPlan(p, dm);
    renderLabelStatus();
    $("backBtn").hidden = !p.isRest || !!stock.bookings[bookingKey(p)];
    drawList(p, dm);
  }

  // ---------- Zoom und Verschieben im Plan (zwei Finger oder Tasten) ----------
  const view = { k: 1, cx: 0, cy: 0, plate: null, rot: null, base: null };
  function applyView() {
    const b = view.base; if (!b) return;
    const w = b.w / view.k, h = b.h / view.k;
    view.cx = Math.min(Math.max(view.cx, b.x + w / 2), b.x + b.w - w / 2);
    view.cy = Math.min(Math.max(view.cy, b.y + h / 2), b.y + b.h - h / 2);
    $("plan").setAttribute("viewBox", `${view.cx - w / 2} ${view.cy - h / 2} ${w} ${h}`);
    $("zoomFit").hidden = view.k <= 1.001;
    $("zoomOut").disabled = view.k <= 1.001;
  }
  function toPlate(clientX, clientY) {
    const svg = $("plan"), m = svg.getScreenCTM();
    if (!m) return { x: view.cx, y: view.cy };
    const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    const r = pt.matrixTransform(m.inverse());
    return { x: r.x, y: r.y };
  }
  let redrawTimer = null;
  function zoomTo(k, ax, ay) {
    const k2 = Math.min(Math.max(k, 1), 8);
    if (ax != null) {
      // Punkt unter den Fingern bleibt an seiner Stelle
      view.cx = ax + (view.cx - ax) * (view.k / k2);
      view.cy = ay + (view.cy - ay) * (view.k / k2);
    }
    view.k = k2;
    applyView();
    clearTimeout(redrawTimer);
    redrawTimer = setTimeout(() => render(), 180);   // Beschriftung für die neue Größe neu setzen
  }
  const pointers = new Map();
  let gesture = null, suppressClick = false;
  $("plan").addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const mid = toPlate((a.x + b.x) / 2, (a.y + b.y) / 2);
      gesture = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: view.k, mid };
      suppressClick = true;
    } else if (pointers.size === 1) {
      gesture = { type: "pan", x0: e.clientX, y0: e.clientY, cx0: view.cx, cy0: view.cy, moved: false };
    }
  });
  $("plan").addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId) || !gesture) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture.type === "pinch" && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const k = gesture.k0 * d / gesture.d0;
      const k2 = Math.min(Math.max(k, 1), 8);
      view.cx = gesture.mid.x + (view.cx - gesture.mid.x) * (view.k / k2);
      view.cy = gesture.mid.y + (view.cy - gesture.mid.y) * (view.k / k2);
      view.k = k2; applyView();
    } else if (gesture.type === "pan" && view.k > 1.001) {
      const dx = e.clientX - gesture.x0, dy = e.clientY - gesture.y0;
      if (!gesture.moved && Math.hypot(dx, dy) < 12) return;
      gesture.moved = true; suppressClick = true;
      const scale = view.base.w / view.k / Math.max(1, $("plan").getBoundingClientRect().width);
      const s2 = Math.max(scale, view.base.h / view.k / Math.max(1, $("plan").getBoundingClientRect().height));
      view.cx = gesture.cx0 - dx * s2; view.cy = gesture.cy0 - dy * s2; applyView();
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      const wasGesture = gesture && (gesture.type === "pinch" || gesture.moved);
      gesture = null;
      if (wasGesture) { clearTimeout(redrawTimer); redrawTimer = setTimeout(() => render(), 60); }
      setTimeout(() => { suppressClick = false; }, 80);
    } else if (pointers.size === 1 && gesture && gesture.type === "pinch") {
      const [a] = [...pointers.values()];
      gesture = { type: "pan", x0: a.x, y0: a.y, cx0: view.cx, cy0: view.cy, moved: true };
    }
  }
  $("plan").addEventListener("pointerup", endPointer);
  $("plan").addEventListener("pointercancel", endPointer);
  $("plan").addEventListener("wheel", (e) => {
    e.preventDefault();
    const pt = toPlate(e.clientX, e.clientY);
    zoomTo(view.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15), pt.x, pt.y);
  }, { passive: false });
  $("zoomIn").addEventListener("click", () => zoomTo(view.k * 1.6, view.cx, view.cy));
  $("zoomOut").addEventListener("click", () => zoomTo(view.k / 1.6, view.cx, view.cy));
  $("zoomFit").addEventListener("click", () => zoomTo(1));

  function drawPlan(p, dm) {
    const svg = $("plan"), box = $("canvas").getBoundingClientRect();
    const L = +p.length, W = +p.width;
    // Längere Plattenseite entlang der längeren Bildschirmseite
    const rot = (box.height > box.width) !== (W > L);
    const VW = rot ? W : L, VH = rot ? L : W;
    const pad = Math.max(VW, VH) * 0.01;
    view.base = { x: -pad, y: -pad, w: VW + 2 * pad, h: VH + 2 * pad, bw: box.width, bh: box.height };
    if (view.plate !== state.plateIdx || view.rot !== rot) { view.plate = state.plateIdx; view.rot = rot; view.k = 1; view.cx = VW / 2; view.cy = VH / 2; }
    applyView();
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    // CAD: y nach oben. Bildschirm: y nach unten.
    const map = (t) => {
      const x = +t.x, y = +t.y, l = +t.l, w = +t.w;
      if (!rot) return { x, y: W - y - w, w: l, h: w };
      return { x: W - y - w, y: L - x - l, w: w, h: l };
    };
    const mapPt = (q) => rot ? [W - +q[1], L - +q[0]] : [+q[0], W - +q[1]];
    const unitPx = (Math.min(box.width / (VW + 2 * pad), box.height / (VH + 2 * pad)) || 0.1) * view.k;
    // Grundschrift nach Bildschirmgröße: Handy ca. 12 px, Tablet ca. 15–17 px
    const basePx = Math.round(Math.min(17, Math.max(12, Math.min(box.width, box.height) / 34)));

    let out = `<rect class="plate-rect" x="0" y="0" width="${VW}" height="${VH}"/>`;
    // Größte freie Reststücke gestrichelt mit Maß (liegen unter den Teilen)
    freeRects(p, partsOf(p)).forEach((f) => {
      const r = map(f), wPx = r.w * unitPx, hPx = r.h * unitPx, fs = Math.max(11, basePx * 0.9);
      const txt = `Rest ${fmt(Math.round(f.l))} × ${fmt(Math.round(f.w))}`;
      const quer = wPx >= txt.length * 0.6 * fs + 10 && hPx >= fs * 1.6, hoch = !quer && hPx >= txt.length * 0.6 * fs + 10 && wPx >= fs * 1.6;
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2, ein = 3 / unitPx;
      out += `<g class="rest"><rect x="${r.x + ein}" y="${r.y + ein}" width="${Math.max(0, r.w - 2 * ein)}" height="${Math.max(0, r.h - 2 * ein)}" stroke-width="${1.3 / unitPx}" stroke-dasharray="${7 / unitPx} ${5 / unitPx}"/>` +
        (quer || hoch ? `<text x="${cx}" y="${cy}" font-size="${fs / unitPx}"${hoch ? ` transform="rotate(-90 ${cx} ${cy})"` : ""}>${txt}</text>` : "") + `</g>`;
    });
    partsOf(p).forEach((t) => {
      const r = map(t), done = !!dm[t.id];
      const minSide = Math.min(r.w, r.h), vertical = r.h > r.w * 1.6 && r.w * unitPx < 70;
      const along = vertical ? r.h : r.w, across = vertical ? r.w : r.h;
      // Groß: Zuschnittmaß (Fertigmaß plus Zugabe), klein darunter in Klammern: Fertigmaß
      const z = state.allow;
      const dimTxt = z ? `${fmt(+t.l + z)} × ${fmt(+t.w + z)}` : dimOf(t);
      const finTxt = z ? `(${dimOf(t)})` : "";
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      const tr = vertical ? ` transform="rotate(-90 ${cx} ${cy})"` : "";

      // Einheitliche Schriftgrößen auf dem Bildschirm (px), für alle Teile gleich.
      // Passt eine Zeile nicht, fällt sie weg, statt kleiner zu werden.
      const px = (v) => v / unitPx;                 // Bildschirm-px -> Plattenmaß
      const alongPx = along * unitPx, acrossPx = across * unitPx;
      const rcPx = basePx * 1.05;
      const showCircle = t.pos && !realOutline(t) && Math.min(r.w, r.h) * unitPx >= rcPx * 2.7 && alongPx >= rcPx * 5;
      let circle = "";
      if (showCircle) {
        const rc = px(rcPx), ccx = r.x + px(rcPx + 5), ccy = r.y + px(rcPx + 5);
        const pl = String(t.pos).length, fsc = px(basePx * (pl > 3 ? Math.min(0.78, 1.8 / (pl * 0.58)) : pl > 2 ? 0.78 : 0.95));
        circle = `<circle class="posc" cx="${ccx}" cy="${ccy}" r="${rc}" stroke-width="${px(1.4)}"/>` +
                 `<text class="posn" x="${ccx}" y="${ccy}" font-size="${fsc}">${esc(t.pos)}</text>`;
      }
      const grp = assembly(t);
      const nm = (!showCircle && t.pos ? t.pos + " · " : "") + (t.name || "");
      const short = (!showCircle && t.pos ? t.pos + " · " : "") + dimTxt;
      const roomPx = showCircle ? alongPx - 2 * (rcPx * 2 + 8) : alongPx - 8;
      const circleH = showCircle ? rcPx * 2 + 10 : 0;
      // Liefert die Verschiebung des Textblocks (px) oder null, wenn er nicht passt
      const place = (lines) => {
        const h = lines.reduce((s2, ln) => s2 + ln[2] * 1.22, 0);
        const wMax = Math.max(...lines.map((ln) => String(ln[0]).length * 0.58 * ln[2]));
        if (h > acrossPx * 0.92 || wMax > alongPx - 8) return null;
        if (!showCircle || (acrossPx - h) / 2 >= circleH) return 0;             // mittig, frei vom Kreis
        if (acrossPx - circleH - 4 >= h) return (circleH - (acrossPx - h) / 2) / 2 + 2; // etwas nach unten
        if (wMax <= roomPx) return 0;                                           // mittig, seitlich am Kreis vorbei
        return null;
      };
      const hint = hintOf(t);
      const small = Math.max(10, basePx * 0.8);
      const options = [
        [[grp, "grp", basePx * 0.8], [nm, "nm", basePx], [dimTxt, "dim", basePx], [finTxt, "grp", small], [hint, "grp", small]],
        [[nm, "nm", basePx], [dimTxt, "dim", basePx], [finTxt, "grp", small], [hint, "grp", small]],
        [[grp, "grp", basePx * 0.8], [nm, "nm", basePx], [dimTxt, "dim", basePx], [finTxt, "grp", small]],
        [[nm, "nm", basePx], [dimTxt, "dim", basePx], [finTxt, "grp", small]],
        [[nm, "nm", basePx], [dimTxt, "dim", basePx]],
        [[short, "dim", basePx]],
        [[nm, "nm", basePx], [dimTxt, "dim", Math.max(10, basePx * 0.75)]],
        [[short, "dim", Math.max(10, basePx * 0.75)]],
        [[nm, "nm", Math.max(10, basePx * 0.8)]],
        // Positionsnummer bleibt immer sichtbar, notfalls allein und kleiner
        ...(showCircle || !t.pos ? [] : [
          [[String(t.pos), "dim", basePx]],
          [[String(t.pos), "dim", Math.max(6, Math.min(basePx, acrossPx * 0.8 / 1.22, (alongPx - 4) / (String(t.pos).length * 0.58)))]],
        ]),
      ].map((o) => o.filter((ln) => ln[0]));
      let txt = "";
      for (const lines of options) {
        if (!lines.length) continue;
        const off = place(lines);
        if (off == null) continue;
        const total = lines.reduce((s2, ln) => s2 + ln[2] * 1.22, 0);
        let yPx = -total / 2 + off;
        txt = lines.map((ln) => {
          const h = ln[2] * 1.22, yy = cy + px(yPx + h / 2); yPx += h;
          return `<text class="${ln[1]}" x="${cx}" y="${yy}" font-size="${px(ln[2])}"${tr}>${esc(ln[0])}</text>`;
        }).join("");
        break;
      }
      if (!txt && t.pos && !showCircle) {
        // Sehr schmale Leiste: Nummer trotzdem zeigen, notfalls etwas über den Rand hinaus
        const fs = Math.max(7, Math.min(basePx, (alongPx - 2) / (String(t.pos).length * 0.58)));
        txt = `<text class="dim" x="${cx}" y="${cy}" font-size="${px(fs)}"${tr}>${esc(t.pos)}</text>`;
      }
      txt += circle;
      const sw = Math.max(1.5, 1.2 / unitPx);
      // Schräge Teile mit echter Kontur als Vieleck, darunter ein unsichtbares Rechteck zum Antippen
      const hasOutline = !!realOutline(t);
      const shapeSvg = hasOutline
        ? `<rect class="hit" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/><polygon points="${t.outline.map((q) => mapPt(q).join(",")).join(" ")}" stroke-width="${sw}"/>`
        : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" stroke-width="${sw}"/>`;
      // Feines Kreuz von Ecke zu Ecke
      const xw = 2.2 / unitPx;
      const cross = done ? `<line class="x" x1="${r.x}" y1="${r.y}" x2="${r.x + r.w}" y2="${r.y + r.h}" stroke-width="${xw}"/>` +
        `<line class="x" x1="${r.x + r.w}" y1="${r.y}" x2="${r.x}" y2="${r.y + r.h}" stroke-width="${xw}"/>` : "";
      out += `<g class="part${done ? " done" : ""}${t.approx ? " approx" : ""}" data-id="${esc(t.id)}" role="button" aria-pressed="${done}" aria-label="${esc((label(t) || "Teil") + " " + dimTxt)}">` +
        shapeSvg + `${txt}${cross}</g>`;
    });
    svg.innerHTML = out;
  }

  // Baugruppe wie im CAD-Etikett: die oberste Gruppe (z.B. "Schrank2")
  // Automatische Namen (gr_266) und Hilfsgruppen (Fachboden_gr) überspringen
  const autoName = (n) => !n || /^gr_\d+$/i.test(n) || /_gr$/i.test(n);
  function assembly(t) {
    if (t.assembly) return t.assembly;
    let chain = Array.isArray(t.groups) ? t.groups.slice() : [];
    if (!chain.length && t.grouppath) chain = String(t.grouppath).split(/[\\/|>]+/).map((x) => x.trim());
    if (!chain.length) chain = [t.topgroup, t.group];
    const real = chain.filter((n) => !autoName(n));
    return real.length ? real[0] : "";
  }
  function groupLine(t) { return assembly(t); }
  function label(t) { return (t.pos ? t.pos + " · " : "") + (t.name || ""); }

  function drawList(p, dm) {
    const open = partsOf(p).filter((t) => !dm[t.id]).length;
    $("listCount").textContent = open ? open + " offen" : "alle erledigt";
  }



  // ---------- Übersicht: Ausnutzung und Verschnitt ----------
  const f2 = (n) => (isFinite(n) ? n : 0).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = (n) => (isFinite(n) ? n * 100 : 0).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
  const eur = (n) => (isFinite(n) ? n : 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  const mm = (n) => Math.round(n).toLocaleString("de-DE");

  function matKey(p) { return [p.material || "ohne Material", +p.thickness || 0, +p.length, +p.width].join("|"); }
  function matLabel(m) { return (m.material || "ohne Material") + (m.thickness ? " · " + fmt(m.thickness) + " mm" : ""); }

  // Die größten freien Rechtecke einer Platte (höchstens drei, nicht überlappend): für die Beschriftung der Reststücke.
  // Je Paar senkrechter Kanten die freien Höhenabschnitte suchen, dann die größten Flächen nehmen.
  function freeRects(p, ts, max = 3, minSide = 150, minArea = 0.12e6) {
    const L = +p.length, W = +p.width, e = 0.5;
    if (!ts.length || ts.length > 220) return [];
    const b = ts.map((t) => ({ x1: +t.x, x2: +t.x + +t.l, y1: +t.y, y2: +t.y + +t.w }));
    const xs = [...new Set([0, L, ...b.flatMap((r) => [Math.max(0, r.x1), Math.min(L, r.x2)])].map((v) => Math.round(v)))].sort((a, c) => a - c);
    const cand = [];
    for (let i = 0; i < xs.length; i++) for (let j = i + 1; j < xs.length; j++) {
      const x1 = xs[i], x2 = xs[j];
      if (x2 - x1 < minSide) continue;
      const iv = b.filter((r) => r.x1 < x2 - e && r.x2 > x1 + e).map((r) => [r.y1, r.y2]).sort((a, c) => a[0] - c[0]);
      let y = 0;
      for (const [a1, a2] of [...iv, [W, W]]) {
        if (a1 - y >= minSide && (x2 - x1) * (a1 - y) >= minArea) cand.push({ x: x1, y, l: x2 - x1, w: a1 - y });
        y = Math.max(y, a2);
      }
    }
    cand.sort((a, c) => c.l * c.w - a.l * a.w);
    const out = [];
    for (const c of cand) {
      if (out.length >= max) break;
      const frei = out.every((o) => { const ox = Math.min(o.x + o.l, c.x + c.l) - Math.max(o.x, c.x), oy = Math.min(o.y + o.w, c.y + c.w) - Math.max(o.y, c.y); return ox <= 1 || oy <= 1; });
      if (frei) out.push(c);
    }
    return out;
  }

  // Größter freier Streifen am Plattenrand (über die volle Länge oder Breite)
  function restStrip(p, ts) {
    const L = +p.length, W = +p.width;
    if (!ts.length) return { l: L, w: W };
    const maxX = Math.max(...ts.map((t) => +t.x + +t.l));
    const maxY = Math.max(...ts.map((t) => +t.y + +t.w));
    const a = { l: Math.max(0, L - maxX), w: W }, b = { l: L, w: Math.max(0, W - maxY) };
    return a.l * a.w >= b.l * b.w ? a : b;
  }

  function computeStats() {
    const ps = plates();
    const mats = new Map(), asms = new Map();
    const rows = ps.map((p, i) => {
      const ts = partsOf(p);
      const area = (+p.length * +p.width) / 1e6;
      const cut = ts.reduce((s2, t) => s2 + areaOf(t) / 1e6, 0);
      const key = matKey(p);
      if (!mats.has(key)) mats.set(key, { key, material: p.material, thickness: p.thickness, length: +p.length, width: +p.width, count: 0, area: 0, cut: 0, parts: 0 });
      const m = mats.get(key);
      m.count++; m.area += area; m.cut += cut; m.parts += ts.length;
      return { i, p, ts, area, cut, yield: area ? cut / area : 0, key, rest: restStrip(p, ts) };
    });
    mats.forEach((m) => {
      m.yield = m.area ? m.cut / m.area : 0; m.waste = m.area - m.cut; m.factor = m.cut ? m.area / m.cut : 0;
      const price = +state.prices[m.key];
      m.price = price > 0 ? price : null;
      m.cost = m.price ? m.price * m.area : null;          // EK für alle Platten
      m.vk = m.price ? m.price * m.factor : null;          // Preis je m² Fertigteil inkl. Verschnitt
    });
    // Baugruppen: Zuschnitt plus anteilige Plattenfläche (Verschnitt nach Zuschnittanteil verteilt)
    rows.forEach((r) => {
      const m = mats.get(r.key);
      r.ts.forEach((t) => {
        const name = assembly(t) || "ohne Baugruppe";
        if (!asms.has(name)) asms.set(name, { name, parts: 0, cut: 0, share: 0, cost: 0, costKnown: true });
        const a = asms.get(name), c = areaOf(t) / 1e6;
        a.parts++; a.cut += c; a.share += c * m.factor;
        if (m.cost != null && m.cut) a.cost += m.cost * (c / m.cut); else a.costKnown = false;
      });
    });
    const total = { count: rows.length, area: 0, cut: 0, parts: 0, cost: 0, costKnown: mats.size > 0 };
    mats.forEach((m) => { total.area += m.area; total.cut += m.cut; total.parts += m.parts; if (m.cost != null) total.cost += m.cost; else total.costKnown = false; });
    total.yield = total.area ? total.cut / total.area : 0;
    total.waste = total.area - total.cut;
    total.factor = total.cut ? total.area / total.cut : 0;
    const asmList = [...asms.values()].sort((a, b) => a.name.localeCompare(b.name, "de", { numeric: true }));
    return { rows, mats: [...mats.values()], asms: asmList, total };
  }

  function renderOverview(st) {
    const plan = currentPlan(), T = st.total;
    const multiMat = st.mats.length > 1;
    const realAsm = st.asms.filter((a) => a.name !== "ohne Baugruppe").length;
    const matRows = st.mats.map((m) => `<tr>
        <td>${esc(m.material || "ohne Material")}<br><span class="note">${m.thickness ? fmt(m.thickness) + " mm · " : ""}${mm(m.length)} × ${mm(m.width)}</span></td>
        <td class="r">${m.count}</td><td class="r">${f2(m.area)}</td><td class="r">${f2(m.cut)}</td>
        <td class="r">${f2(m.waste)}</td><td class="r">${pct(1 - m.yield)}</td><td class="r">${f2(m.factor)}</td>
        <td class="r"><input class="price" type="text" inputmode="decimal" autocomplete="off" id="price-${esc(hashStr(m.key))}" data-key="${esc(m.key)}" value="${m.price != null ? m.price.toFixed(2).replace(".", ",") : ""}" placeholder="€/m²" aria-label="Einkaufspreis je m² ${esc(matLabel(m))}"></td>
        <td class="r vk">${m.vk != null ? eur(m.vk) : "–"}</td>
        <td class="r">${m.cost != null ? eur(m.cost) : "–"}</td></tr>`).join("");
    const matFoot = multiMat ? `<tfoot><tr><td>Gesamt</td><td class="r">${T.count}</td><td class="r">${f2(T.area)}</td><td class="r">${f2(T.cut)}</td>
        <td class="r">${f2(T.waste)}</td><td class="r">${pct(1 - T.yield)}</td><td class="r">${f2(T.factor)}</td>
        <td></td><td></td><td class="r">${T.costKnown ? eur(T.cost) : "–"}</td></tr></tfoot>` : "";
    const asmRows = st.asms.map((a) => `<tr><td>${esc(a.name)}</td><td class="r">${a.parts}</td><td class="r">${f2(a.cut)}</td>
        <td class="r">${pct(T.cut ? a.cut / T.cut : 0)}</td><td class="r">${f2(a.share)}</td>
        <td class="r">${a.costKnown && T.costKnown ? eur(a.cost) : "–"}</td></tr>`).join("");
    const plateRows = st.rows.map((r) => {
      const low = r.yield < 0.35, mid = !low && r.yield < 0.6;   // grau = wenig genutzt (z. B. Restplatte), gelb = mittel, grün = gut
      const rest = r.rest.l * r.rest.w >= 0.1e6 && Math.min(r.rest.l, r.rest.w) >= 200 ? `${mm(r.rest.l)} × ${mm(r.rest.w)}` : "–";
      return `<tr class="link" data-i="${r.i}" tabindex="0" aria-label="${esc(plateTitle(r.p, r.i))} öffnen">
        <td>${esc(plateTitle(r.p, r.i))}</td>${multiMat ? `<td>${esc(matLabel(r.p))}</td>` : ""}<td class="r">${r.ts.length}</td>
        <td class="r">${f2(r.cut)}</td>
        <td><span class="ubar${low ? " low" : mid ? " mid" : ""}"><span style="width:${Math.min(100, r.yield * 100).toFixed(1)}%"></span></span><span class="pct">${pct(r.yield)}</span></td>
        <td class="r">${f2(r.area - r.cut)}</td><td class="r">${rest}</td></tr>`;
    }).join("");

    $("overview").innerHTML = `<div class="ov-wrap">
      <div class="ov-head">
        <div><h1>${esc(plan.project || "Auftrag")}</h1>
          <div class="meta">${isSample() ? '<span class="badge">Beispiel</span> ' : ""}Verschnittberechnung${plan.exported ? " · Export aus dem CAD " + esc(plan.exported) : ""} · Stand ${new Date().toLocaleDateString("de-DE")}</div></div>
        <div class="ov-actions"><button class="btn" id="pdfBtn">PDF herunterladen</button><button class="btn" id="csvBtn">CSV</button></div>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="t">Platten</span><span class="v">${T.count}</span><span class="s">${T.parts} Teile</span></div>
        <div class="kpi"><span class="t">Plattenfläche</span><span class="v">${f2(T.area)}</span><span class="s">m² berechnet</span></div>
        <div class="kpi"><span class="t">Zuschnitt</span><span class="v">${f2(T.cut)}</span><span class="s">m² Fertigteile</span></div>
        <div class="kpi"><span class="t">Ausbeute</span><span class="v">${pct(T.yield)}</span><span class="s">Zuschnitt / Platte</span></div>
        <div class="kpi key"><span class="t">Verschnitt</span><span class="v">${pct(1 - T.yield)}</span><span class="s">${f2(T.waste)} m²</span></div>
        <div class="kpi"><span class="t">Verschnittfaktor</span><span class="v">${f2(T.factor)}</span><span class="s">m² Platte je m² Zuschnitt</span></div>
      </div>

      <section class="ov-sec"><h2>Nach Material</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Material</th><th class="r">Platten</th><th class="r">Platte m²</th><th class="r">Zuschnitt m²</th>
          <th class="r">Verschnitt m²</th><th class="r">Verschnitt</th><th class="r">Faktor</th>
          <th class="r">EK € je m²</th><th class="r">VK € je m² Teil</th><th class="r">Material EK €</th></tr></thead>
          <tbody>${matRows}</tbody>${matFoot}</table></div>
        <p class="note">Einkaufspreis je m² Platte eintragen. Der VK je m² Teil ist EK mal Verschnittfaktor und enthält den Verschnitt aller berechneten Platten. Mit diesem Preis je m² Fertigteil abgerechnet, sind alle Platten bezahlt. Der EK wird je Material gespeichert und gilt auch für spätere Aufträge.</p>
      </section>

      ${realAsm ? `<section class="ov-sec"><h2>Nach Baugruppe</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Baugruppe</th><th class="r">Teile</th><th class="r">Zuschnitt m²</th><th class="r">Anteil</th>
          <th class="r">Platte anteilig m²</th><th class="r">Material EK € anteilig</th></tr></thead><tbody>${asmRows}</tbody></table></div>
        <p class="note">Der Verschnitt wird nach Zuschnittfläche auf die Baugruppen verteilt. Die anteiligen Flächen ergeben zusammen wieder die gesamte Plattenfläche.</p>
      </section>` : ""}

      <section class="ov-sec"><h2>Platten</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Platte</th>${multiMat ? "<th>Material</th>" : ""}<th class="r">Teile</th><th class="r">Zuschnitt m²</th>
          <th>Ausnutzung</th><th class="r">Verschnitt m²</th><th class="r">Reststreifen mm</th></tr></thead><tbody>${plateRows}</tbody></table></div>
        <p class="note">Reststreifen ist der größte freie Streifen am Plattenrand über die volle Länge oder Breite. Der Balken ist grau unter 35 % Ausnutzung, gelb bis 60 % und grün darüber. Antippen öffnet den Schnittplan.</p>
      </section>
      ${stockOverviewHtml(st)}
      ${restSuggestHtml()}
      ${labelSettingsHtml()}
    </div>`;
  }

  // Preise je Material
  $("overview").addEventListener("change", (e) => {
    const inp = e.target.closest("input.price");
    if (!inp) return;
    const v = parseFloat(String(inp.value).replace(",", "."));
    if (v > 0) state.prices[inp.dataset.key] = Math.round(v * 100) / 100; else delete state.prices[inp.dataset.key];
    LS.set("zs.ek", state.prices);
    render();
  });
  $("overview").addEventListener("click", (e) => {
    if (e.target.closest("#pdfBtn")) { exportPdf(); return; }
    if (e.target.closest("#csvBtn")) { exportCsv(); return; }
    const tr = e.target.closest("tr.link");
    if (tr) { state.plateIdx = +tr.dataset.i; persistSel(); render(); }
  });
  $("overview").addEventListener("keydown", (e) => {
    const tr = e.target.closest("tr.link");
    if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.plateIdx = +tr.dataset.i; persistSel(); render(); }
  });

  // ---------- Export ----------
  function fileBase() { return "Verschnitt_" + String(currentPlan().project || "Auftrag").replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_"); }
  async function offerFile(filename, blob) {
    // Eigenständige HTML-Datei: normaler Browser-Download
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function exportCsv() {
    const st = computeStats(), T = st.total, n2 = (x) => f2(x), q = (x) => '"' + String(x ?? "").replace(/"/g, '""') + '"';
    const lines = [
      ["Verschnittberechnung", currentPlan().project || ""], ["Stand", new Date().toLocaleDateString("de-DE")], [],
      ["Material", "Stärke mm", "Format mm", "Platten", "Plattenfläche m²", "Zuschnitt m²", "Ausbeute %", "Verschnitt m²", "Verschnitt %", "Faktor", "EK € je m²", "VK € je m² Teil", "Material EK €"],
      ...st.mats.map((m) => [m.material || "", fmt(m.thickness || 0), mm(m.length) + " x " + mm(m.width), m.count, n2(m.area), n2(m.cut), n2(m.yield * 100), n2(m.waste), n2((1 - m.yield) * 100), n2(m.factor), m.price != null ? n2(m.price) : "", m.vk != null ? n2(m.vk) : "", m.cost != null ? n2(m.cost) : ""]),
      ["Gesamt", "", "", T.count, n2(T.area), n2(T.cut), n2(T.yield * 100), n2(T.waste), n2((1 - T.yield) * 100), n2(T.factor), "", "", T.costKnown ? n2(T.cost) : ""], [],
      ["Baugruppe", "Teile", "Zuschnitt m²", "Anteil %", "Platte anteilig m²", "Material € anteilig"],
      ...st.asms.map((a) => [a.name, a.parts, n2(a.cut), n2(T.cut ? a.cut / T.cut * 100 : 0), n2(a.share), a.costKnown && T.costKnown ? n2(a.cost) : ""]), [],
      ["Platte", "Material", "Teile", "Zuschnitt m²", "Ausnutzung %", "Verschnitt m²"],
      ...st.rows.map((r) => [plateTitle(r.p, r.i), r.p.material || "", r.ts.length, n2(r.cut), n2(r.yield * 100), n2(r.area - r.cut)]),
    ];
    const csv = "﻿" + lines.map((l) => l.map(q).join(";")).join("\r\n");
    offerFile(fileBase() + ".csv", new Blob([csv], { type: "text/csv" }));
  }

  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf);
    return new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = JSPDF_SRC;
      sc.onload = () => (window.jspdf ? res(window.jspdf) : rej(new Error("jsPDF fehlt")));
      sc.onerror = () => rej(new Error("PDF-Baustein konnte nicht geladen werden. Für den PDF-Export wird Internet benötigt."));
      document.head.appendChild(sc);
    });
  }

  // Logo als PNG für das PDF (aus dem SVG im Kopf gerendert)
  function logoPng() {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        try {
          const w = 1400, h = Math.round(w * (img.naturalHeight || 692) / (img.naturalWidth || 3021));
          const c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          res({ url: c.toDataURL("image/png"), w, h });
        } catch (e) { res(null); }
      };
      img.onerror = () => res(null);
      if (!$("logo").getAttribute("src")) return res(null);
      img.src = $("logo").src;
    });
  }

  async function exportPdf() {
    // Die PDF-Standardschrift kennt kein hochgestelltes ², deshalb "qm"
    const f2 = (n) => (isFinite(n) ? n : 0).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    let lib;
    try { lib = await loadJsPdf(); } catch (e) { toast(e.message, false); return; }
    const st = computeStats(), T = st.total, plan = currentPlan();
    const doc = new lib.jsPDF({ unit: "mm", format: "a4" });
    const X = 14, W = 182; let y = 18;
    const need = (h) => { if (y + h > 282) { doc.addPage(); y = 18; } };
    const table = (cols, rows, foot) => {
      // cols: [title, width, align]
      const head = () => {
        doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); let x = X;
        cols.forEach(([t, w, al]) => { doc.text(t, al === "r" ? x + w - 1 : x + 1, y, { align: al === "r" ? "right" : "left" }); x += w; });
        y += 2; doc.setLineWidth(0.3); doc.line(X, y, X + W, y); y += 4.5;
      };
      need(14); head();
      const line = (cells, bold) => {
        need(6); doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(9); let x = X;
        cells.forEach((c, k) => { const [, w, al] = cols[k]; const txt = doc.splitTextToSize(String(c), w - 2)[0] || ""; doc.text(txt, al === "r" ? x + w - 1 : x + 1, y, { align: al === "r" ? "right" : "left" }); x += w; });
        y += 5.2;
      };
      rows.forEach((r) => line(r));
      if (foot) { doc.setLineWidth(0.4); doc.line(X, y - 3.6, X + W, y - 3.6); y += 0.6; line(foot, true); }
      y += 4;
    };

    // Logo oben rechts
    const logo = await logoPng();
    if (logo) { const lw = 62, lh = lw * logo.h / logo.w; doc.addImage(logo.url, "PNG", X + W - lw, 10, lw, lh); }
    doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.text("Verschnittberechnung", X, y); y += 7;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5);
    doc.text(`Auftrag: ${plan.project || "-"}`, X, y); y += 5.5;
    doc.text(`Datum: ${new Date().toLocaleDateString("de-DE")}`, X, y); y += 10;

    // Kennzahlen
    const k = [["Platten", String(T.count)], ["Plattenfläche", f2(T.area) + " qm"], ["Zuschnitt", f2(T.cut) + " qm"], ["Ausbeute", pct(T.yield)], ["Verschnitt", pct(1 - T.yield) + " / " + f2(T.waste) + " qm"], ["Verschnittfaktor", f2(T.factor)]];
    const cw = W / 3;
    k.forEach(([t, v], i) => {
      const cx = X + (i % 3) * cw, cy = y + Math.floor(i / 3) * 14;
      doc.setFontSize(8); doc.setTextColor(110); doc.text(t.toUpperCase(), cx, cy); doc.setTextColor(0);
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(v, cx, cy + 6); doc.setFont("helvetica", "normal");
    });
    y += 30;

    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text("Nach Material", X, y); y += 6;

  // ---------- Aktionen ----------
  let toastTimer = null;

  function setDone(ids, val, label) {
    const dm = doneMap();

  // ================= Etikettendruck =================
  // Etikett 70 × 74 mm wie aus dem CAD. Drucken über den Android-Druckdialog
  // oder direkt per Bluetooth LE auf einen Zebra-Drucker (ZPL, 203 dpi).
  // Die Etiketten sind auf 70 × 74 mm gezeichnet (ENTWURF). Für andere Etikettengrößen wird die Zeichnung als Ganzes
  // passend verkleinert/vergrößert und mittig gesetzt; die Größe ist je Gerät einstellbar (Übersicht › Etikettendruck).
  const ENTWURF = { w: 70, h: 74 };
  const lblMass = (v, std) => { const n = Math.round(parseFloat(String(v).replace(",", ".")) * 10) / 10; return n >= 20 && n <= 210 ? n : std; };
  // Größe aus Jahresring (Einstellungen › Werkstatt & Material › Etikettengröße), einheitlich für alle Geräte
  const LBL_EIN = (window.JAHRESRING && window.JAHRESRING.etikett) || {};
  const LBL = { w: lblMass(LBL_EIN.w || 70, 70), h: lblMass(LBL_EIN.h || 74, 74), dpmm: 8 };            // 203 dpi = 8 Punkte je mm
  const lblFaktor = () => Math.min(LBL.w / ENTWURF.w, LBL.h / ENTWURF.h);
  function lblSeite() {             // Seitengröße für den Druckdialog an die Etikettengröße anpassen
    let st = document.getElementById("lblPageCss");
    if (!st) { st = document.createElement("style"); st.id = "lblPageCss"; document.head.appendChild(st); }
    st.textContent = `@media print { @page { size: ${LBL.w}mm ${LBL.h}mm; margin: 0; } #printArea .lblpage, #printArea svg { width: ${LBL.w}mm; height: ${LBL.h}mm; } }`;
  }
  lblSeite();
  const ZEBRA_SVC = "38eb4a80-c570-11e3-9507-0002a5d5c51b";
  const ZEBRA_WRITE = "38eb4a82-c570-11e3-9507-0002a5d5c51b";
  const lblState = { restMode: LS.get("zs.restLabel", "dialog"), mode: LS.get("zs.label", "off"), device: null, ch: null, busy: Promise.resolve(), logo: null };

  function orderInfo() {
    const plan = currentPlan();
    const hdr = Array.isArray(plan.header) ? plan.header : [];
    const find = (re) => { const h = hdr.find((x) => re.test(x.name || "")); return h ? h.value : ""; };
    let nr = find(/auftrag|order|kommission/i), name = find(/projekt|project|bezeichnung/i);
    const m = String(plan.project || "").match(/^(\d{2,4}-\d{2,5})[_\s-]*(.*?)(\s+-\s+.*)?$/);
    if (!nr && m) nr = m[1];
    if (!name) name = m ? m[2] : (plan.project || "");
    return { nr, name };
  }

  function bandingText(t) {
    const b = t.banding;
    if (!b || !(b.L1 || b.L2 || b.S1 || b.S2)) return "";
    const groups = {};
    [["L1", "lang"], ["L2", "lang"], ["S1", "kurz"], ["S2", "kurz"]].forEach(([k, side]) => {
      if (!b[k]) return;
      const key = side + "|" + b[k];
      groups[key] = (groups[key] || 0) + 1;
    });
    return Object.keys(groups).map((k) => { const [side, mat] = k.split("|"); return `${groups[k]}× ${side} ${mat}`; }).join(" · ");
  }

  // Schriftgröße so wählen, dass der Text in die Breite passt (grobe Zeichenbreite)
  const fitFs = (txt, fs, maxW) => Math.min(fs, maxW / Math.max(1, String(txt).length * 0.55));

  async function logoData() {
    if (lblState.logo) return lblState.logo;
    const src = $("logo").getAttribute("src") ? $("logo").src : "";
    if (!src) return (lblState.logo = "");
    if (src.startsWith("data:")) return (lblState.logo = src);
    try {
      const r = await fetch(src);
      if (!r.ok || !(r.headers.get("content-type") || "").startsWith("image/")) throw new Error("kein Logo");
      const b = await r.blob();
      lblState.logo = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
    } catch (e) { lblState.logo = ""; }
    return lblState.logo;
  }

  function qrSvg(text, x, y, size) {
    if (typeof qrcode !== "function" || !text) return "";
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(), c = size / n;
    let d = "";
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) d += `M${(x + k * c).toFixed(3)} ${(y + r * c).toFixed(3)}h${c.toFixed(3)}v${c.toFixed(3)}h-${c.toFixed(3)}z`;
    return `<path d="${d}" fill="#000"/>`;
  }

  // Kantenbelag je Kante der Skizze bestimmen.
  // Bevorzugt die Lage aus dem CAD (vorne/rechts/hinten/links, Teil flach auf der Platte),
  // sonst lange/kurze Kanten (L1/L2/S1/S2).
  function edgeBands(t, pts) {
    const b = t.banding || {};
    const n = pts.length;
    // Umlaufsinn (CAD-Koordinaten, y nach oben)
    let area = 0;
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
    const ccw = area > 0;
    const hasDir = b.front || b.right || b.back || b.left;
    const lens = pts.map((p, i) => Math.hypot(pts[(i + 1) % n][0] - p[0], pts[(i + 1) % n][1] - p[1]));
    const res = pts.map((p, i) => {
      const q = pts[(i + 1) % n], dx = q[0] - p[0], dy = q[1] - p[1];
      const nx = ccw ? dy : -dy, ny = ccw ? -dx : dx;   // Normale nach außen
      const side = Math.abs(nx) > Math.abs(ny) ? (nx > 0 ? "right" : "left") : (ny > 0 ? "back" : "front");
      return { side, len: lens[i], mat: hasDir ? b[side] || "" : "" };
    });
    if (!hasDir && (b.L1 || b.L2 || b.S1 || b.S2)) {
      // Die zwei längsten Kanten sind L1/L2, die übrigen S1/S2
      const order = res.map((r, i) => i).sort((i, j) => res[j].len - res[i].len);
      const longs = order.slice(0, 2).sort((i, j) => i - j), shorts = order.slice(2).sort((i, j) => i - j);
      if (longs[0] != null) res[longs[0]].mat = b.L1 || "";
      if (longs[1] != null) res[longs[1]].mat = b.L2 || "";
      if (shorts[0] != null) res[shorts[0]].mat = b.S1 || "";
      if (shorts[1] != null) res[shorts[1]].mat = b.S2 || "";
    }
    return res;
  }

  // Skizze des Teils (echte Kontur oder Rechteck) in ein Feld einpassen, Kanten wie bei CAD:
  // belegte Kante doppelt gezeichnet, Kantenmaterial außen daneben
  function sketchSvg(t, bx, by, bw, bh) {
    const o = realOutline(t);
    const pts = o ? o.map((q) => [+q[0] - +t.x, +q[1] - +t.y]) : [[0, 0], [+t.l, 0], [+t.l, +t.w], [0, +t.w]];
    const bands = edgeBands(t, pts);
    const any = bands.some((e) => e.mat);
    const pad = any ? 2.6 : 0;
    bx += pad; by += pad; bw -= 2 * pad; bh -= 2 * pad;
    const L = +t.l || 1, W = +t.w || 1;
    const k = Math.min(bw / L, bh / W);
    const ox = bx + (bw - L * k) / 2, oy = by + (bh - W * k) / 2;
    const P = pts.map((q) => [ox + q[0] * k, oy + (W - q[1]) * k]);   // Etikett: y nach unten
    let cx = 0, cy = 0; P.forEach((q) => { cx += q[0]; cy += q[1]; }); cx /= P.length; cy /= P.length;
    let out = `<polygon points="${P.map((q) => q[0].toFixed(2) + "," + q[1].toFixed(2)).join(" ")}" fill="none" stroke="#000" stroke-width="0.4" stroke-linejoin="round"/>`;
    bands.forEach((e, i) => {
      if (!e.mat) return;
      const a = P[i], c = P[(i + 1) % P.length];
      const dx = c[0] - a[0], dy = c[1] - a[1], len = Math.hypot(dx, dy) || 1;
      let nx = -dy / len, ny = dx / len;
      const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
      if ((mx + nx - cx) ** 2 + (my + ny - cy) ** 2 < (mx - cx) ** 2 + (my - cy) ** 2) { nx = -nx; ny = -ny; } // nach außen
      const off = 0.75;
      out += `<line x1="${(a[0] + nx * off).toFixed(2)}" y1="${(a[1] + ny * off).toFixed(2)}" x2="${(c[0] + nx * off).toFixed(2)}" y2="${(c[1] + ny * off).toFixed(2)}" stroke="#000" stroke-width="0.55"/>`;
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
      const fs = Math.min(1.7, len / Math.max(1, e.mat.length * 0.6));
      const tx = mx + nx * 1.9, ty = my + ny * 1.9;
      out += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fs.toFixed(2)}" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${esc(e.mat)}</text>`;
    });
    return out;
  }

  async function labelSvg(t, plate) {
    const W = ENTWURF.w, H = ENTWURF.h, F = "Arial, Helvetica, sans-serif";
    const info = orderInfo(), asm = assembly(t) || "", logo = await logoData();
    const title = `${asm ? asm + ": " : ""}${t.name || "Teil"} (${dimOf(t)})`;
    const sub = `${fmt(+(plate && plate.thickness) || 0)} mm ${t.material || ""}`.trim();
    const z = state.allow, cut = z ? `Zuschnitt ${fmt(+t.l + z)} × ${fmt(+t.w + z)}` : "";
    const band = bandingText(t), hint = hintOf(t);
    const pos = t.pos ? String(t.pos) : "";
    const T = (x, y, fs, txt, extra = "") => txt ? `<text x="${x}" y="${y}" font-size="${fs.toFixed(2)}" font-family="${F}" ${extra}>${esc(txt)}</text>` : "";
    const lines = [cut, hint, band ? "Kanten: " + band : ""].filter(Boolean);
    return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${LBL.w}mm" height="${LBL.h}mm" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <rect width="${W}" height="${H}" fill="#fff"/>
      ${T(3, 6.2, fitFs("Gruppe: " + asm, 2.8, 36), asm ? "Gruppe: " + asm : "")}
      ${logo ? `<image href="${logo}" xlink:href="${logo}" x="40" y="2.2" width="27" height="6.2" preserveAspectRatio="xMaxYMid meet"/>` : ""}
      ${T(3, 15, fitFs("Auftrag: " + info.nr, 5.2, 64), info.nr ? "Auftrag: " + info.nr : "", 'font-weight="600"')}
      ${T(3, 19.8, fitFs("Projekt: " + info.name, 3.6, 64), info.name ? "Projekt: " + info.name : "")}
      ${sketchSvg(t, 4, 23, 62, 19)}
      ${pos ? `<circle cx="8" cy="49.5" r="3.6" fill="none" stroke="#000" stroke-width="0.35"/>` + T(8, 50.6, fitFs(pos, 3.2, 5.6), pos, 'text-anchor="middle"') : ""}
      <line x1="${pos ? 11.6 : 3}" y1="50.4" x2="67" y2="50.4" stroke="#000" stroke-width="0.25"/>
      ${T(pos ? 12.5 : 3, 49.4, fitFs(title, 2.7, pos ? 54 : 63), title)}
      ${T(pos ? 12.5 : 3, 53.2, fitFs(sub, 2.2, 54), sub)}
      ${lines.map((ln, i) => T(3, 60 + i * 4, fitFs(ln, 2.9, 46), ln)).join("")}
      ${qrSvg(info.nr || currentPlan().project || "", 53, 57.5, 14)}
    </svg>`;
  }

  // ---------- Druckdialog ----------
  async function printDialog(t, plate) { return printSvgDialog(await labelSvg(t, plate)); }
  // Mehrere Etiketten als ein Druckauftrag mit je einer Seite pro Etikett.
  // (Zwei Druckaufrufe kurz hintereinander zeigen auf Android beide Male das letzte Etikett.)
  async function printSvgDialog(svg) {
    const list = Array.isArray(svg) ? svg : [svg];
    let area = $("printArea");
    if (!area) { area = document.createElement("div"); area.id = "printArea"; document.body.appendChild(area); }

    await new Promise((r) => setTimeout(r, 60));
