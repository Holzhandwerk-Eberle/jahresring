  // ---------- Zebra über Bluetooth LE ----------
  function crc16(str) {               // CRC-16-CCITT (XModem) für Z64
    let c = 0;
    for (let i = 0; i < str.length; i++) {
      c ^= str.charCodeAt(i) << 8;
      for (let b = 0; b < 8; b++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
    }
    return c.toString(16).toUpperCase().padStart(4, "0");
  }
  async function svgToBits(svg) {
    const wd = Math.round(LBL.w * LBL.dpmm), ht = Math.round(LBL.h * LBL.dpmm);
    const img = new Image();
    const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("Etikett konnte nicht gezeichnet werden")); img.src = url; });
    const c = document.createElement("canvas"); c.width = wd; c.height = ht;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, wd, ht); g.drawImage(img, 0, 0, wd, ht);
    const px = g.getImageData(0, 0, wd, ht).data, rowBytes = Math.ceil(wd / 8);
    const bits = new Uint8Array(rowBytes * ht);
    for (let y = 0; y < ht; y++) for (let x = 0; x < wd; x++) {
      const i = (y * wd + x) * 4, lum = 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2];
      if (lum < 200) bits[y * rowBytes + (x >> 3)] |= 0x80 >> (x & 7);
    }
    return { bits, rowBytes, wd, ht };
  }
  async function zplFor(t, plate) { return zplForSvg(await labelSvg(t, plate)); }
  async function zplForSvg(svg) {
    const { bits, rowBytes, wd, ht } = await svgToBits(svg);
    let data;
    if (typeof CompressionStream === "function") {
      const z = new Uint8Array(await new Response(new Blob([bits]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
      let bin = ""; for (let i = 0; i < z.length; i++) bin += String.fromCharCode(z[i]);
      const b64 = btoa(bin);
      data = `:Z64:${b64}:${crc16(b64)}`;
    } else {
      data = Array.from(bits, (b) => b.toString(16).toUpperCase().padStart(2, "0")).join("");
    }
    return `^XA^PW${wd}^LL${ht}^LH0,0^FO0,0^GFA,${bits.length},${bits.length},${rowBytes},${data}^FS^PQ1^XZ`;
  }
  async function zebraConnect(ask) {
    if (!navigator.bluetooth) throw new Error("Dieser Browser kann kein Bluetooth. Bitte Chrome auf dem Tablet verwenden.");
    if (!lblState.device || ask) {
      lblState.device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [ZEBRA_SVC] });
      lblState.device.addEventListener("gattserverdisconnected", () => { lblState.ch = null; renderLabelStatus(); });
    }
    if (!lblState.ch) {
      const srv = await lblState.device.gatt.connect();
      const svc = await srv.getPrimaryService(ZEBRA_SVC);
      lblState.ch = await svc.getCharacteristic(ZEBRA_WRITE);
    }
    renderLabelStatus();
    return lblState.ch;
  }
  async function zebraSend(text) {
    const ch = await zebraConnect(false);
    const bytes = new TextEncoder().encode(text);
    for (let i = 0; i < bytes.length; i += 160) {
      const part = bytes.slice(i, i + 160);
      if (ch.writeValueWithResponse) await ch.writeValueWithResponse(part); else await ch.writeValue(part);
    }
  }

  function printLabel(t, plate) {
    if (lblState.mode === "dialog") { printDialog(t, plate).catch((e) => toast(e.message, false)); return; }
    if (lblState.mode !== "zebra") return;
    // Etiketten nacheinander senden, auch wenn schnell hintereinander getippt wird
    lblState.busy = lblState.busy.then(async () => {
      try { await zebraSend(await zplFor(t, plate)); }
      catch (e) { toast("Etikett nicht gedruckt: " + (e.message || e), false); }
    });
  }

  function renderLabelStatus() {
    const el = $("lblStatus");
    if (!el) return;
    if (lblState.mode === "zebra" || lblState.restMode === "zebra") {
      el.hidden = false;
      el.textContent = lblState.ch ? "Drucker verbunden" : "Drucker verbinden";
      el.classList.toggle("ok", !!lblState.ch);
    } else el.hidden = true;
  }
  document.addEventListener("click", async (e) => {
    if (e.target.closest("#lblStatus") || e.target.closest(".lblConnect")) {
      try { await zebraConnect(!lblState.ch); toast("Drucker verbunden", false); render(); }
      catch (err) { if (err && err.name !== "NotFoundError") toast("Keine Verbindung: " + (err.message || err), false); }
    }
    if (e.target.closest("#lblTest")) {
      const p = plates()[Math.max(0, state.plateIdx)];
      const t = p && partsOf(p)[0];
      if (!t) { toast("Kein Teil für den Testdruck vorhanden", false); return; }
      if (lblState.mode === "zebra") printLabel(t, p); else await printDialog(t, p);
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "lblMode") { lblState.mode = e.target.value; LS.set("zs.label", lblState.mode); renderLabelStatus(); render(); }
    if (e.target.classList && e.target.classList.contains("lblRestMode")) { lblState.restMode = e.target.value; LS.set("zs.restLabel", lblState.restMode); render(); }
  });
  function labelSettingsHtml() {
    const o = (v, t) => `<option value="${v}"${lblState.mode === v ? " selected" : ""}>${t}</option>`;
    return `<section class="ov-sec"><h2>Etikettendruck</h2>
      <div class="lblset"><label>Beim Abhaken <select id="lblMode">${o("off", "kein Etikett")}${o("dialog", "Etikett über Druckdialog")}${o("zebra", "Etikett direkt auf Zebra (Bluetooth)")}</select></label>
      ${lblState.mode === "zebra" ? `<button class="btn lblConnect">${lblState.ch ? "Anderen Drucker wählen" : "Drucker verbinden"}</button>` : ""}
      <button class="btn" id="lblTest">Testetikett</button></div>
      <div class="lblset"><label>Restetiketten <select class="lblRestMode">${["dialog", "zebra"].map((v) => `<option value="${v}"${lblState.restMode === v ? " selected" : ""}>${v === "zebra" ? "direkt auf Zebra (Bluetooth)" : "über Druckdialog (normaler Drucker)"}</option>`).join("")}</select></label>
      ${lblState.restMode === "zebra" && lblState.mode !== "zebra" ? `<button class="btn lblConnect">${lblState.ch ? "Anderen Drucker wählen" : "Drucker verbinden"}</button>` : ""}</div>
      <div class="lblset"><span>Etikettengröße ${String(LBL.w).replace(".", ",")} × ${String(LBL.h).replace(".", ",")} mm</span><span class="note" style="margin:0">einstellbar in Jahresring unter Einstellungen › Werkstatt &amp; Material</span></div>
      <p class="note">Im Druckdialog die gleiche Papiergröße wählen, am Zebra-Drucker muss das eingelegte Etikett dazu passen. Teileetiketten werden beim Abhaken gedruckt, nicht beim Zurücknehmen. Restetiketten beim Einlagern oder über „Etikett“ im Lager. Die Einstellungen gelten nur für dieses Gerät.</p></section>`;
  }

  // ================= Lager: Bestand und Restplatten =================
  // Ohne Jahresring im Hintergrund liegt das Lager in einer Datei (Lager_Jahresring.json). Die App arbeitet mit einer Kopie
  // auf dem Gerät und schreibt sie beim Speichern zurück: am PC direkt in die Datei, auf dem Tablet über "Teilen" oder als Download.
  const STOCK_FILE = "Lager_Jahresring.json";
  const stockState = { handle: null, fileName: LS.get("zs.stockName", null) };
  // Dateizugriff (am PC) über Neustarts hinweg merken: der Datei-Handle liegt in IndexedDB
  const idb = (mode, fn) => new Promise((res) => {
    try {
      const rq = indexedDB.open("zuschnitt", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onsuccess = () => { try { const tx = rq.result.transaction("kv", mode); const r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(null); } catch (e) { res(null); } };
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const rememberHandle = (h) => { stockState.handle = h; if (h) { stockState.fileName = h.name; LS.set("zs.stockName", h.name); } return idb("readwrite", (st) => h ? st.put(h, "stockHandle") : st.delete("stockHandle")); };
  idb("readonly", (st) => st.get("stockHandle")).then((h) => { if (h && !stockState.handle) { stockState.handle = h; render(); } });
  async function writable(h) {
    try {
      if (h.queryPermission && (await h.queryPermission({ mode: "readwrite" })) === "granted") return true;
      if (h.requestPermission && (await h.requestPermission({ mode: "readwrite" })) === "granted") return true;
    } catch (e) {}
    return false;
  }
  function emptyStock() {
    return { format: "jahresring-lager", version: 1, rev: 0, updated: null, nextRest: 1, items: [], bookings: {}, reservations: {}, orders: {}, log: [] };
  }
  let stock = (() => {
    const s = LS.get("zs.stock", null);
    return s && s.format === "jahresring-lager" ? Object.assign(emptyStock(), s) : emptyStock();
  })();
  let stockDirty = LS.get("zs.stockDirty", false);
  let stockLoaded = LS.get("zs.stockLoaded", false);   // wurde schon einmal eine Lagerdatei geöffnet oder angelegt?

  const mkey = (material, thickness, length, width) => [material || "ohne Material", +thickness || 0, +length, +width].join("|");
  const same = (a, b, tol = 2) => Math.abs(+a - +b) <= tol;
  // Erstes Maß = Faserrichtung, deshalb nicht gedreht vergleichen
  const sameSize = (l1, w1, l2, w2) => same(l1, l2) && same(w1, w2);
  const today = () => new Date().toLocaleDateString("de-DE");

  // In Jahresring: das Lager liegt in der Büro-Datenbank, gespeichert wird automatisch
  const BUERO = window.JAHRESRING || null;
  document.getElementById("logo").addEventListener("error", e => e.target.removeAttribute("src"));
  if (BUERO && BUERO.logo) document.getElementById("logo").src = "/api/logo";   // Firmenlogo aus Jahresring für PDF und Etiketten
  let bueroTimer = null;
  async function bueroLaden(meldung) {
    try {
      const r = await fetch(BUERO.api + "reste/lagerdatei", { credentials: "same-origin" });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).fehler || ("HTTP " + r.status));
      const d = await r.json();
      stock = Object.assign(emptyStock(), d.lager || {}); stock.serverRev = d.rev;
      stockDirty = false; stockLoaded = true; stockState.fileName = "Jahresring";
      LS.set("zs.stock", stock); LS.set("zs.stockDirty", false); LS.set("zs.stockLoaded", true);
      if (meldung) toast(`Lager geladen: ${restItems().length} Reste, ${fullItems().reduce((s, i) => s + i.qty, 0)} Platten`, false);
      render();
    } catch (e) { toast("Lager aus dem Büro nicht ladbar: " + (e.message || e), false); }
  }
  async function bueroSpeichern(leise, erzwingen) {
    clearTimeout(bueroTimer);
    try {
      stock.savedAt = new Date().toISOString();
      const r = await fetch(BUERO.api + "reste/lagerdatei", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lager: stock, basis: erzwingen ? null : (stock.serverRev ?? null) }) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 409) {
        if (confirm("Das Lager wurde inzwischen an einem anderen Gerät oder im Büro geändert.\n\nOK = den aktuellen Stand aus dem Büro laden (die letzte Änderung hier geht verloren)\nAbbrechen = den eigenen Stand trotzdem speichern")) return bueroLaden(true);
        return bueroSpeichern(leise, true);
      }
      if (!r.ok) throw new Error(d.fehler || ("HTTP " + r.status));
      stock.serverRev = d.rev; stockDirty = false;
      LS.set("zs.stock", stock); LS.set("zs.stockDirty", false);
      if (!leise) toast("Lager im Büro gespeichert", false);
      render();
    } catch (e) { toast("Lager nicht gespeichert (Büro nicht erreichbar?) – wird später erneut versucht", false); }
  }

  function stockChanged(msg) {
    stock.rev = (stock.rev || 0) + 1;
    stock.updated = new Date().toISOString();
    if (msg) { stock.log.unshift({ t: stock.updated, msg }); stock.log = stock.log.slice(0, 200); }
    stockDirty = true; stockLoaded = true;
    LS.set("zs.stock", stock); LS.set("zs.stockDirty", true); LS.set("zs.stockLoaded", true);
    if (BUERO) { clearTimeout(bueroTimer); bueroTimer = setTimeout(() => bueroSpeichern(true), 700); }
  }

  // ---------- Abfragen ----------
  const fullItems = () => stock.items.filter((i) => i.kind === "platte");
  const restItems = () => stock.items.filter((i) => i.kind === "rest" && !i.used);
  function fullItemFor(p) {
    return fullItems().find((i) => (i.material || "") === (p.material || "") && same(i.thickness || 0, p.thickness || 0, 0.6) &&
      sameSize(i.length, i.width, p.length, p.width));
  }
  function restItemFor(p) {
    return restItems().find((i) => (i.material || "") === (p.material || "") && same(i.thickness || 0, p.thickness || 0, 0.6) &&
      sameSize(i.length, i.width, p.length, p.width));
  }
  function reservedCount(key) {
    let n = 0;
    Object.values(stock.reservations || {}).forEach((r) => { n += +(r.mats && r.mats[key]) || 0; });
    return n;
  }
  function itemReserved(i) { return reservedCount(mkey(i.material, i.thickness, i.length, i.width)); }

  // ---------- Buchen beim Fertigstellen einer Platte ----------
  function bookingKey(p) { return state.jobId + "|" + p.id; }
  function bookPlate(p, idx, interactive) {
    const key = bookingKey(p);
    if (stock.bookings[key]) return;
    const proj = currentPlan().project || "";
    const rest = p.fromRest ? stock.items.find((i) => i.id === p.fromRest && !i.used) : restItemFor(p);
    let entry = { plate: p.id, project: proj, date: new Date().toISOString() };
    if (currentPlan().bueroAuftrag) entry.auftrag = currentPlan().bueroAuftrag;   // Büro bucht Lagerabgang + Auftragskosten
    let msg;
    if (rest) {
      rest.used = new Date().toISOString(); rest.usedFor = proj;
      entry.rest = rest.id;
      msg = `Rest ${rest.no} verbraucht (${proj}, ${plateTitle(p, idx)})`;
    } else {
      const it = fullItemFor(p);
      if (it && it.qty > 0) {
        it.qty -= 1; entry.item = it.id;
        const r = stock.reservations[state.jobId], k = mkey(p.material, p.thickness, p.length, p.width);
        if (r && r.mats && r.mats[k] > 0) { r.mats[k] -= 1; entry.reserved = true; }
        msg = `1 Platte ${p.material || ""} aus dem Bestand (${proj}, ${plateTitle(p, idx)})`;
      } else {
        msg = `${plateTitle(p, idx)} fertig, ${p.material || "Material"} ist nicht im Lager`;
      }
    }
    stock.bookings[key] = entry;
    stockChanged(msg);
    if (interactive && stockLoaded) {
      toast(msg, false);
      openRestDialog(p, idx);
    }
  }
  function unbookPlate(p) {
    const key = bookingKey(p), b = stock.bookings[key];
    if (!b) return;
    if (b.rest) { const r = stock.items.find((i) => i.id === b.rest); if (r) { delete r.used; delete r.usedFor; } }
    if (b.item) {
      const it = stock.items.find((i) => i.id === b.item);
      if (it) it.qty += 1;
      if (b.reserved) {
        const r = stock.reservations[state.jobId], k = mkey(p.material, p.thickness, p.length, p.width);
        if (r && r.mats) r.mats[k] = (r.mats[k] || 0) + 1;
      }
    }
    delete stock.bookings[key];
    stockChanged(`Buchung zurückgenommen (${b.project}, ${p.id})`);
  }
  // Nach jeder Änderung am Bearbeitungsstand: fertige Platten buchen, wieder geöffnete zurücknehmen
  function stockReconcile(interactive) {
    if (isSample() || !stockLoaded) return;
    plates().forEach((p, i) => {
      const ts = partsOf(p);
      const complete = ts.length > 0 && ts.every((t) => state.done[t.id]);
      const booked = !!stock.bookings[bookingKey(p)];
      if (complete && !booked) bookPlate(p, i, interactive);
      else if (!complete && booked) unbookPlate(p);
    });
  }

  // ---------- Reservieren ----------
  function setReservation(key, on, need) {
    const id = state.jobId;
    if (!stock.reservations[id]) stock.reservations[id] = { project: currentPlan().project || "", mats: {} };
    const r = stock.reservations[id];
    if (currentPlan().bueroAuftrag) { r.auftrag = currentPlan().bueroAuftrag; r.nr = currentPlan().bueroNr || ""; }
    // reserviert werden die noch offenen Platten dieses Materials
    if (on) r.mats[key] = openNeed(key); else delete r.mats[key];
    if (!Object.keys(r.mats).length) delete stock.reservations[id];
    const [mat] = key.split("|");
    stockChanged(on ? `${r.mats[key] || 0} Platten ${mat} reserviert für ${currentPlan().project || ""}` : `Reservierung ${mat} aufgehoben`);
  }
  // Offene (noch nicht fertig gebuchte) Platten dieses Projekts je Material und Format
  function openNeed(key) {
    return plates().filter((q) => !q.isRest && mkey(q.material, q.thickness, q.length, q.width) === key && !stock.bookings[bookingKey(q)]).length;
  }
  function doneCount(key) {
    return plates().filter((q) => !q.isRest && mkey(q.material, q.thickness, q.length, q.width) === key && stock.bookings[bookingKey(q)]).length;
  }
  // Reservierung dieses Auftrags immer an die offenen Platten anpassen (z.B. nach "Auf Rest schneiden" oder neuem Export)
  function syncReservations() {
    if (isSample() || !stockLoaded) return;
    const r = stock.reservations[state.jobId];
    if (!r) return;
    let changed = false;
    Object.keys(r.mats).forEach((k) => { const n = openNeed(k); if (r.mats[k] !== n) { r.mats[k] = n; changed = true; } });
    if (changed) stockChanged();
  }
  function stockOverviewHtml(st) {
    if (isSample()) return "";
    syncReservations();
    const restKeys = new Set(plates().filter((q) => q.isRest).map((q) => mkey(q.material, q.thickness, q.length, q.width)));
    const fullKeys = new Set(plates().filter((q) => !q.isRest).map((q) => mkey(q.material, q.thickness, q.length, q.width)));
    const rows = st.mats.filter((m) => !restKeys.has(m.key) || fullKeys.has(m.key)).map((m) => {
      const it = fullItems().find((i) => mkey(i.material, i.thickness, i.length, i.width) === m.key);
      const have = it ? it.qty : 0, resAll = reservedCount(m.key);
      const need = openNeed(m.key), done = doneCount(m.key);
      const isRes = !!(stock.reservations[state.jobId] && m.key in stock.reservations[state.jobId].mats);
      // ohne eigene Reservierung zählt der eigene Bedarf zusätzlich zu den Reservierungen anderer
      const balance = have - resAll - (isRes ? 0 : need);
      const stateTxt = String(balance);
      return `<tr><td>${esc(matLabel(m))}<br><span class="note">${mm(m.length)} × ${mm(m.width)}</span></td>
        <td class="r">${need}${done ? `<br><span class="note">${done} fertig</span>` : ""}</td><td class="r">${have}</td><td class="r">${resAll}</td>
        <td class="r${balance < 0 ? " warn" : ""}">${stateTxt}</td>
        <td><label class="cbx"><input type="checkbox" class="resv" data-key="${esc(m.key)}" data-need="${need}"${isRes ? " checked" : ""}${stockLoaded ? "" : " disabled"}> reservieren${isRes ? ` (${need})` : ""}</label></td></tr>`;
    }).join("");
    return `<section class="ov-sec"><h2>Lager</h2>
      ${stockLoaded ? "" : `<p class="note">Noch keine Lagerdatei geöffnet. Oben über „Lager“ die Lagerdatei öffnen oder ein neues Lager anlegen.</p>`}
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Material</th><th class="r">Benötigt</th><th class="r">Im Lager</th><th class="r">Reserviert gesamt</th><th class="r">Frei</th><th>Für diesen Auftrag</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">Reservierte Platten werden beim Fertigstellen einer Platte aus dem Bestand genommen. Liegt ein passender Rest im Lager (gleiches Material und Maß), wird stattdessen der Rest ausgebucht.</p></section>`;
  }


  // ---------- Abgleich mit dem Restelager ----------
  // Einfaches Regalverfahren: Teile (Zuschnittmaß + Sägeschnitt) in Reihen auf den Rest legen, Drehen erlaubt.
  const KERF = 4;
  // Liefert die passenden Teile; placed.xy enthält die Lage (x, y in mm, CAD-Richtung) auf dem Rest
  function packInto(rest, parts) {
    const L = +rest.length, W = +rest.width, z = state.allow || 0;
    const items = parts.map((t) => ({ t, a: +t.l + z, b: +t.w + z })).sort((x, y) => y.b - x.b || y.a - x.a);
    const shelves = [], placed = [];
    placed.xy = new Map();
    let yUsed = 0;
    for (const it of items) {
      const sh = shelves.find((s2) => it.b <= s2.h && s2.x + it.a <= L);
      if (sh) { placed.xy.set(it.t, { x: sh.x + z / 2, y: sh.y + z / 2 }); sh.x += it.a + KERF; placed.push(it.t); continue; }
      if (it.a <= L && yUsed + it.b <= W) {
        shelves.push({ y: yUsed, h: it.b, x: it.a + KERF });
        placed.xy.set(it.t, { x: z / 2, y: yUsed + z / 2 }); yUsed += it.b + KERF; placed.push(it.t);
      }
    }
    return placed;
  }
  // Vorschläge: zuerst Platten, die ganz aus Resten geschnitten werden können (spart eine Platte),
  // danach Teilvorschläge. Jeder Rest wird nur einmal vorgeschlagen, bevorzugt für Platten mit wenigen Teilen.
  function restSuggestions() {
    if (!stockLoaded || isSample()) return [];
    const z = state.allow || 0, out = [], used = new Set();
    const inPlan = new Set(plates().filter((q) => q.fromRest).map((q) => q.fromRest));
    const open = plates().map((p, i) => ({ p, i, ts: partsOf(p).filter((t) => !state.done[t.id]) }))
      .filter((o) => !o.p.isRest && o.ts.length && !stock.bookings[bookingKey(o.p)])
      .sort((a, b) => a.ts.length - b.ts.length);
    const candsFor = (p) => restItems().filter((r) => !used.has(r.id) && !inPlan.has(r.id) && (r.material || "") === (p.material || "") && same(r.thickness || 0, p.thickness || 0, 0.6)
      && !(r.reservedFor && r.reservedFor.job !== state.jobId) && r.length * r.width < p.length * p.width * 0.98)
      .sort((a, b) => a.length * a.width - b.length * b.width);
    const tryPlate = (o) => {
      let left = o.ts.slice(); const uses = [];
      for (const r of candsFor(o.p)) {
        const fit = packInto(r, left);
        if (!fit.length) continue;
        uses.push({ rest: r, parts: fit.slice(), area: fit.reduce((s2, t) => s2 + (+t.l + z) * (+t.w + z), 0) });
        left = left.filter((t) => !fit.includes(t));
        if (!left.length) break;
      }
      return { uses, left };
    };
    // 1. ganze Platten
    open.forEach((o) => {
      const { uses, left } = tryPlate(o);
      if (uses.length && !left.length) { uses.forEach((u) => used.add(u.rest.id)); out.push({ p: o.p, i: o.i, full: true, uses, left }); o.done = true; }
    });
    // 2. Teilvorschläge, jeder Rest nur einmal
    open.filter((o) => !o.done).forEach((o) => {
      const { uses, left } = tryPlate(o);
      if (!uses.length) return;
      uses.forEach((u) => used.add(u.rest.id));
      out.push({ p: o.p, i: o.i, full: false, uses, left });
    });
    return out.sort((a, b) => (b.full - a.full) || a.i - b.i);
  }
  function restSuggestHtml() {
    const sug = restSuggestions();
    if (!stockLoaded || isSample()) return "";
    if (!sug.length) return `<section class="ov-sec"><h2>Reste verwenden</h2><p class="note">Im Restelager passt kein Rest zu den offenen Teilen dieses Projekts (gleiches Material, gleiche Stärke, Zuschnittmaß mit ${state.allow || 0} mm Zugabe).</p></section>`;
    const lbl = (t) => `${t.pos ? t.pos + " " : ""}${esc(t.name || "Teil")}`;
    const rows = sug.map((g) => `<div class="sug${g.full ? " full" : ""}">
        <div class="sugh"><b>${esc(plateTitle(g.p, g.i))}</b> · ${esc(g.p.material || "")} · ${g.full ? `<span class="okt">ganz aus ${g.uses.length === 1 ? "einem Rest" : g.uses.length + " Resten"} möglich, spart eine Platte</span>` : `${partsOf(g.p).length - g.left.length} von ${partsOf(g.p).length} Teilen passen auf Reste`}</div>
        ${g.uses.map((u) => {
          const pct = Math.round(u.area / (u.rest.length * u.rest.width) * 100);
          const mine = u.rest.reservedFor && u.rest.reservedFor.job === state.jobId;
          return `<div class="sugr"><span><b>${esc(u.rest.no)}</b> ${fmt(u.rest.length)} × ${fmt(u.rest.width)}${u.rest.location ? " · " + esc(u.rest.location) : ""}</span>
            <span class="note">${u.parts.map(lbl).join(", ")} · ca. ${pct} % belegt</span>
            <span class="acts"><button class="btn sm${mine ? " primary" : ""}" data-resv-rest="${u.rest.id}">${mine ? "Vorgemerkt" : "Vormerken"}</button>
            <button class="btn sm primary" data-move-rest="${u.rest.id}" data-plate="${g.i}" data-parts="${esc(u.parts.map((t) => t.id).join(","))}">Auf Rest schneiden</button></span></div>`;
        }).join("")}</div>`).join("");
    return `<section class="ov-sec"><h2>Reste verwenden</h2>${rows}
      <p class="note">Abgleich nach Material, Stärke und Zuschnittmaß (mit ${state.allow || 0} mm Zugabe und ${KERF} mm Sägeschnitt), Teile werden nicht gedreht: Das erste Maß liegt bei Teil und Rest in Faserrichtung. „Auf Rest schneiden“ nimmt die Teile aus ihrer Platte und legt für den Rest einen eigenen Reiter an. Bleibt die Platte dabei leer, entfällt sie. Die Anordnung auf dem Rest ist ein einfacher Vorschlag, die genauen Schnitte werden an der Säge festgelegt.</p></section>`;
  }

  // ---------- Teile auf einen Rest umlegen ----------
  function savePlan() { if (!isSample()) LS.set("zs.current", { id: state.jobId, plan: state.plan }); }
  function adjustReservation(p, delta) {
    const r = stock.reservations[state.jobId], k = mkey(p.material, p.thickness, p.length, p.width);
    if (r && r.mats && k in r.mats) r.mats[k] = Math.max(0, (r.mats[k] || 0) + delta);
  }
  function moveToRest(restId, plateIdx, partIds) {
    const plan = state.plan, p = plates()[plateIdx], r = stock.items.find((i) => i.id === restId);
    if (!p || !r) return;
    const parts = partsOf(p).filter((t) => partIds.includes(t.id) && !state.done[t.id]);
    const fit = packInto(r, parts);
    if (!fit.length) { toast("Die Teile passen nicht mehr auf den Rest", false); return; }
    const rp = { id: "RP-" + r.id, name: "Rest " + r.no, isRest: true, order: (p.order != null ? p.order : plateIdx) + 0.5, fromRest: r.id, restNo: r.no,
      material: p.material, thickness: p.thickness, length: +r.length, width: +r.width,
      parts: fit.map((t) => Object.assign({}, t, fit.xy.get(t), { origPlate: p.id, origX: t.x, origY: t.y })) };
    const moved = new Set(fit.map((t) => t.id));
    p.parts = p.parts.filter((t) => !moved.has(t.id));
    partCache.delete(p);
    plan.removedPlates = plan.removedPlates || [];
    let msg = `${fit.length} Teile von ${plateTitle(p, plateIdx)} auf Rest ${r.no}`;
    if (!partsOf(p).length) {
      plan.plates = plan.plates.filter((q) => q !== p); plan.removedPlates.push(p);
      adjustReservation(p, -1);
      msg += ", Platte entfällt";
    }
    plan.plates.push(rp);
    sortPlates(plan);
    r.reservedFor = { job: state.jobId, project: plan.project || "", nr: orderInfo().nr || "" };
    stockChanged(`Rest ${r.no} verplant für ${orderInfo().nr || plan.project || ""}`);
    savePlan();
    state.plateIdx = plates().indexOf(rp); persistSel();
    render(); toast(msg, false);
  }
  function moveBack(rp) {
    const plan = state.plan;
    if (stock.bookings[bookingKey(rp)]) { toast("Der Rest ist schon fertig zugeschnitten und gebucht", false); return; }
    rp.parts.forEach((t) => {
      let p = plates().find((q) => q.id === t.origPlate);
      if (!p) {
        const i = (plan.removedPlates || []).findIndex((q) => q.id === t.origPlate);
        if (i >= 0) { p = plan.removedPlates.splice(i, 1)[0]; plan.plates.push(p); adjustReservation(p, +1); }
      }
      if (!p) return;
      const back = Object.assign({}, t, { x: t.origX, y: t.origY });
      delete back.origPlate; delete back.origX; delete back.origY;
      p.parts.push(back); partCache.delete(p);
    });
    plan.plates = plan.plates.filter((q) => q !== rp);
    const r = stock.items.find((i) => i.id === rp.fromRest);
    if (r && r.reservedFor && r.reservedFor.job === state.jobId) delete r.reservedFor;
    sortPlates(plan);
    stockChanged(`Rest ${rp.restNo} wieder freigegeben`);
    savePlan(); state.plateIdx = -1; persistSel(); render();
    toast("Teile zurück auf ihre Platte gelegt", false);
  }
  function plateTitle(p, i) { return p && p.isRest ? "Rest " + (p.restNo || "") : "Platte " + (p && p.no != null ? p.no : i + 1); }

  // ---------- Rest nach dem Zuschnitt ----------
  // Freie Flächen einer Platte nach dem Zuschnitt: größte leere Rechtecke, die sich nicht überlappen.
  // Länge = Richtung der Plattenlänge (Faserrichtung), Breite quer dazu.
  const REST_MIN = [700, 500];
  function freeRests(p) {
    const L = +p.length, W = +p.width, ts = partsOf(p);
    const xs = [...new Set([0, L, ...ts.flatMap((t) => [+t.x, +t.x + +t.l])].map((v) => Math.max(0, Math.min(L, v))))].sort((a, b) => a - b);
    const ys = [...new Set([0, W, ...ts.flatMap((t) => [+t.y, +t.y + +t.w])].map((v) => Math.max(0, Math.min(W, v))))].sort((a, b) => a - b);
    const nx = xs.length - 1, ny = ys.length - 1;
    const occ = Array.from({ length: nx }, (_, i) => Array.from({ length: ny }, (_, j) => {
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      return ts.some((t) => cx > +t.x && cx < +t.x + +t.l && cy > +t.y && cy < +t.y + +t.w);
    }));
    const out = [];
    for (let round = 0; round < 8; round++) {
      let best = null;
      for (let i0 = 0; i0 < nx; i0++) {
        const free = Array(ny).fill(true);
        for (let i1 = i0; i1 < nx; i1++) {
          for (let j = 0; j < ny; j++) free[j] = free[j] && !occ[i1][j];
          let j0 = -1;
          for (let j = 0; j <= ny; j++) {
            if (j < ny && free[j]) { if (j0 < 0) j0 = j; continue; }
            if (j0 >= 0) {
              const x0 = xs[i0], x1 = xs[i1 + 1], y0 = ys[j0], y1 = ys[j];
              // Sägeschnitt an Kanten zu Teilen abziehen, nicht am Plattenrand
              const l = (x1 - x0) - (x0 > 0 ? KERF : 0) - (x1 < L ? KERF : 0);
              const w = (y1 - y0) - (y0 > 0 ? KERF : 0) - (y1 < W ? KERF : 0);
              const a = l * w;
              if (Math.max(l, w) >= REST_MIN[0] && Math.min(l, w) >= REST_MIN[1] && (!best || a > best.a)) best = { a, l, w, i0, i1, j0, j1: j - 1 };
              j0 = -1;
            }
          }
        }
      }
      if (!best) break;
      out.push({ l: Math.floor(best.l), w: Math.floor(best.w) });
      for (let i = best.i0; i <= best.i1; i++) for (let j = best.j0; j <= best.j1; j++) occ[i][j] = true;
    }
    return out;
  }
  function openRestDialog(p, idx) {
    const rests = freeRests(p);
    const dlg = $("restDlg");
    $("restTitle").textContent = `${plateTitle(p, idx)} fertig: Reste einlagern?`;
    $("restMat").textContent = `${p.material || "ohne Material"}${p.thickness ? " · " + fmt(p.thickness) + " mm" : ""} · erstes Maß in Faserrichtung`;
    const row = (r, k) => `<div class="restrow"><label class="cbx"><input type="checkbox" data-k="${k}"${r ? " checked" : ""}></label>
      <label>Länge <input type="number" inputmode="numeric" min="1" data-l="${k}" value="${r ? r.l : ""}"></label>
      <label>Breite <input type="number" inputmode="numeric" min="1" data-w="${k}" value="${r ? r.w : ""}"></label></div>`;
    $("restList").innerHTML = rests.map(row).join("") + row(null, rests.length);
    $("restNote").textContent = rests.length
      ? `Vorgeschlagen sind alle freien Flächen ab ${REST_MIN[0]} × ${REST_MIN[1]} mm, Sägeschnitt abgezogen. Maße bei Bedarf anpassen, die letzte Zeile ist für einen weiteren Rest.`
      : `Auf dieser Platte bleibt keine freie Fläche ab ${REST_MIN[0]} × ${REST_MIN[1]} mm. Ein Rest lässt sich trotzdem von Hand eintragen.`;
    $("restLoc").value = LS.get("zs.lastLoc", "");
    $("restLbl").checked = LS.get("zs.restLblOn", true);
    dlg.dataset.plate = idx;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }
  function addRest(o) {
    const no = "R-" + String(stock.nextRest++).padStart(4, "0");
    const it = { id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: "rest", no,
      material: o.material, thickness: +o.thickness || 0, length: +o.length, width: +o.width,
      location: o.location || "", date: new Date().toISOString(), from: o.from || "" };
    stock.items.push(it);
    stockChanged(`Rest ${no} eingelagert: ${o.material} ${fmt(it.length)} × ${fmt(it.width)}`);
    return it;
  }

  // ---------- Etikett für Restplatten ----------
  // Restetikett zum Umkleben über die Plattenkante: oberes Feld liegt auf der Oberseite,
  // der Mittelstreifen (so hoch wie die Plattenstärke) auf der Kante, das untere Feld
  // auf der Unterseite. Auf allen drei Flächen stehen Material, Stärke und Maß.
  async function restLabelSvg(it) {
    const W = ENTWURF.w, H = ENTWURF.h, F = "Arial, Helvetica, sans-serif";
    const T = (x, y, fs, txt, extra = "") => txt ? `<text x="${x}" y="${y}" font-size="${fs.toFixed(2)}" font-family="${F}" ${extra}>${esc(txt)}</text>` : "";
    const band = Math.max(10, Math.min(30, +it.thickness || 19)) / lblFaktor();       // Kantenstreifen: gedruckt so hoch wie die Plattenstärke
    const top = (H - band) / 2, y1 = top, y2 = top + band;
    const size = `${fmt(it.length)} × ${fmt(it.width)}`;
    const mat = it.material || "", th = it.thickness ? fmt(it.thickness) + " mm" : "";
    // Feld für Ober- und Unterseite (Unterseite um 180° gedreht, damit sie von unten lesbar ist)
    const face = (oy, h) => `
      ${T(3, oy + 6.5, 5.2, it.no, 'font-weight="700"')}
      ${T(3, oy + 13, fitFs(mat, 4, 46), mat, 'font-weight="600"')}
      ${T(3, oy + 19.5, fitFs(size + " mm · " + th, 3.8, 46), size + " mm · " + th)}
      ${T(3, oy + h - 2, 2.2, "Eingelagert " + new Date(it.date).toLocaleDateString("de-DE") + (it.location ? " · " + it.location : ""))}
      ${qrSvg(`${it.no}|${mat}|${it.thickness}|${it.length}x${it.width}`, W - 3 - Math.min(18, h - 4), oy + 2, Math.min(18, h - 4))}`;
    const edgeTxt = `${mat} · ${th} · ${size}`;
    const efs = Math.min(band * 0.42, fitFs(edgeTxt, 5.5, 64));
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${LBL.w}mm" height="${LBL.h}mm" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <rect width="${W}" height="${H}" fill="#fff"/>
      ${face(0, top)}
      <line x1="0" y1="${y1}" x2="${W}" y2="${y1}" stroke="#000" stroke-width="0.3" stroke-dasharray="1.5 1.2"/>
      <line x1="0" y1="${y2}" x2="${W}" y2="${y2}" stroke="#000" stroke-width="0.3" stroke-dasharray="1.5 1.2"/>
      ${T(W / 2, y1 + band / 2 - (band >= 16 ? efs * 0.35 : -efs * 0.35), efs, band >= 16 ? `${it.no} · ${mat}` : edgeTxt, 'text-anchor="middle" font-weight="700"')}
      ${band >= 16 ? T(W / 2, y1 + band / 2 + efs * 1.0, efs, `${th} · ${size} mm`, 'text-anchor="middle" font-weight="700"') : ""}
      <g transform="rotate(180 ${W / 2} ${(y2 + H) / 2})">${face(y2, H - y2)}</g>
    </svg>`;
  }
  async function printRestLabel(it) { return printRestLabels([it]); }
  async function printRestLabels(items) {
    if (!items.length) return;
    const svgs = await Promise.all(items.map(restLabelSvg));
    if (lblState.restMode === "zebra") {
      svgs.forEach((svg) => {
        lblState.busy = lblState.busy.then(async () => {
          try { await zebraSend(await zplForSvg(svg)); } catch (e) { toast("Etikett nicht gedruckt: " + (e.message || e), false); }
        });
      });
    } else await printSvgDialog(svgs);
  }

  // ---------- Datei öffnen und speichern ----------
  function applyStockFile(obj, name) {
    if (!obj || obj.format !== "jahresring-lager" || !Array.isArray(obj.items)) throw new Error(name + " ist keine Lagerdatei der Zuschnitt-App.");
    if (stockDirty && !confirm("Auf diesem Gerät gibt es ungespeicherte Lageränderungen. Trotzdem die Datei öffnen und die Änderungen verwerfen?")) return false;
    stock = Object.assign(emptyStock(), obj);
    stockDirty = false; stockLoaded = true; stockState.fileName = name; stock.savedAt = stock.savedAt || stock.updated;
    LS.set("zs.stock", stock); LS.set("zs.stockDirty", false); LS.set("zs.stockLoaded", true); LS.set("zs.stockName", name);
    toast(`Lager geöffnet: ${restItems().length} Reste, ${fullItems().reduce((s, i) => s + i.qty, 0)} Platten`, false);
    return true;
  }
  async function openStock() {
    if (BUERO) return bueroLaden(true);
    if (window.showOpenFilePicker) {
      try {
        const [h] = await window.showOpenFilePicker({ types: [{ description: "Lagerdatei", accept: { "application/json": [".json"] } }] });
        const f = await h.getFile();
        if (applyStockFile(JSON.parse(await f.text()), f.name)) await rememberHandle(h);
        render();
      } catch (e) { if (e && e.name !== "AbortError") toast(e.message || String(e), false); }
      return;
    }
    $("stockIn").click();
  }
  async function saveStock() {
    if (BUERO) return bueroSpeichern(false);
    const name = stockState.fileName || LS.get("zs.stockName", STOCK_FILE) || STOCK_FILE;
    const prevSaved = stock.savedAt;
    stock.savedAt = new Date().toISOString();
    const blob = new Blob([JSON.stringify(stock, null, 1)], { type: "application/json" });
    const done = () => { stockDirty = false; LS.set("zs.stock", stock); LS.set("zs.stockDirty", false); render(); };
    try {
      // Bekannte Datei direkt überschreiben (am PC); fragt höchstens einmal nach der Erlaubnis
      if (stockState.handle && stockState.handle.createWritable && await writable(stockState.handle)) {
        const w = await stockState.handle.createWritable(); await w.write(blob); await w.close();
        toast("Lager in " + stockState.handle.name + " gespeichert", false); done(); return;
      }
      if (window.showSaveFilePicker) {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "Lagerdatei", accept: { "application/json": [".json"] } }] });
        const w = await h.createWritable(); await w.write(blob); await w.close();
        await rememberHandle(h); toast("Lager in " + h.name + " gespeichert", false); done(); return;
      }
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Lager · Jahresring" });
        stockState.fileName = name; LS.set("zs.stockName", name);
        toast("Lager geteilt. Am Speicherort die alte Datei ersetzen.", false); done(); return;
      }
      await offerFile(name, blob); stockState.fileName = name; LS.set("zs.stockName", name); done();
    } catch (e) { stock.savedAt = prevSaved; if (e && e.name !== "AbortError") toast("Speichern nicht möglich: " + (e.message || e), false); }
  }

  // ---------- Beschaffung: reservierte Platten, die im Lager fehlen ----------
  function procurement() {
    const map = new Map();
    Object.entries(stock.reservations || {}).forEach(([jobId, r]) => {
      Object.entries(r.mats || {}).forEach(([k, n]) => {
        if (!(n > 0)) return;
        if (!map.has(k)) { const [material, thickness, length, width] = k.split("|"); map.set(k, { key: k, material, thickness: +thickness, length: +length, width: +width, reserved: 0, jobs: [] }); }
        const e = map.get(k); e.reserved += n; e.jobs.push({ project: r.project || "", n, job: jobId });
      });
    });
    Object.entries(stock.orders || {}).forEach(([k, o]) => {
      if (!map.has(k)) { const [material, thickness, length, width] = k.split("|"); map.set(k, { key: k, material, thickness: +thickness, length: +length, width: +width, reserved: 0, jobs: [] }); }
    });
    return [...map.values()].map((e) => {
      const it = fullItems().find((i) => mkey(i.material, i.thickness, i.length, i.width) === e.key);
      e.have = it ? it.qty : 0; e.item = it || null;
      e.order = (stock.orders || {})[e.key] || null;
      e.missing = Math.max(0, e.reserved - e.have);
      e.toOrder = Math.max(0, e.missing - (e.order ? e.order.qty : 0));
      return e;
    }).filter((e) => e.missing > 0 || e.order).sort((a, b) => a.material.localeCompare(b.material));
  }
  function procurementHtml() {
    const all = procurement();
    const rows = all.filter((e) => matchQ("proc", [e.material, fmt(e.thickness), `${e.length}x${e.width}`, ...e.jobs.map((j) => j.project)]));
    const total = all.reduce((s2, e) => s2 + e.missing, 0);
    if (!all.length) return foldSec("proc", "Zu beschaffen", 0, "Suchen: Material, Auftrag …", `<p class="note">Alle reservierten Platten sind im Lager vorhanden.</p>`);
    if (!rows.length) return foldSec("proc", "Zu beschaffen", total + " Platten", "Suchen: Material, Auftrag …", `<p class="note">Nichts passt zur Suche.</p>`);
    const tr = rows.map((e) => `<tr><td>${esc(e.material)}</td><td class="r">${fmt(e.thickness)}</td><td class="r">${mm(e.length)} × ${mm(e.width)}</td>
        <td class="r">${e.reserved}</td><td class="r">${e.have}</td><td class="r${e.toOrder > 0 ? " warn" : ""}"><b>${e.missing}</b></td>
        <td>${e.order ? `${e.order.qty} bestellt am ${new Date(e.order.date).toLocaleDateString("de-DE")}` : '<span class="note">nicht bestellt</span>'}</td>
        <td class="note jobs">${e.jobs.map((j) => `<div class="jobline">${esc(j.project)} (${j.n}) <button class="btn sm ghost xs" data-unres="platte" data-job="${esc(j.job)}" data-key="${esc(e.key)}" title="Reservierung stornieren">Stornieren</button></div>`).join("")}</td>
        <td class="acts"><button class="btn sm" data-proc="order" data-key="${esc(e.key)}" data-n="${e.toOrder || e.missing}">${e.order ? "Bestellung ändern" : "Bestellt"}</button><button class="btn sm" data-proc="in" data-key="${esc(e.key)}" data-n="${e.order ? e.order.qty : e.missing}">Wareneingang</button></td></tr>`).join("");
    return foldSec("proc", "Zu beschaffen", total + " Platten", "Suchen: Material, Auftrag …", `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Material</th><th class="r">Stärke</th><th class="r">Format mm</th><th class="r">Reserviert</th><th class="r">Im Lager</th><th class="r">Fehlen</th><th>Bestellung</th><th>Aufträge</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>
      <div class="ov-actions"><button class="btn sm" data-proc="copy">Bestellliste kopieren</button></div>
      <p class="note">Rot heißt: noch nicht (vollständig) bestellt. „Wareneingang“ bucht die gelieferten Platten in den Bestand und schließt die Bestellung. „Stornieren“ hebt die Reservierung des Auftrags für dieses Material auf.</p>`);
  }
  async function procAction(b) {
    const k = b.dataset.key, act = b.dataset.proc;
    if (act === "copy") {
      const txt = procurement().filter((e) => e.missing > 0).map((e) => `${e.missing} Stk. ${e.material}, ${fmt(e.thickness)} mm, ${mm(e.length)} × ${mm(e.width)} mm`).join("\n");
      try { await navigator.clipboard.writeText(txt); toast("Bestellliste kopiert", false); } catch (err) { prompt("Bestellliste zum Kopieren:", txt.replace(/\n/g, " · ")); }
      return;
    }
    const [material, thickness, length, width] = k.split("|");
    if (act === "order") {
      const v = prompt(`Wie viele Platten ${material} wurden bestellt? (0 = Bestellung löschen)`, b.dataset.n);
      if (v == null) return;
      const n = Math.max(0, Math.round(+v || 0));
      stock.orders = stock.orders || {};
      if (n > 0) { stock.orders[k] = { qty: n, date: new Date().toISOString() }; stockChanged(`${n} Platten ${material} bestellt`); }
      else { delete stock.orders[k]; stockChanged(`Bestellung ${material} gelöscht`); }
    }
    if (act === "in") {
      const v = prompt(`Wie viele Platten ${material} sind angekommen?`, b.dataset.n);
      if (v == null) return;
      const n = Math.max(0, Math.round(+v || 0)); if (!n) return;
      let it = fullItems().find((i) => mkey(i.material, i.thickness, i.length, i.width) === k);
      if (!it) { it = { id: "p" + Date.now().toString(36), kind: "platte", material, thickness: +thickness, length: +length, width: +width, qty: 0, location: "" }; stock.items.push(it); }
      it.qty += n;
      if (stock.orders && stock.orders[k]) { stock.orders[k].qty -= n; if (stock.orders[k].qty <= 0) delete stock.orders[k]; }
      stockChanged(`Wareneingang: ${n} Platten ${material}`);
      toast(`${n} Platten ${material} eingebucht`, false);
    }
    render();
  }

  // ---------- Zuklappbare Abschnitte mit Suche ----------
  const folds = (() => { const f = LS.get("zs.folds", {}); return f && typeof f === "object" ? f : {}; })();
  const qOf = (k) => String(LS.get("zs.q." + k, "") || "");
  const matchQ = (k, parts) => { const q = qOf(k).toLowerCase().trim(); return !q || q.split(/\s+/).every((w) => parts.join(" ").toLowerCase().includes(w)); };
  function foldSec(k, title, count, ph, body) {
    const open = !folds[k];
    return `<section class="ov-sec fold-sec">
      <div class="sechead"><button type="button" class="foldbtn" data-fold="${k}" aria-expanded="${open}"><span class="chev">${open ? "▾" : "▸"}</span> ${title}${count != null ? ` <span class="cnt">${count}</span>` : ""}</button>
        <input class="search" type="search" data-q="${k}" placeholder="${ph}" value="${esc(qOf(k))}"></div>
      <div class="secbody"${open ? "" : " hidden"}>${body}</div></section>`;
  }

  // ---------- Reservierungen (stornierbar) ----------
  function reservationsHtml() {
    const rows = [];
    Object.entries(stock.reservations || {}).forEach(([job, r]) => {
      Object.entries(r.mats || {}).forEach(([k, n]) => {
        const [material, thickness, length, width] = k.split("|");
        rows.push({ job, project: r.project || "", kind: "platte", key: k, material, thickness: +thickness, size: `${mm(+length)} × ${mm(+width)}`, n });
      });
    });
    restItems().filter((i) => i.reservedFor).forEach((i) => rows.push({ job: i.reservedFor.job, project: i.reservedFor.project || i.reservedFor.nr || "", kind: "rest", id: i.id,
      material: i.material, thickness: i.thickness, size: `${fmt(i.length)} × ${fmt(i.width)}`, n: i.no }));
    const shown = rows.filter((r) => matchQ("resv", [r.project, r.material, r.size, String(r.n)])).sort((a, b) => a.project.localeCompare(b.project) || a.material.localeCompare(b.material));
    const jobs = [...new Set(shown.map((r) => r.job))];
    const tr = shown.map((r) => `<tr><td>${esc(r.project || "ohne Namen")}</td><td>${r.kind === "rest" ? "Rest " + esc(r.n) : "Platten"}</td><td>${esc(r.material)}</td><td class="r">${fmt(r.thickness)}</td><td class="r">${r.size}</td>
        <td class="r">${r.kind === "rest" ? 1 : r.n}</td>
        <td class="acts"><button class="btn sm ghost" data-unres="${r.kind}" data-job="${esc(r.job)}" data-key="${esc(r.key || "")}" data-id="${esc(r.id || "")}">Stornieren</button></td></tr>`).join("");
    return foldSec("resv", "Reservierungen", rows.length, "Suchen: Auftrag, Material …", rows.length ? `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Auftrag</th><th>Art</th><th>Material</th><th class="r">Stärke</th><th class="r">Maß mm</th><th class="r">Anzahl</th><th></th></tr></thead><tbody>${tr || '<tr><td colspan="7" class="note">Nichts passt zur Suche.</td></tr>'}</tbody></table></div>
      ${jobs.length ? `<div class="ov-actions">${jobs.map((j) => { const r = rows.find((x) => x.job === j); return `<button class="btn sm" data-unres="job" data-job="${esc(j)}">Alles für ${esc(r.project || "Auftrag")} stornieren</button>`; }).join("")}</div>` : ""}
      <p class="note">Stornieren gibt die Platten bzw. den Rest wieder frei. Bereits gebuchte Platten bleiben gebucht. Für vom Projekt in einen Rest-Reiter verlegte Teile das Projekt öffnen und dort „Zurück auf Platte“ verwenden.</p>`
      : `<p class="note">Keine Reservierungen.</p>`);
  }
  function unreserve(b) {
    const kind = b.dataset.unres, job = b.dataset.job;
    if (kind === "platte") {
      const r = stock.reservations[job]; if (!r) return;
      const [mat] = b.dataset.key.split("|");
      delete r.mats[b.dataset.key];
      if (!Object.keys(r.mats).length) delete stock.reservations[job];
      stockChanged(`Reservierung ${mat} für ${r.project || "Auftrag"} storniert`);
    }
    if (kind === "rest") {
      const it = stock.items.find((i) => i.id === b.dataset.id); if (!it) return;
      const pr = (it.reservedFor && it.reservedFor.project) || "";
      delete it.reservedFor; stockChanged(`Vormerkung ${it.no} für ${pr} storniert`);
    }
    if (kind === "job") {
      const pr = (stock.reservations[job] && stock.reservations[job].project) || (restItems().find((i) => i.reservedFor && i.reservedFor.job === job) || {}).reservedFor?.project || "Auftrag";
      if (!confirm(`Alle Reservierungen für „${pr}“ stornieren?`)) return;
      delete stock.reservations[job];
      restItems().forEach((i) => { if (i.reservedFor && i.reservedFor.job === job) delete i.reservedFor; });
      stockChanged(`Alle Reservierungen für ${pr} storniert`);
    }
    render();
  }

  // ---------- Ansicht "Lager" ----------
  function renderStock() {
    const q = qOf("rest");
    const mats = [...new Set([...stock.items.map((i) => i.material), ...plates().map((p) => p.material)].filter(Boolean))].sort();
    const fullAll = fullItems();
    const full = fullAll.filter((i) => matchQ("full", [i.material, fmt(i.thickness), `${i.length}x${i.width}`, i.location || ""])).sort((a, b) => (a.material || "").localeCompare(b.material || "") || a.thickness - b.thickness);
    const fromSel = LS.get("zs.restFrom", "");
    const froms = [...new Set(restItems().map((i) => i.from || "").filter(Boolean))].sort();
    const rests = restItems().filter((i) => (!fromSel || (i.from || "") === fromSel) && matchQ("rest", [i.no, i.material, i.location || "", i.from || "", fmt(i.thickness), `${i.length}x${i.width}`]))
      .sort((a, b) => (a.material || "").localeCompare(b.material || "") || b.length * b.width - a.length * a.width);
    const name = (stockState.handle && stockState.handle.name) || stockState.fileName || LS.get("zs.stockName", null);
    const fullRows = full.map((i) => {
      const res = itemReserved(i), free = i.qty - res;
      return `<tr><td>${esc(i.material)}</td><td class="r">${fmt(i.thickness)}</td><td class="r">${mm(i.length)} × ${mm(i.width)}</td>
        <td class="r"><b>${i.qty}</b></td><td class="r">${res}</td><td class="r${free < 0 ? " warn" : ""}">${free}</td><td>${esc(i.location || "")}</td>
        <td class="acts"><button class="btn sm" data-act="dec" data-id="${i.id}" aria-label="Eine Platte weniger">−</button><button class="btn sm" data-act="inc" data-id="${i.id}" aria-label="Eine Platte mehr">+</button><button class="btn sm ghost" data-act="delfull" data-id="${i.id}">Entfernen</button></td></tr>`;
    }).join("") || `<tr><td colspan="8" class="note">${fullAll.length ? "Nichts passt zur Suche." : "Noch keine Platten eingetragen."}</td></tr>`;
    const restRows = rests.map((i) => `<tr><td><b>${esc(i.no)}</b></td><td>${esc(i.material)}</td><td class="r">${fmt(i.thickness)}</td>
        <td class="r"><b>${fmt(i.length)} × ${fmt(i.width)}</b></td><td class="r">${(i.length * i.width / 1e6).toLocaleString("de-DE", { maximumFractionDigits: 2 })}</td>
        <td>${esc(i.location || "")}</td><td>${new Date(i.date).toLocaleDateString("de-DE")}</td><td class="note">${esc(i.from || "")}${i.reservedFor ? `<br><b class="resvd">vorgemerkt ${esc(i.reservedFor.nr || i.reservedFor.project || "")}</b> <button class="btn sm ghost xs" data-unres="rest" data-id="${i.id}">Stornieren</button>` : ""}</td>
        <td class="acts"><button class="btn sm" data-act="lbl" data-id="${i.id}">Etikett</button><button class="btn sm ghost" data-act="use" data-id="${i.id}">Verbraucht</button></td></tr>`).join("")
      || `<tr><td colspan="9" class="note">${q ? "Kein Rest passt zur Suche." : "Noch keine Restplatten im Lager."}</td></tr>`;
    const opts = mats.map((m) => `<option value="${esc(m)}">`).join("");
    $("stockView").innerHTML = `<div class="ov-wrap">
      <div class="ov-head"><div><h1>Lager</h1><div class="meta">${stockLoaded ? `${esc(name || "Lager (noch nicht gespeichert)")}${stock.savedAt ? " · gespeichert " + new Date(stock.savedAt).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : ""}${stockState.handle ? " · Speichern überschreibt diese Datei" : ""}` : "Noch keine Lagerdatei geöffnet"}
        ${stockDirty ? ' · <span class="dirty">ungespeicherte Änderungen</span>' : ""}</div></div>
        <div class="ov-actions"><button class="btn" id="stockOpen">${BUERO ? "Neu laden" : "Lager öffnen"}</button><button class="btn${stockDirty ? " primary" : ""}" id="stockSave"${stockLoaded ? "" : " disabled"}>Lager speichern</button>${stockLoaded || BUERO ? "" : '<button class="btn" id="stockNew">Neues Lager anlegen</button>'}</div></div>
      ${BUERO ? `<p class="note">Das Lager liegt in Jahresring (Lager › Reste) und wird automatisch gespeichert – PC und Tablet haben immer denselben Stand.</p>` : ""}
      ${stockLoaded || BUERO ? "" : `<p class="note">Die Lagerdatei liegt an einem gemeinsamen Speicherort, damit Tablet und PC denselben Stand haben. Erstmals: „Neues Lager anlegen“, eintragen, „Lager speichern“ und die Datei dort ablegen. Danach immer zuerst „Lager öffnen“, am Ende „Lager speichern“.</p>`}
      <datalist id="matList">${opts}</datalist>
      ${stockLoaded ? procurementHtml() : ""}
      ${foldSec("full", "Platten im Bestand", fullAll.reduce((s2, i) => s2 + i.qty, 0) + " Stk.", "Suchen: Material, Stärke, Lagerort …", `
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Material</th><th class="r">Stärke</th><th class="r">Format mm</th><th class="r">Anzahl</th><th class="r">Reserviert</th><th class="r">Frei</th><th>Lagerort</th><th></th></tr></thead><tbody>${fullRows}</tbody></table></div>
        <form class="addrow" id="addFull"><input name="material" list="matList" placeholder="Material" required><input name="thickness" type="number" step="0.1" placeholder="Stärke" required>
          <input name="length" type="number" placeholder="Länge" value="2800" required><input name="width" type="number" placeholder="Breite" value="2070" required>
          <input name="qty" type="number" min="1" placeholder="Anzahl" value="1" required><input name="location" placeholder="Lagerort"><button class="btn" type="submit"${stockLoaded ? "" : " disabled"}>Platten eintragen</button></form>`)}
      ${foldSec("rest", "Restplatten", restItems().length, "Suchen: Material, Nummer, Maß, Lagerort, Herkunft …", `
        <div class="lblset"><label>Herkunft <select id="restFrom"><option value="">alle</option>${froms.map((f) => `<option value="${esc(f)}"${f === fromSel ? " selected" : ""}>${esc(f)}</option>`).join("")}</select></label>
        <label>Restetiketten <select class="lblRestMode">${["dialog", "zebra"].map((v) => `<option value="${v}"${lblState.restMode === v ? " selected" : ""}>${v === "zebra" ? "direkt auf Zebra (Bluetooth)" : "über Druckdialog (normaler Drucker)"}</option>`).join("")}</select></label>
        ${lblState.restMode === "zebra" ? `<button class="btn sm lblConnect">${lblState.ch ? "Drucker verbunden" : "Drucker verbinden"}</button>` : ""}</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nr.</th><th>Material</th><th class="r">Stärke</th><th class="r">Maß mm</th><th class="r">m²</th><th>Lagerort</th><th>Eingelagert</th><th>Herkunft</th><th></th></tr></thead><tbody>${restRows}</tbody></table></div>
        <form class="addrow" id="addRest"><input name="material" list="matList" placeholder="Material" required><input name="thickness" type="number" step="0.1" placeholder="Stärke" required>
          <input name="length" type="number" placeholder="Länge (Faser)" required><input name="width" type="number" placeholder="Breite" required><input name="location" placeholder="Lagerort">
          <label class="cbx"><input type="checkbox" name="lbl"${LS.get("zs.restLblOn", true) ? " checked" : ""}> Etikett</label><button class="btn" type="submit"${stockLoaded ? "" : " disabled"}>Rest eintragen</button></form>`)}
      ${stock.log.length ? `<section class="ov-sec"><h2>Letzte Buchungen</h2><ul class="log">${stock.log.slice(0, 15).map((l) => `<li><span class="note">${new Date(l.t).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}</span> ${esc(l.msg)}</li>`).join("")}</ul></section>` : ""}
    </div>`;
  }

  function stockEvents() {
    $("stockIn").addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      try { if (applyStockFile(JSON.parse(await f.text()), f.name)) render(); } catch (err) { toast(err.message || String(err), false); }
    });
    $("stockView").addEventListener("click", async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.fold) { const k = b.dataset.fold; folds[k] = !folds[k]; LS.set("zs.folds", folds); renderStock(); return; }
      if (b.dataset.proc) return procAction(b);
      if (b.dataset.unres) return unreserve(b);
      if (b.id === "stockOpen") return openStock();
      if (b.id === "stockSave") return saveStock();
      if (b.id === "stockNew") { stock = emptyStock(); stockState.fileName = null; LS.del("zs.stockName"); await rememberHandle(null); stockChanged("Neues Lager angelegt"); render(); return; }
      const it = stock.items.find((i) => i.id === b.dataset.id); if (!it) return;
      const act = b.dataset.act;
      if (act === "inc") { it.qty += 1; stockChanged(`+1 Platte ${it.material}`); }
      if (act === "dec" && it.qty > 0) { it.qty -= 1; stockChanged(`−1 Platte ${it.material}`); }
      if (act === "delfull" && confirm(`${it.material} ${mm(it.length)} × ${mm(it.width)} aus der Liste entfernen?`)) { stock.items = stock.items.filter((x) => x !== it); stockChanged(`Platteneintrag ${it.material} entfernt`); }
      if (act === "use") { it.used = new Date().toISOString(); it.usedFor = "von Hand"; stockChanged(`Rest ${it.no} verbraucht`); toast(`Rest ${it.no} ausgebucht`, false); }
      if (act === "lbl") { printRestLabel(it); return; }
      render();
    });
    $("stockView").addEventListener("change", (e) => {
      if (e.target.id === "restFrom") { LS.set("zs.restFrom", e.target.value); renderStock(); }
    });
    $("stockView").addEventListener("input", (e) => {
      const k = e.target.dataset && e.target.dataset.q; if (!k) return;
      LS.set("zs.q." + k, e.target.value);
      if (e.target.value && folds[k]) { folds[k] = false; LS.set("zs.folds", folds); }   // Suchen klappt auf
      const pos = e.target.selectionStart; renderStock();
      const q = $("stockView").querySelector(`[data-q="${k}"]`); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {}
    });
    $("stockView").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target), v = (k) => String(f.get(k) || "").trim();
      if (e.target.id === "addFull") {
        const o = { material: v("material"), thickness: +v("thickness"), length: +v("length"), width: +v("width") };
        const ex = fullItems().find((i) => i.material === o.material && same(i.thickness, o.thickness, 0.6) && sameSize(i.length, i.width, o.length, o.width));
        if (ex) { ex.qty += +v("qty") || 1; if (v("location")) ex.location = v("location"); }
        else stock.items.push(Object.assign({ id: "p" + Date.now().toString(36), kind: "platte", qty: +v("qty") || 1, location: v("location") }, o));
        stockChanged(`+${+v("qty") || 1} Platten ${o.material} ${mm(o.length)} × ${mm(o.width)}`);
      }
      if (e.target.id === "addRest") {
        const it = addRest({ material: v("material"), thickness: v("thickness"), length: v("length"), width: v("width"), location: v("location"), from: "von Hand" });
        if (v("location")) LS.set("zs.lastLoc", v("location"));
        if (f.get("lbl")) printRestLabel(it);
      }
      render();
    });
    $("overview").addEventListener("click", (e) => {
      const mv = e.target.closest("[data-move-rest]");
      if (mv) { moveToRest(mv.dataset.moveRest, +mv.dataset.plate, mv.dataset.parts.split(",")); return; }
      const b = e.target.closest("[data-resv-rest]"); if (!b) return;
      const r = stock.items.find((i) => i.id === b.dataset.resvRest); if (!r) return;
      if (r.reservedFor && r.reservedFor.job === state.jobId) { delete r.reservedFor; stockChanged(`Vormerkung ${r.no} aufgehoben`); }
      else { r.reservedFor = { job: state.jobId, project: currentPlan().project || "", nr: orderInfo().nr || "" }; stockChanged(`Rest ${r.no} vorgemerkt für ${orderInfo().nr || currentPlan().project || ""}`); }
      render();
    });
    $("overview").addEventListener("change", (e) => {
      const c = e.target.closest("input.resv"); if (!c) return;
      setReservation(c.dataset.key, c.checked, +c.dataset.need); render();
    });
    $("restList").addEventListener("input", (e) => {
      const k = e.target.dataset.l || e.target.dataset.w; if (k == null) return;
      const c = $("restList").querySelector(`[data-k="${k}"]`); if (c && e.target.value) c.checked = true;
    });
    $("restForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const dlg = $("restDlg"), p = plates()[+dlg.dataset.plate];
      if (e.submitter && e.submitter.value === "skip") { dlg.close(); return; }
      const loc = $("restLoc").value.trim();
      if (loc) LS.set("zs.lastLoc", loc);
      const added = [];
      $("restList").querySelectorAll("input[data-k]").forEach((c) => {
        const k = c.dataset.k, l = +$("restList").querySelector(`[data-l="${k}"]`).value, w = +$("restList").querySelector(`[data-w="${k}"]`).value;
        if (!p || !(l > 0 && w > 0) || !c.checked) return;
        added.push(addRest({ material: p.material, thickness: p.thickness, length: l, width: w, location: loc, from: (orderInfo().nr || currentPlan().project || "") }));
      });
      LS.set("zs.restLblOn", $("restLbl").checked);
      if ($("restLbl").checked) printRestLabels(added);
      if (added.length) toast(added.length === 1 ? `Rest ${added[0].no} eingelagert` : `${added.length} Reste eingelagert (${added[0].no} bis ${added[added.length - 1].no})`, false);
      dlg.close(); render();
    });
  }

  function toggle(id) {
    const p = plates()[state.plateIdx];
    const t = partsOf(p).find((x) => x.id === id);
    const nowDone = !doneMap()[id];
    setDone([id], nowDone, `${t ? label(t) || "Teil" : "Teil"} ${nowDone ? "erledigt" : "wieder offen"}`);
    if (nowDone && navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
    if (nowDone && t) printLabel(t, p);
  }

  // Abhaken: einmal tippen. Zurücknehmen: doppelt tippen auf ein erledigtes Teil.
  let lastTap = { id: null, t: 0 };
  $("plan").addEventListener("click", (e) => {
    if (suppressClick) return;
    const g = e.target.closest(".part");
    if (!g) return;
    const id = g.dataset.id, now = Date.now();
    if (!doneMap()[id]) { toggle(id); lastTap = { id: null, t: 0 }; return; }
    if (lastTap.id === id && now - lastTap.t < 450) { lastTap = { id: null, t: 0 }; toggle(id); return; }
    lastTap = { id, t: now };
    toast("Zum Zurücknehmen doppelt tippen", false);
  });
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (!b) return;
    state.plateIdx = +b.dataset.i; persistSel(); render();
  });
  $("fileIn").addEventListener("change", (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) importFiles(files);
  });
  $("undoBtn").addEventListener("click", () => {
    if (!state.undo) return;
    const dm = doneMap();
    Object.entries(state.undo).forEach(([id, v]) => { if (v) dm[id] = true; else delete dm[id]; });
    state.undo = null;
    saveProgress();
    $("toast").hidden = true;
    stockReconcile(false);
    render();
  });
  // Zugabe für das Zuschnittmaß, bleibt auf diesem Gerät gespeichert
  $("allowIn").value = state.allow;
  $("allowIn").addEventListener("change", (e) => {
    let v = Math.round(+e.target.value);
    if (!(v >= 0 && v <= 200)) v = 20;
    state.allow = v; e.target.value = v; LS.set("zs.allow", v); render();
  });
  stockEvents();
  $("startStock").addEventListener("click", () => { state.plateIdx = -2; persistSel(); render(); });
  // Projekt schließen: Plan vom Gerät nehmen. Der Bearbeitungsstand bleibt gespeichert
  // und ist wieder da, wenn dieselbe Datei erneut geöffnet wird.
  $("closeBtn").addEventListener("click", () => {
    if (isSample()) return;
    const name = currentPlan().project || "Projekt";
    if (!confirm(`„${name}“ schließen?\n\nDer Bearbeitungsstand bleibt auf diesem Gerät gespeichert und ist wieder da, wenn die Datei erneut geöffnet wird.`)) return;
    LS.del("zs.current");
    state.plan = null; state.jobId = null; state.done = {}; state.undo = null;
    if (state.plateIdx !== -2) state.plateIdx = -1;
    persistSel(); render();
    toast(name + " geschlossen", false);
  });
  let stockBack = -1;
  $("stockBtn").addEventListener("click", () => {
    if (state.plateIdx === -2) state.plateIdx = stockBack; else { stockBack = state.plateIdx; state.plateIdx = -2; }
    persistSel(); render();
  });
  $("backBtn").addEventListener("click", () => {
    const p = plates()[state.plateIdx];
    if (p && p.isRest && confirm("Teile wieder auf ihre ursprüngliche Platte legen und den Rest freigeben?")) moveBack(p);
  });
  $("allBtn").addEventListener("click", () => {
    const p = plates()[state.plateIdx];
    setDone(partsOf(p).map((t) => t.id), true, plateTitle(p, state.plateIdx) + " komplett erledigt");
  });
  $("resetBtn").addEventListener("click", () => {
    const p = plates()[state.plateIdx];
    setDone(partsOf(p).map((t) => t.id), false, plateTitle(p, state.plateIdx) + " zurückgesetzt");
  });

  let rz = null;
  // Beim Öffnen der Bildschirmtastatur ändert sich die Fenstergröße. Dann nicht neu zeichnen,
  // sonst verliert das Eingabefeld den Fokus und die Tastatur schließt sofort wieder.
  window.addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if (state.plateIdx < 0) return;          // Übersicht und Lager hängen nicht von der Fenstergröße ab
      render();
    }, 120);
  });

  // Bildschirm an der Säge wach halten
  async function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", wake);
  wake();

  // Offline-Betrieb: App-Dateien auf dem Gerät zwischenspeichern
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  // ---------- Start ----------
  // Browser bitten, den Speicher nicht automatisch zu leeren
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  loadLocal();
  render();
  if (BUERO) {
    (async () => {
      if (stockDirty) await bueroSpeichern(true); else await bueroLaden(false);
      const aid = new URLSearchParams(location.search).get("auftrag");
      if (aid) {
        try {
          const r = await fetch(BUERO.api + "auftraege/" + encodeURIComponent(aid) + "/zuschnittplan", { credentials: "same-origin" });
          const d = await r.json();
          if (!r.ok) throw new Error(d.fehler || ("HTTP " + r.status));
          d.plan.bueroAuftrag = +aid; d.plan.bueroNr = d.auftrag_nr || "";
          await importFiles([{ name: d.dateiname, text: async () => JSON.stringify(d.plan) }]);
        } catch (e) { toast(e.message || String(e), false); }
      }
    })();
    // Wenn das Tablet wieder in den Vordergrund kommt: Lager aktualisieren
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !stockDirty) bueroLaden(false); });
  }

})();
</script>

</body></html>
